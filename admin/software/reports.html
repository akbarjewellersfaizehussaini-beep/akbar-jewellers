<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
  <style>
    .report-btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .report-btn { background: linear-gradient(135deg, var(--black-soft), #252525); border: 2px solid rgba(255,215,0,0.3); border-radius: 16px; padding: 25px 20px; text-align: center; cursor: pointer; transition: all 0.4s; }
    .report-btn:hover { border-color: var(--gold-primary); transform: translateY(-5px); box-shadow: 0 15px 40px rgba(255,215,0,0.2); }
    .report-btn .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .report-btn .label { color: var(--gold-primary); font-weight: 700; font-size: 1rem; }
    .report-view { display: none; }
    .report-view.active { display: block; }
    .report-table { width: 100%; border-collapse: collapse; background: var(--black-soft); border-radius: 12px; overflow: hidden; }
    .report-table th { background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05)); color: var(--gold-primary); padding: 12px; text-align: left; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; }
    .report-table td { padding: 12px; border-bottom: 1px solid rgba(255,215,0,0.08); font-size: 0.88rem; }
    .report-table tr { cursor: pointer; }
    .report-table tr:hover { background: rgba(255,215,0,0.05); }
    .drill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .drill-title { font-family: var(--font-heading); font-size: 1.5rem; color: var(--gold-primary); }
    .split-view { display: grid; grid-template-columns: 40% 60%; gap: 20px; }
    .split-left { background: var(--black-soft); border-radius: 12px; padding: 15px; max-height: 60vh; overflow-y: auto; }
    .split-right { background: #fff; color: #1A1A1A; border-radius: 12px; padding: 25px; max-height: 60vh; overflow-y: auto; }
    .invoice-list-item { padding: 10px; background: var(--black-royal); border: 1px solid rgba(255,215,0,0.2); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    .invoice-list-item:hover, .invoice-list-item.active { border-color: var(--gold-primary); background: rgba(255,215,0,0.1); }
    @media (max-width: 768px) { .split-view { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Reports
    </div>
    <button onclick="goBack('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Business Reports</h1>
    <p class="page-subtitle">Har report — Print + WhatsApp</p>

    <div class="report-btn-grid" id="reportButtons">
      <div class="report-btn" onclick="openReport('daily-sales')"><div class="icon">📊</div><div class="label">Daily Sales</div></div>
      <div class="report-btn" onclick="openReport('weekly-sales')"><div class="icon">📅</div><div class="label">Weekly Sales</div></div>
      <div class="report-btn" onclick="openReport('monthly-sales')"><div class="icon">📆</div><div class="label">Monthly Sales</div></div>
      <div class="report-btn" onclick="openReport('yearly-sales')"><div class="icon">📈</div><div class="label">Yearly Sales</div></div>
      <div class="report-btn" onclick="openReport('expenses')"><div class="icon">💸</div><div class="label">Expenses</div></div>
      <div class="report-btn" onclick="openReport('payments')"><div class="icon">💳</div><div class="label">Payments</div></div>
      <div class="report-btn" onclick="openReport('stock')"><div class="icon">📦</div><div class="label">Available Stock</div></div>
    </div>

    <div id="reportView" class="report-view">
      <div class="drill-header">
        <button class="btn-secondary" onclick="closeReport()" style="padding:8px 16px;">← Back</button>
        <h2 class="drill-title" id="reportTitle">Report</h2>
        <button class="btn-primary" onclick="printElement('reportContent')" style="padding:8px 16px;">🖨 Print</button>
      </div>
      <div id="reportContent"></div>
    </div>
  </div>

  <div id="invoiceModal" class="modal">
    <div class="modal-content" style="max-width: 1100px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 class="modal-title" style="margin:0;" id="invoicePopupTitle">Invoices</h2>
        <button onclick="document.getElementById('invoiceModal').classList.remove('active')" style="background:none; border:none; color:var(--gold-primary); font-size:1.5rem; cursor:pointer;">×</button>
      </div>
      <div class="split-view">
        <div class="split-left"><div id="invoiceListContainer"></div></div>
        <div class="split-right" id="invoiceDetailContainer"><p style="text-align:center; color:#999; padding:60px;">← Click invoice</p></div>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let currentReport = null;
    let allData = { sales: [], purchases: [], expenses: [], payments: [], products: [], customers: [], suppliers: [], karigars: [], services: [], returns: [] };
    let currentInvoiceList = [];
    let shopInfo = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'sales', 'purchase'])) return;
      if (typeof clearCache === 'function') clearCache();
      shopInfo = await getShopSettings();
      await loadAllData();
    });

    async function loadAllData() {
      allData.sales = await getRecordsFast('sales', true);
      allData.purchases = await getRecordsFast('purchases', true);
      allData.expenses = await getRecordsFast('expenses', true);
      allData.payments = await getRecordsFast('payments', true);
      allData.products = await getRecordsFast('products', true);
      allData.customers = await getRecordsFast('customers', true);
      allData.suppliers = await getRecordsFast('suppliers', true);
      allData.karigars = await getRecordsFast('karigars', true);
      allData.services = await getRecordsFast('services', true);
      allData.returns = await getRecordsFast('returns', true);
    }

    function openReport(type) {
      currentReport = type;
      document.getElementById('reportButtons').style.display = 'none';
      document.getElementById('reportView').classList.add('active');
      if (type === 'daily-sales') renderDailySales();
      else if (type === 'weekly-sales') renderWeeklySales();
      else if (type === 'monthly-sales') renderMonthlySales();
      else if (type === 'yearly-sales') renderYearlySales();
      else if (type === 'expenses') renderExpenseReport();
      else if (type === 'payments') renderPaymentReport();
      else if (type === 'stock') renderStockReport();
    }

    function closeReport() {
      currentReport = null;
      document.getElementById('reportButtons').style.display = 'grid';
      document.getElementById('reportView').classList.remove('active');
    }

    function renderDailySales() {
      document.getElementById('reportTitle').textContent = '📊 Daily Sales';
      const byDate = {};
      allData.sales.forEach(s => {
        const d = (s.sale_date || s.date || '').slice(0, 10);
        if (!d) return;
        if (!byDate[d]) byDate[d] = { date: d, invoices: [], total: 0 };
        byDate[d].invoices.push(s);
        byDate[d].total += Number(s.total) || 0;
      });
      const dates = Object.values(byDate).sort((a, b) => new Date(b.date) - new Date(a.date));
      document.getElementById('reportContent').innerHTML = `
        <table class="report-table">
          <thead><tr><th>Date</th><th>Invoices</th><th style="text-align:right;">Total</th></tr></thead>
          <tbody>${dates.length === 0 ? '<tr><td colspan="3" style="text-align:center; padding:30px;">No sales</td></tr>' : dates.map(d => `<tr onclick="showInvoices('${d.date}', 'date')"><td>${formatDate(d.date)}</td><td>${d.invoices.length}</td><td style="text-align:right; color:var(--gold-primary); font-weight:700;">${formatPKR(d.total)}</td></tr>`).join('')}</tbody>
        </table>
      `;
    }

    function renderWeeklySales() {
      document.getElementById('reportTitle').textContent = '📅 Weekly Sales';
      const byWeek = {};
      allData.sales.forEach(s => {
        const d = s.sale_date || s.date;
        if (!d) return;
        const date = new Date(d);
        const start = new Date(date); start.setDate(date.getDate() - date.getDay());
        const key = start.toISOString().slice(0, 10);
        if (!byWeek[key]) byWeek[key] = { weekStart: key, invoices: [], total: 0 };
        byWeek[key].invoices.push(s);
        byWeek[key].total += Number(s.total) || 0;
      });
      const weeks = Object.values(byWeek).sort((a, b) => b.weekStart.localeCompare(a.weekStart));
      document.getElementById('reportContent').innerHTML = `
        <table class="report-table">
          <thead><tr><th>Week Start</th><th>Invoices</th><th style="text-align:right;">Total</th></tr></thead>
          <tbody>${weeks.length === 0 ? '<tr><td colspan="3" style="text-align:center; padding:30px;">No sales</td></tr>' : weeks.map(w => `<tr onclick="showInvoices('${w.weekStart}', 'week')"><td>${formatDate(w.weekStart)}</td><td>${w.invoices.length}</td><td style="text-align:right; color:var(--gold-primary); font-weight:700;">${formatPKR(w.total)}</td></tr>`).join('')}</tbody>
        </table>
      `;
    }

    function renderMonthlySales() {
      document.getElementById('reportTitle').textContent = '📆 Monthly Sales';
      const byMonth = {};
      allData.sales.forEach(s => {
        const m = (s.sale_date || s.date || '').slice(0, 7);
        if (!m) return;
        if (!byMonth[m]) byMonth[m] = { month: m, invoices: [], total: 0 };
        byMonth[m].invoices.push(s);
        byMonth[m].total += Number(s.total) || 0;
      });
      const months = Object.values(byMonth).sort((a, b) => b.month.localeCompare(a.month));
      document.getElementById('reportContent').innerHTML = `
        <table class="report-table">
          <thead><tr><th>Month</th><th>Invoices</th><th style="text-align:right;">Total</th></tr></thead>
          <tbody>${months.length === 0 ? '<tr><td colspan="3" style="text-align:center; padding:30px;">No sales</td></tr>' : months.map(m => `<tr onclick="showInvoices('${m.month}', 'month')"><td>${m.month}</td><td>${m.invoices.length}</td><td style="text-align:right; color:var(--gold-primary); font-weight:700;">${formatPKR(m.total)}</td></tr>`).join('')}</tbody>
        </table>
      `;
    }

    function renderYearlySales() {
      document.getElementById('reportTitle').textContent = '📈 Yearly Sales';
      const byYear = {};
      allData.sales.forEach(s => {
        const y = (s.sale_date || s.date || '').slice(0, 4);
        if (!y) return;
        if (!byYear[y]) byYear[y] = { year: y, invoices: [], total: 0 };
        byYear[y].invoices.push(s);
        byYear[y].total += Number(s.total) || 0;
      });
      const years = Object.values(byYear).sort((a, b) => b.year.localeCompare(a.year));
      document.getElementById('reportContent').innerHTML = `
        <table class="report-table">
          <thead><tr><th>Year</th><th>Invoices</th><th style="text-align:right;">Total</th></tr></thead>
          <tbody>${years.length === 0 ? '<tr><td colspan="3" style="text-align:center; padding:30px;">No sales</td></tr>' : years.map(y => `<tr onclick="showInvoices('${y.year}', 'year')"><td>${y.year}</td><td>${y.invoices.length}</td><td style="text-align:right; color:var(--gold-primary); font-weight:700;">${formatPKR(y.total)}</td></tr>`).join('')}</tbody>
        </table>
      `;
    }

    function renderExpenseReport() {
      document.getElementById('reportTitle').textContent = '💸 Expenses';
      const groups = {};
      allData.expenses.forEach(e => {
        const d = (e.expense_date || e.date || '').slice(0, 10);
        if (!d) return;
        if (!groups[d]) groups[d] = { date: d, count: 0, total: 0 };
        groups[d].count++;
        groups[d].total += Number(e.amount) || 0;
      });
      const sorted = Object.values(groups).sort((a, b) => b.date.localeCompare(a.date));
      document.getElementById('reportContent').innerHTML = `
        <table class="report-table">
          <thead><tr><th>Date</th><th>Entries</th><th style="text-align:right;">Total</th></tr></thead>
          <tbody>${sorted.length === 0 ? '<tr><td colspan="3" style="text-align:center; padding:30px;">No expenses</td></tr>' : sorted.map(g => `<tr><td>${formatDate(g.date)}</td><td>${g.count}</td><td style="text-align:right; color:#FCA5A5; font-weight:700;">${formatPKR(g.total)}</td></tr>`).join('')}</tbody>
        </table>
      `;
    }

    function renderPaymentReport() {
      document.getElementById('reportTitle').textContent = '💳 Payments';
      const groups = {};
      allData.payments.forEach(p => {
        const d = (p.payment_date || p.date || '').slice(0, 10);
        if (!d) return;
        if (!groups[d]) groups[d] = { date: d, in: 0, out: 0, count: 0 };
        groups[d].count++;
        const amt = Number(p.amount) || 0;
        if (p.person_type === 'customer') groups[d].in += amt; else groups[d].out += amt;
      });
      const sorted = Object.values(groups).sort((a, b) => b.date.localeCompare(a.date));
      document.getElementById('reportContent').innerHTML = `
        <table class="report-table">
          <thead><tr><th>Date</th><th>Entries</th><th style="text-align:right;">In</th><th style="text-align:right;">Out</th><th style="text-align:right;">Total</th></tr></thead>
          <tbody>${sorted.length === 0 ? '<tr><td colspan="5" style="text-align:center; padding:30px;">No payments</td></tr>' : sorted.map(g => `<tr><td>${formatDate(g.date)}</td><td>${g.count}</td><td style="text-align:right; color:#86EFAC;">${formatPKR(g.in)}</td><td style="text-align:right; color:#FCA5A5;">${formatPKR(g.out)}</td><td style="text-align:right; color:var(--gold-primary); font-weight:700;">${formatPKR(g.in + g.out)}</td></tr>`).join('')}</tbody>
        </table>
      `;
    }

    function renderStockReport() {
      document.getElementById('reportTitle').textContent = '📦 Available Stock';
      const stats = calculateAllProductsStats(allData.products, allData.purchases, allData.sales, allData.returns);
      const withStock = stats.filter(s => s.currentStock > 0);
      let totalValue = 0;
      withStock.forEach(s => { totalValue += s.currentStock * (Number(s.product.cost_price) || 0); });
      document.getElementById('reportContent').innerHTML = `
        <div style="background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(255,215,0,0.05)); border:2px solid var(--gold-primary); border-radius:12px; padding:20px; margin-bottom:20px; text-align:center;">
          <div style="color:var(--text-muted); font-size:0.85rem;">Total Inventory Value</div>
          <div style="color:var(--gold-primary); font-family:var(--font-heading); font-size:2rem; font-weight:700;">${formatPKR(totalValue)}</div>
        </div>
        <table class="report-table">
          <thead><tr><th>Product ID</th><th>Name</th><th>Stock</th><th>Per pc Wt</th><th style="text-align:right;">Cost/pc</th><th style="text-align:right;">Total Value</th></tr></thead>
          <tbody>${withStock.length === 0 ? '<tr><td colspan="6" style="text-align:center; padding:30px;">No stock</td></tr>' : withStock.map(s => `<tr><td style="font-family:var(--font-mono); color:#93C5FD;">${s.productCode}</td><td>${s.productName}</td><td>${s.currentStock}</td><td>${s.perPieceWeight.toFixed(3)}g</td><td style="text-align:right;">${formatPKR(s.product.cost_price)}</td><td style="text-align:right; color:var(--gold-primary); font-weight:700;">${formatPKR(s.currentStock * (Number(s.product.cost_price) || 0))}</td></tr>`).join('')}</tbody>
        </table>
      `;
    }

    function showInvoices(value, type) {
      let invoices = [];
      if (type === 'date') invoices = allData.sales.filter(s => (s.sale_date || s.date || '').slice(0, 10) === value);
      else if (type === 'week') invoices = allData.sales.filter(s => {
        const d = s.sale_date || s.date; if (!d) return false;
        const date = new Date(d); const start = new Date(date); start.setDate(date.getDate() - date.getDay());
        return start.toISOString().slice(0, 10) === value;
      });
      else if (type === 'month') invoices = allData.sales.filter(s => (s.sale_date || s.date || '').slice(0, 7) === value);
      else if (type === 'year') invoices = allData.sales.filter(s => (s.sale_date || s.date || '').slice(0, 4) === value);
      currentInvoiceList = invoices;
      document.getElementById('invoicePopupTitle').textContent = value + ' (' + invoices.length + ')';
      document.getElementById('invoiceListContainer').innerHTML = invoices.map((inv, idx) => `
        <div class="invoice-list-item" onclick="selectInvoice(${idx})">
          <div style="color:var(--gold-primary); font-weight:700;">${inv.invoice_number}</div>
          <div style="color:var(--text-muted); font-size:0.75rem;">${inv.customer_name} • ${formatDate(inv.sale_date)}</div>
          <div style="color:var(--gold-primary); font-family:var(--font-mono); font-weight:700;">${formatPKR(inv.total)}</div>
        </div>
      `).join('');
      document.getElementById('invoiceDetailContainer').innerHTML = '<p style="text-align:center; color:#999; padding:60px;">← Click invoice</p>';
      document.getElementById('invoiceModal').classList.add('active');
    }

    function selectInvoice(idx) {
      const s = currentInvoiceList[idx];
      document.querySelectorAll('.invoice-list-item').forEach((el, i) => el.classList.toggle('active', i === idx));
      document.getElementById('invoiceDetailContainer').innerHTML = `
        <h2 style="color:#D4AF37; margin-bottom:15px;">${s.invoice_number}</h2>
        <p><strong>Customer:</strong> ${s.customer_name}</p>
        <p><strong>Date:</strong> ${formatDate(s.sale_date)}</p>
        <p><strong>Item:</strong> ${s.items_summary}</p>
        <p><strong>Qty:</strong> ${s.qty}</p>
        <p><strong>Total:</strong> ${formatPKR(s.total)}</p>
        <p><strong>Received:</strong> ${formatPKR(s.received)}</p>
        <p><strong>Balance:</strong> ${formatPKR(s.balance)}</p>
        <p><strong>Type:</strong> ${s.payment_type === 'full' ? 'CASH' : 'CREDIT'}</p>
      `;
    }
  </script>
</body>
</html>
