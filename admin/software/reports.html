<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports – Akbar Jewellers Software</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
  <style>
    .filter-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .letterpad { background: #FFFDF5; color: #1A1A1A; padding: 30px; border-radius: 8px; border: 2px solid #D4AF37; margin-top: 20px; font-family: 'Poppins', sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow-x: auto; }
    .letterpad-header { text-align: center; border-bottom: 3px double #D4AF37; padding-bottom: 20px; margin-bottom: 20px; }
    .letterpad-header h1 { font-family: 'Playfair Display', serif; color: #D4AF37; margin: 0; font-size: 26px; letter-spacing: 1px; }
    .letterpad-header .urdu { font-family: 'Noto Nastaliq Urdu', serif; color: #D4AF37; font-size: 18px; margin: 5px 0; direction: rtl; }
    .letterpad-header p { margin: 3px 0; font-size: 11px; color: #666; }
    .letterpad-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .letterpad-table th { background: #FAF7F0; color: #D4AF37; padding: 10px 8px; text-align: left; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #D4AF37; white-space: nowrap; }
    .letterpad-table td { padding: 10px 8px; border-bottom: 1px solid #EEE; font-size: 12px; vertical-align: top; }
    .letterpad-table tr { cursor: pointer; }
    .letterpad-table tr:hover { background: #FDFBF7; }
    .letterpad-total { text-align: right; padding-top: 15px; border-top: 2px solid #D4AF37; font-size: 16px; font-weight: 700; color: #D4AF37; }
    .letterpad-footer { text-align: center; margin-top: 30px; padding-top: 15px; border-top: 1px solid #EEE; font-size: 10px; color: #999; }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">Reports</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Business Reports</h1>

    <div class="category-tabs">
      <button class="cat-tab gold active" onclick="switchReport('sales', this)">Sales</button>
      <button class="cat-tab silver" onclick="switchReport('purchases', this)">Purchases</button>
      <button class="cat-tab diamond" onclick="switchReport('expenses', this)">Expenses</button>
      <button class="cat-tab artificial" onclick="switchReport('debtors', this)">Debtors</button>
      <button class="cat-tab gold" onclick="switchReport('creditors', this)">Creditors</button>
    </div>

    <div class="filter-card">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date Filter</label>
          <select id="dateFilter" class="form-select" onchange="loadReport(currentReport)">
            <option value="all">All Time</option>
            <option value="today">Today</option>
            <option value="week">This Week</option>
            <option value="month">This Month</option>
            <option value="year">This Year</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Action</label>
          <div style="display:flex; gap:10px;">
            <button class="btn-secondary" onclick="printElement('printableReport')" style="flex:1;">Print Report</button>
            <button class="btn-secondary" onclick="sendReportWhatsApp()" style="flex:1; background:#25D366; color:white; border:none;">WhatsApp</button>
          </div>
        </div>
      </div>
    </div>

    <div id="reportContent"></div>
  </div>

  <div id="invoiceModal" class="modal">
    <div class="modal-content" style="max-width: 800px; background:#fff; color:#1A1A1A; padding: 40px;">
      <div id="printableInvoice"></div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-primary" onclick="printElement('printableInvoice')" style="flex:1;">Print Invoice</button>
        <button class="btn-secondary" onclick="sendInvoiceWhatsApp()" style="flex:1; background:#25D366; color:white; border:none;">Send WhatsApp</button>
        <button class="btn-danger" onclick="document.getElementById('invoiceModal').classList.remove('active')" style="flex:1;">Close</button>
      </div>
    </div>
  </div>

  <script src="../../js/supabase.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let currentReport = 'sales';
    let currentData = [];
    let currentTotal = 0;
    let shopInfo = null;
    let currentInvoice = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'sales', 'purchase'])) return;
      shopInfo = await getShopSettings();
      loadReport('sales');
    });

    async function switchReport(type, btn) {
      currentReport = type;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      await loadReport(type);
    }

    async function loadReport(type) {
      const container = document.getElementById('reportContent');
      container.innerHTML = '<p style="text-align:center; padding:30px; color:#FFD700;">Loading...</p>';
      
      const range = document.getElementById('dateFilter').value;
      let rawData = [];
      let title = '';
      let amountKey = 'total';
      
      if (type === 'sales') {
        rawData = await getRecordsFast('sales');
        title = 'SALES REPORT';
        amountKey = 'total';
      }
      else if (type === 'purchases') {
        rawData = await getRecordsFast('purchases');
        title = 'PURCHASE REPORT';
        amountKey = 'total';
      }
      else if (type === 'expenses') {
        rawData = await getRecordsFast('expenses');
        title = 'EXPENSE REPORT';
        amountKey = 'amount';
      }
      else if (type === 'debtors') {
        const s = await getRecordsFast('sales');
        rawData = s.filter(x => Number(x.balance) > 0);
        title = 'DEBTORS REPORT';
        amountKey = 'balance';
      }
      else if (type === 'creditors') {
        const p = await getRecordsFast('purchases');
        const s = await getRecordsFast('services');
        const duePurchases = p.filter(x => Number(x.balance) > 0).map(x => ({...x, person: x.supplier_name, desc: 'Purchase - ' + x.item}));
        const dueServices = s.filter(x => Number(x.balance) > 0).map(x => ({...x, person: x.karigar_name, desc: 'Job - ' + x.item, balance: x.balance}));
        rawData = [...duePurchases, ...dueServices];
        title = 'CREDITORS REPORT';
        amountKey = 'balance';
      }

      currentData = filterByDate(rawData, range);
      currentTotal = currentData.reduce((sum, x) => sum + (Number(x[amountKey]) || 0), 0);

      const rangeText = document.getElementById('dateFilter').options[document.getElementById('dateFilter').selectedIndex].text;

      let tableHeaders = '';
      if (type === 'sales') {
        tableHeaders = `<tr><th>Date</th><th>Customer / Item</th><th>Qty</th><th>Weight</th><th>Rate</th><th style="text-align:right;">Total</th></tr>`;
      } else if (type === 'purchases') {
        tableHeaders = `<tr><th>Date</th><th>Supplier / Item</th><th>Weight</th><th>Rate</th><th style="text-align:right;">Total</th></tr>`;
      } else {
        tableHeaders = `<tr><th>Date</th><th>Details</th><th style="text-align:right;">Amount</th></tr>`;
      }

      container.innerHTML = `
        <div class="letterpad" id="printableReport">
          <div class="letterpad-header">
            <h1>${shopInfo.name || 'AKBAR JEWELLERS'}</h1>
            <p class="urdu">${shopInfo.name_urdu || 'فیض حسینی'}</p>
            <p>${shopInfo.address || ''}</p>
            <p>Phone: ${shopInfo.phone || ''}</p>
            <hr style="border:none; border-top:1px solid #D4AF37; margin:10px 0;">
            <h3 style="font-family:'Playfair Display',serif; color:#1A1A1A; margin:5px 0;">${title}</h3>
            <p style="font-size:11px;">Period: ${rangeText} | Generated: ${formatDate(new Date())}</p>
            <p style="font-size:10px; color:#888;">💡 Click on any row to view full invoice</p>
          </div>
          <table class="letterpad-table">
            <thead>${tableHeaders}</thead>
            <tbody>
              ${currentData.length === 0 ? '<tr><td colspan="6" style="text-align:center; padding:20px; color:#999;">No records found</td></tr>' : 
                currentData.map((x, idx) => {
                  if (type === 'sales') {
                    return `
                      <tr onclick='viewSaleInvoice(${JSON.stringify(x).replace(/'/g, "&#39;")})'>
                        <td>${formatDate(x.date)}</td>
                        <td><strong>${x.customer_name}</strong><br><span style="font-size:11px; color:#666;">${x.items_summary}</span></td>
                        <td>${x.qty || 1}</td>
                        <td>${x.weight || 0}g</td>
                        <td>${formatPKR(x.rate)}</td>
                        <td style="text-align:right; font-weight:600;">${formatPKR(x.total)}</td>
                      </tr>
                    `;
                  } else if (type === 'purchases') {
                    return `
                      <tr onclick='viewPurchaseInvoice(${JSON.stringify(x).replace(/'/g, "&#39;")})'>
                        <td>${formatDate(x.date)}</td>
                        <td><strong>${x.supplier_name}</strong><br><span style="font-size:11px; color:#666;">${x.item}</span></td>
                        <td>${x.weight || 0}g</td>
                        <td>${formatPKR(x.rate)}</td>
                        <td style="text-align:right; font-weight:600;">${formatPKR(x.total)}</td>
                      </tr>
                    `;
                  } else {
                    return `
                      <tr>
                        <td>${formatDate(x.date)}</td>
                        <td>
                          ${type === 'debtors' ? `<strong>${x.customer_name}</strong> - ${x.items_summary}` : ''}
                          ${type === 'creditors' ? `<strong>${x.person}</strong> - ${x.desc}` : ''}
                          ${type === 'expenses' ? `<strong>${(x.category||'').toUpperCase()}</strong> ${x.paid_to ? '- ' + x.paid_to : ''}` : ''}
                        </td>
                        <td style="text-align:right; font-weight:600;">${formatPKR(x[amountKey])}</td>
                      </tr>
                    `;
                  }
                }).join('')}
            </tbody>
          </table>
          <div class="letterpad-total">TOTAL: ${formatPKR(currentTotal)}</div>
          <div class="letterpad-footer">
            This is a computer-generated report. Thank you!<br>
            ${shopInfo.name || 'AKBAR JEWELLERS'} © ${new Date().getFullYear()}
            <div style="color:#D4AF37; font-family:'Noto Nastaliq Urdu',serif; direction:rtl; margin-top:8px;">${shopInfo.tagline || 'Diamond aur Kundan Antique Jewellery ke Expert'}</div>
          </div>
        </div>
      `;
    }

    async function viewSaleInvoice(sale) {
      currentInvoice = sale;
      const shop = shopInfo || await getShopSettings();
      
      const qty = sale.qty || 1;
      const weight = sale.weight || 0;
      const rate = sale.rate || 0;
      const making = sale.making || 0;
      const totalWeight = qty * weight;
      const metal = totalWeight * rate;
      const makingTotal = making * qty;
      const polish = Math.round(metal * 0.10);
      const subtotal = metal + makingTotal + polish;
      const gst = Math.round(subtotal * ((sale.gst_pct || 3) / 100));
      
      document.getElementById('printableInvoice').innerHTML = `
        <div class="invoice-container">
          <div style="text-align:center; border-bottom:2px solid #D4AF37; padding-bottom:15px; margin-bottom:20px;">
            <h1 style="font-family:'Playfair Display',serif; color:#D4AF37; margin:0; font-size:28px;">${shop.name}</h1>
            <p style="margin:5px 0; font-size:16px; color:#D4AF37; font-family:'Noto Nastaliq Urdu',serif;" dir="rtl">${shop.name_urdu || 'فیض حسینی'}</p>
            <p style="margin:5px 0; font-size:12px; color:#666;">${shop.address}</p>
            <p style="margin:5px 0; font-size:12px; color:#666;">Phone: ${shop.phone}</p>
          </div>
          
          <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <div>
              <p style="margin:0; font-size:14px;"><strong>Invoice #:</strong> ${sale.invoice_number}</p>
              <p style="margin:5px 0; font-size:14px;"><strong>Date:</strong> ${formatDate(sale.sale_date || sale.created_at)}</p>
            </div>
            <div style="text-align:right;">
              <p style="margin:0; font-size:14px;"><strong>Customer:</strong> ${sale.customer_name}</p>
              <p style="margin:5px 0; font-size:14px;"><strong>Phone:</strong> ${sale.customer_phone || '—'}</p>
            </div>
          </div>
          
          <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
            <thead>
              <tr style="background:#FAF7F0;">
                <th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Item</th>
                <th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Qty</th>
                <th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Weight</th>
                <th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Rate/g</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="border:1px solid #ddd; padding:10px; font-size:14px;">${sale.items_summary}</td>
                <td style="border:1px solid #ddd; padding:10px; font-size:14px;">${qty}</td>
                <td style="border:1px solid #ddd; padding:10px; font-size:14px;">${totalWeight.toFixed(3)}g</td>
                <td style="border:1px solid #ddd; padding:10px; font-size:14px;">${formatPKR(rate)}</td>
              </tr>
            </tbody>
          </table>
          
          <div style="background:#FAF7F0; padding:20px; border-radius:8px; margin-bottom:20px;">
            <h3 style="margin:0 0 15px 0; font-size:14px; color:#D4AF37; text-transform:uppercase; letter-spacing:1px;">💰 Price Breakdown</h3>
            
            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #E5E5E5;">
              <span style="font-size:13px; color:#666;">Metal Value (${totalWeight.toFixed(3)}g × ${formatPKR(rate)})</span>
              <strong style="font-size:14px; color:#1A1A1A;">${formatPKR(metal)}</strong>
            </div>
            
            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #E5E5E5;">
              <span style="font-size:13px; color:#666;">Making Charges</span>
              <strong style="font-size:14px; color:#1A1A1A;">${formatPKR(makingTotal)}</strong>
            </div>
            
            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #E5E5E5;">
              <span style="font-size:13px; color:#666;">Polish Charges (10%)</span>
              <strong style="font-size:14px; color:#1A1A1A;">${formatPKR(polish)}</strong>
            </div>
            
            <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:2px solid #D4AF37; margin-top:5px;">
              <span style="font-size:13px; color:#D4AF37; font-weight:700;">Subtotal</span>
              <strong style="font-size:15px; color:#D4AF37;">${formatPKR(subtotal)}</strong>
            </div>
            
            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #E5E5E5;">
              <span style="font-size:13px; color:#666;">GST (${sale.gst_pct || 3}%)</span>
              <strong style="font-size:14px; color:#1A1A1A;">${formatPKR(gst)}</strong>
            </div>
            
            <div style="display:flex; justify-content:space-between; padding:12px 0; border-top:2px solid #D4AF37; margin-top:5px;">
              <span style="font-size:16px; color:#D4AF37; font-weight:700;">TOTAL</span>
              <strong style="font-size:20px; color:#D4AF37;">${formatPKR(sale.total)}</strong>
            </div>
          </div>
          
          <div style="text-align:right; font-size:14px; margin-bottom:10px;">
            <p style="margin:5px 0;">Received: <strong>${formatPKR(sale.received)}</strong></p>
            <p style="margin:5px 0;">Balance: <strong style="color:${sale.balance > 0 ? '#DC2626' : '#25D366'};">${formatPKR(sale.balance)}</strong></p>
          </div>
          
          <div style="text-align:center; margin-top:40px; font-size:12px; color:#888; border-top:1px solid #eee; padding-top:15px;">
            Thank you for shopping with ${shop.name}
            <div style="color:#D4AF37; font-family:'Noto Nastaliq Urdu',serif; direction:rtl; margin-top:10px;">${shop.tagline || ''}</div>
          </div>
        </div>
      `;
      document.getElementById('invoiceModal').classList.add('active');
    }

    async function viewPurchaseInvoice(purchase) {
      currentInvoice = purchase;
      const shop = shopInfo || await getShopSettings();
      
      document.getElementById('printableInvoice').innerHTML = `
        <div class="invoice-container">
          <div style="text-align:center; border-bottom:2px solid #D4AF37; padding-bottom:15px; margin-bottom:20px;">
            <h1 style="font-family:'Playfair Display',serif; color:#D4AF37; margin:0; font-size:28px;">${shop.name}</h1>
            <p style="margin:5px 0; font-size:16px; color:#D4AF37; font-family:'Noto Nastaliq Urdu',serif;" dir="rtl">${shop.name_urdu || 'فیض حسینی'}</p>
            <p style="margin:5px 0; font-size:12px; color:#666;">${shop.address}</p>
          </div>
          <h2 style="text-align:center; color:#1A1A1A; font-family:'Playfair Display',serif; margin-bottom:20px;">PURCHASE BILL</h2>
          <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <div>
              <p style="margin:0; font-size:14px;"><strong>Purchase #:</strong> ${purchase.invoice_no}</p>
              <p style="margin:5px 0; font-size:14px;"><strong>Date:</strong> ${formatDate(purchase.purchase_date || purchase.created_at)}</p>
            </div>
            <div style="text-align:right;">
              <p style="margin:0; font-size:14px;"><strong>Supplier:</strong> ${purchase.supplier_name}</p>
              <p style="margin:5px 0; font-size:14px;"><strong>Phone:</strong> ${purchase.supplier_phone || '—'}</p>
            </div>
          </div>
          <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
            <thead>
              <tr style="background:#FAF7F0;">
                <th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Item</th>
                <th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Qty</th>
                <th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Weight</th>
                <th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Rate/g</th>
                <th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Total</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="border:1px solid #ddd; padding:10px; font-size:14px;">${purchase.item}</td>
                <td style="border:1px solid #ddd; padding:10px; font-size:14px;">${purchase.qty || 1}</td>
                <td style="border:1px solid #ddd; padding:10px; font-size:14px;">${((purchase.qty || 1) * (purchase.weight || 0)).toFixed(3)}g</td>
                <td style="border:1px solid #ddd; padding:10px; font-size:14px;">${formatPKR(purchase.rate)}</td>
                <td style="border:1px solid #ddd; padding:10px; font-size:14px;">${formatPKR(purchase.total)}</td>
              </tr>
            </tbody>
          </table>
          <div style="text-align:right; font-size:14px; margin-bottom:10px;">
            <p style="margin:5px 0;">Paid: <strong>${formatPKR(purchase.paid)}</strong></p>
            <p style="margin:5px 0;">Balance: <strong style="color:${purchase.balance > 0 ? '#DC2626' : '#25D366'};">${formatPKR(purchase.balance)}</strong></p>
          </div>
          <div style="text-align:right; font-size:20px; font-weight:bold; color:#D4AF37; border-top:2px solid #D4AF37; padding-top:10px;">
            TOTAL: ${formatPKR(purchase.total)}
          </div>
        </div>
      `;
      document.getElementById('invoiceModal').classList.add('active');
    }

    function sendInvoiceWhatsApp() {
      if (!currentInvoice) return;
      
      if (currentInvoice.invoice_number) {
        // Sale invoice
        const qty = currentInvoice.qty || 1;
        const weight = currentInvoice.weight || 0;
        const rate = currentInvoice.rate || 0;
        const making = currentInvoice.making || 0;
        const totalWeight = qty * weight;
        const metal = totalWeight * rate;
        const makingTotal = making * qty;
        const polish = Math.round(metal * 0.10);
        const subtotal = metal + makingTotal + polish;
        const gst = Math.round(subtotal * ((currentInvoice.gst_pct || 3) / 100));
        
        const msg = `*INVOICE: ${currentInvoice.invoice_number}*\n\nCustomer: ${currentInvoice.customer_name}\nItem: ${currentInvoice.items_summary} (Qty: ${qty})\nWeight: ${totalWeight.toFixed(3)}g\nRate: ${formatPKR(rate)}/g\n\n*Breakdown:*\nMetal Value: ${formatPKR(metal)}\nMaking Charges: ${formatPKR(makingTotal)}\nPolish (10%): ${formatPKR(polish)}\nSubtotal: ${formatPKR(subtotal)}\nGST (${currentInvoice.gst_pct || 3}%): ${formatPKR(gst)}\n*TOTAL: ${formatPKR(currentInvoice.total)}*\n\nReceived: ${formatPKR(currentInvoice.received)}\nBalance: ${formatPKR(currentInvoice.balance)}\n\nThank you!`;
        openWhatsApp(currentInvoice.customer_phone, msg);
      } else if (currentInvoice.invoice_no) {
        // Purchase invoice
        const msg = `*PURCHASE BILL: ${currentInvoice.invoice_no}*\nSupplier: ${currentInvoice.supplier_name}\nItem: ${currentInvoice.item}\nTotal: ${formatPKR(currentInvoice.total)}\nPaid: ${formatPKR(currentInvoice.paid)}\nBalance: ${formatPKR(currentInvoice.balance)}`;
        openWhatsApp(currentInvoice.supplier_phone, msg);
      }
    }

    function sendReportWhatsApp() {
      if (currentData.length === 0) { alert('No data to send'); return; }
      
      const rangeText = document.getElementById('dateFilter').options[document.getElementById('dateFilter').selectedIndex].text;
      const title = currentReport.toUpperCase() + ' REPORT';
      const amountKey = currentReport === 'expenses' ? 'amount' : (currentReport === 'debtors' || currentReport === 'creditors' ? 'balance' : 'total');
      
      let msg = `*${shopInfo.name}*\n*${title}*\nPeriod: ${rangeText}\nDate: ${formatDate(new Date())}\n\n`;
      
      currentData.forEach((x, i) => {
        let desc = '';
        if (currentReport === 'sales') desc = `${x.customer_name} - ${x.items_summary} | Total: ${formatPKR(x.total)}`;
        else if (currentReport === 'purchases') desc = `${x.supplier_name} - ${x.item} | Total: ${formatPKR(x.total)}`;
        else if (currentReport === 'expenses') desc = `${(x.category||'').toUpperCase()}: ${formatPKR(x.amount)}`;
        else if (currentReport === 'debtors') desc = `${x.customer_name}: ${formatPKR(x.balance)}`;
        else if (currentReport === 'creditors') desc = `${x.person}: ${formatPKR(x.balance)}`;
        
        msg += `${i+1}. ${desc}\n`;
      });
      
      msg += `\n*TOTAL: ${formatPKR(currentTotal)}*`;
      
      const phone = prompt('Enter WhatsApp number:', '');
      if (phone) openWhatsApp(phone, msg);
    }
  </script>
</body>
</html>
