<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
  <style>
    .filter-card { background: var(--black-soft); border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .letterpad { background: #FFFDF5; color: #1A1A1A; padding: 30px; border-radius: 8px; border: 2px solid #D4AF37; margin-top: 20px; font-family: var(--font-body); box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow-x: auto; }
    .letterpad-header { text-align: center; border-bottom: 3px double #D4AF37; padding-bottom: 20px; margin-bottom: 20px; }
    .letterpad-header h1 { font-family: var(--font-heading); color: #D4AF37; margin: 0; font-size: 26px; letter-spacing: 1px; }
    .letterpad-header .urdu { font-family: var(--font-urdu); color: #D4AF37; font-size: 18px; margin: 5px 0; direction: rtl; }
    .letterpad-header p { margin: 3px 0; font-size: 11px; color: #666; }
    .letterpad-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .letterpad-table th { background: #FAF7F0; color: #D4AF37; padding: 10px 8px; text-align: left; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #D4AF37; white-space: nowrap; }
    .letterpad-table td { padding: 10px 8px; border-bottom: 1px solid #EEE; font-size: 12px; vertical-align: top; }
    .letterpad-table tr:hover { background: #FDFBF7; }
    .letterpad-total { text-align: right; padding-top: 15px; border-top: 2px solid #D4AF37; font-size: 16px; font-weight: 700; color: #D4AF37; }
    .letterpad-footer { text-align: center; margin-top: 30px; padding-top: 15px; border-top: 1px solid #EEE; font-size: 10px; color: #999; }
    .report-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .report-tab { padding: 10px 18px; background: var(--black-royal); border: 2px solid rgba(255,215,0,0.3); color: var(--text-light); border-radius: 50px; cursor: pointer; font-size: 0.8rem; font-family: var(--font-body); transition: all 0.3s; }
    .report-tab:hover { border-color: var(--gold-primary); }
    .report-tab.active { background: linear-gradient(135deg, var(--gold-primary), var(--gold-deep)); color: var(--black-royal); border-color: var(--gold-primary); font-weight: 700; }
    .summary-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .summary-item { background: #FAF7F0; padding: 12px; border-radius: 6px; text-align: center; border-left: 3px solid #D4AF37; }
    .summary-item .label { font-size: 10px; color: #666; text-transform: uppercase; }
    .summary-item .value { font-weight: 700; font-size: 14px; color: #D4AF37; margin-top: 3px; font-family: var(--font-mono); }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Reports
    </div>
    <button onclick="navigate('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Business Reports</h1>
    <p class="page-subtitle">Har report – Print + WhatsApp + Email</p>

    <!-- Report Tabs -->
    <div class="report-tabs">
      <button class="report-tab active" onclick="switchReport('sales', this)">💰 Sales</button>
      <button class="report-tab" onclick="switchReport('purchases', this)">📥 Purchases</button>
      <button class="report-tab" onclick="switchReport('expenses', this)">💸 Expenses</button>
      <button class="report-tab" onclick="switchReport('karigars', this)">👷 Karigars</button>
      <button class="report-tab" onclick="switchReport('suppliers', this)">🏭 Suppliers</button>
      <button class="report-tab" onclick="switchReport('customers', this)">👥 Customers</button>
      <button class="report-tab" onclick="switchReport('debtors', this)">📥 Debtors</button>
      <button class="report-tab" onclick="switchReport('creditors', this)">📤 Creditors</button>
      <button class="report-tab" onclick="switchReport('inventory', this)">📦 Inventory</button>
      <button class="report-tab" onclick="switchReport('profitloss', this)">📊 Profit/Loss</button>
      <button class="report-tab" onclick="switchReport('cashflow', this)">💵 Cash Flow</button>
    </div>

    <!-- Date Filter -->
    <div class="filter-card">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date Filter</label>
          <select id="dateFilter" class="form-select" onchange="loadReport(currentReport)">
            <option value="all">All Time</option>
            <option value="today">Today</option>
            <option value="week">This Week</option>
            <option value="month">This Month</option>
            <option value="year">This Year</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Actions</label>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn-secondary" onclick="printElement('printableReport')" style="flex:1; padding:10px;">🖨 Print</button>
            <button class="btn-success" onclick="sendReportWhatsApp()" style="flex:1; padding:10px;">📱 WhatsApp</button>
            <button class="btn-secondary" onclick="sendReportEmail()" style="flex:1; padding:10px; background:#3B82F6; color:white; border:none;">📧 Email</button>
          </div>
        </div>
      </div>
    </div>

    <div id="reportContent"></div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let currentReport = 'sales';
    let currentData = [];
    let currentTotal = 0;
    let shopInfo = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'sales', 'purchase'])) return;
      shopInfo = await getShopSettings();
      loadReport('sales');
    });

    async function switchReport(type, btn) {
      currentReport = type;
      document.querySelectorAll('.report-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      await loadReport(type);
    }

    async function loadReport(type) {
      const container = document.getElementById('reportContent');
      container.innerHTML = '<p style="text-align:center; padding:30px; color:var(--gold-primary);">Loading...</p>';
      
      const range = document.getElementById('dateFilter').value;
      let rawData = [];
      let title = '';
      let amountKey = 'total';
      let tableHeaders = '';
      let summaryHtml = '';
      
      // ===== SALES REPORT =====
      if (type === 'sales') {
        rawData = await getRecordsFast('sales');
        title = 'SALES REPORT';
        amountKey = 'total';
        currentData = filterByDate(rawData, range);
        currentTotal = currentData.reduce((sum, x) => sum + (Number(x.total) || 0), 0);
        
        const totalReceived = currentData.reduce((sum, x) => sum + (Number(x.received) || 0), 0);
        const totalBalance = currentData.reduce((sum, x) => sum + (Number(x.balance) || 0), 0);
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Sales</div><div class="value">${formatPKR(currentTotal)}</div></div>
            <div class="summary-item"><div class="label">Total Received</div><div class="value" style="color:#25D366;">${formatPKR(totalReceived)}</div></div>
            <div class="summary-item"><div class="label">Total Balance</div><div class="value" style="color:#DC2626;">${formatPKR(totalBalance)}</div></div>
            <div class="summary-item"><div class="label">Total Invoices</div><div class="value">${currentData.length}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Date</th><th>Customer / Item</th><th>Qty</th><th>Weight</th><th>Rate</th><th style="text-align:right;">Total</th><th style="text-align:right;">Received</th><th style="text-align:right;">Balance</th></tr>`;
      }
      
      // ===== PURCHASE REPORT =====
      else if (type === 'purchases') {
        rawData = await getRecordsFast('purchases');
        title = 'PURCHASE REPORT';
        amountKey = 'total';
        currentData = filterByDate(rawData, range);
        currentTotal = currentData.reduce((sum, x) => sum + (Number(x.total) || 0), 0);
        
        const totalPaid = currentData.reduce((sum, x) => sum + (Number(x.paid) || 0), 0);
        const totalBalance = currentData.reduce((sum, x) => sum + (Number(x.balance) || 0), 0);
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Purchases</div><div class="value">${formatPKR(currentTotal)}</div></div>
            <div class="summary-item"><div class="label">Total Paid</div><div class="value" style="color:#25D366;">${formatPKR(totalPaid)}</div></div>
            <div class="summary-item"><div class="label">Total Balance</div><div class="value" style="color:#DC2626;">${formatPKR(totalBalance)}</div></div>
            <div class="summary-item"><div class="label">Total Bills</div><div class="value">${currentData.length}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Date</th><th>Supplier / Item</th><th>Weight</th><th>Karat</th><th>Rate</th><th style="text-align:right;">Total</th><th style="text-align:right;">Paid</th><th style="text-align:right;">Balance</th></tr>`;
      }
      
      // ===== EXPENSE REPORT =====
      else if (type === 'expenses') {
        rawData = await getRecordsFast('expenses');
        title = 'EXPENSE REPORT';
        amountKey = 'amount';
        currentData = filterByDate(rawData, range);
        currentTotal = currentData.reduce((sum, x) => sum + (Number(x.amount) || 0), 0);
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Expenses</div><div class="value" style="color:#DC2626;">${formatPKR(currentTotal)}</div></div>
            <div class="summary-item"><div class="label">Total Entries</div><div class="value">${currentData.length}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Date</th><th>Category</th><th>Paid To</th><th>Mode</th><th>Notes</th><th style="text-align:right;">Amount</th></tr>`;
      }
      
      // ===== KARIGAR REPORT =====
      else if (type === 'karigars') {
        const karigars = await getRecordsFast('karigars');
        const services = await getRecordsFast('services');
        
        currentData = karigars.map(k => {
          const kServices = services.filter(s => s.karigar_name === k.name);
          let goldGiven = Number(k.opening_gold) || 0;
          let goldReturned = 0;
          let totalCharges = Number(k.opening_cash) || 0;
          let totalPaid = 0;
          
          kServices.forEach(s => {
            goldGiven += Number(s.gold_given_weight) || 0;
            goldReturned += Number(s.gold_returned_weight) || 0;
            totalCharges += Number(s.charges) || 0;
            totalPaid += Number(s.paid) || 0;
          });
          
          return {
            ...k,
            goldBalance: goldGiven - goldReturned,
            cashBalance: totalCharges - totalPaid,
            totalCharges,
            totalPaid,
            totalJobs: kServices.length
          };
        });
        
        currentTotal = currentData.reduce((sum, x) => sum + Math.abs(x.cashBalance), 0);
        title = 'KARIGAR REPORT';
        
        const totalGoldBalance = currentData.reduce((sum, x) => sum + x.goldBalance, 0);
        const totalGoldWithKarigar = currentData.filter(x => x.goldBalance > 0).reduce((sum, x) => sum + x.goldBalance, 0);
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Karigars</div><div class="value">${currentData.length}</div></div>
            <div class="summary-item"><div class="label">Gold Balance</div><div class="value" style="color:#FCD34D;">${formatWeight(totalGoldWithKarigar)}</div></div>
            <div class="summary-item"><div class="label">Total Payable</div><div class="value" style="color:#DC2626;">${formatPKR(currentData.filter(x => x.cashBalance > 0).reduce((sum, x) => sum + x.cashBalance, 0))}</div></div>
            <div class="summary-item"><div class="label">Total Advance</div><div class="value" style="color:#25D366;">${formatPKR(Math.abs(currentData.filter(x => x.cashBalance < 0).reduce((sum, x) => sum + x.cashBalance, 0)))}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Name</th><th>Phone</th><th>Jobs</th><th style="text-align:right;">Gold Balance</th><th style="text-align:right;">Total Charges</th><th style="text-align:right;">Total Paid</th><th style="text-align:right;">Cash Balance</th></tr>`;
      }
      
      // ===== SUPPLIER REPORT =====
      else if (type === 'suppliers') {
        const suppliers = await getRecordsFast('suppliers');
        const purchases = await getRecordsFast('purchases');
        
        currentData = suppliers.map(s => {
          const sPurch = purchases.filter(p => p.supplier_name === s.name);
          let totalPurchased = Number(s.opening_cash) || 0;
          let totalPaid = 0;
          let totalGold = Number(s.opening_gold) || 0;
          
          sPurch.forEach(p => {
            totalPurchased += Number(p.total) || 0;
            totalPaid += Number(p.paid) || 0;
            totalGold += Number(p.gold_weight) || Number(p.weight) || 0;
          });
          
          return {
            ...s,
            totalPurchased,
            totalPaid,
            cashBalance: totalPurchased - totalPaid,
            totalGold,
            totalBills: sPurch.length
          };
        });
        
        currentTotal = currentData.reduce((sum, x) => sum + Math.abs(x.cashBalance), 0);
        title = 'SUPPLIER REPORT';
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Suppliers</div><div class="value">${currentData.length}</div></div>
            <div class="summary-item"><div class="label">Total Payable</div><div class="value" style="color:#DC2626;">${formatPKR(currentData.filter(x => x.cashBalance > 0).reduce((sum, x) => sum + x.cashBalance, 0))}</div></div>
            <div class="summary-item"><div class="label">Total Advance</div><div class="value" style="color:#25D366;">${formatPKR(Math.abs(currentData.filter(x => x.cashBalance < 0).reduce((sum, x) => sum + x.cashBalance, 0)))}</div></div>
            <div class="summary-item"><div class="label">Total Gold Purchased</div><div class="value" style="color:#FCD34D;">${formatWeight(currentData.reduce((sum, x) => sum + x.totalGold, 0))}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Name</th><th>Phone</th><th>Bills</th><th style="text-align:right;">Total Purchases</th><th style="text-align:right;">Total Paid</th><th style="text-align:right;">Balance</th></tr>`;
      }
      
      // ===== CUSTOMER REPORT =====
      else if (type === 'customers') {
        const customers = await getRecordsFast('customers');
        const sales = await getRecordsFast('sales');
        const payments = await getRecordsFast('payments');
        
        currentData = customers.map(c => {
          const cSales = sales.filter(s => s.customer_name === c.name);
          const cPays = payments.filter(p => p.person_name === c.name && p.person_type === 'customer');
          let totalBill = Number(c.opening_balance) || 0;
          let totalPaid = 0;
          
          cSales.forEach(s => totalBill += Number(s.total) || 0);
          cPays.forEach(p => totalPaid += Number(p.amount) || 0);
          
          return {
            ...c,
            totalBill,
            totalPaid,
            balance: totalBill - totalPaid,
            totalSales: cSales.length
          };
        });
        
        currentTotal = currentData.reduce((sum, x) => sum + Math.abs(x.balance), 0);
        title = 'CUSTOMER REPORT';
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Customers</div><div class="value">${currentData.length}</div></div>
            <div class="summary-item"><div class="label">Total Receivable</div><div class="value" style="color:#DC2626;">${formatPKR(currentData.filter(x => x.balance > 0).reduce((sum, x) => sum + x.balance, 0))}</div></div>
            <div class="summary-item"><div class="label">Total Advance</div><div class="value" style="color:#25D366;">${formatPKR(Math.abs(currentData.filter(x => x.balance < 0).reduce((sum, x) => sum + x.balance, 0)))}</div></div>
            <div class="summary-item"><div class="label">Total Sales</div><div class="value">${currentData.reduce((sum, x) => sum + x.totalBill, 0) ? formatPKR(currentData.reduce((sum, x) => sum + x.totalBill, 0)) : 'Rs 0'}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Name</th><th>Phone</th><th>Sales</th><th style="text-align:right;">Total Bill</th><th style="text-align:right;">Total Paid</th><th style="text-align:right;">Balance</th></tr>`;
      }
      
      // ===== DEBTORS =====
      else if (type === 'debtors') {
        const customers = await getRecordsFast('customers');
        const sales = await getRecordsFast('sales');
        const payments = await getRecordsFast('payments');
        
        currentData = customers.map(c => {
          const cSales = sales.filter(s => s.customer_name === c.name);
          const cPays = payments.filter(p => p.person_name === c.name && p.person_type === 'customer');
          let totalBill = Number(c.opening_balance) || 0;
          let totalPaid = 0;
          
          cSales.forEach(s => totalBill += Number(s.total) || 0);
          cPays.forEach(p => totalPaid += Number(p.amount) || 0);
          
          return { ...c, totalBill, totalPaid, balance: totalBill - totalPaid };
        }).filter(x => x.balance > 0);
        
        currentTotal = currentData.reduce((sum, x) => sum + x.balance, 0);
        title = 'DEBTORS REPORT';
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Debtors</div><div class="value">${currentData.length}</div></div>
            <div class="summary-item"><div class="label">Total Receivable</div><div class="value" style="color:#DC2626;">${formatPKR(currentTotal)}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Name</th><th>Phone</th><th>CNIC</th><th>Address</th><th style="text-align:right;">Total Bill</th><th style="text-align:right;">Paid</th><th style="text-align:right;">Balance</th></tr>`;
      }
      
      // ===== CREDITORS =====
      else if (type === 'creditors') {
        const suppliers = await getRecordsFast('suppliers');
        const karigars = await getRecordsFast('karigars');
        const purchases = await getRecordsFast('purchases');
        const services = await getRecordsFast('services');
        const payments = await getRecordsFast('payments');
        
        const supplierDebts = suppliers.map(s => {
          const sPurch = purchases.filter(p => p.supplier_name === s.name);
          const sPays = payments.filter(p => p.person_name === s.name && p.person_type === 'supplier');
          let totalBill = Number(s.opening_cash) || 0;
          let totalPaid = 0;
          
          sPurch.forEach(p => totalBill += Number(p.total) || 0);
          sPays.forEach(p => totalPaid += Number(p.amount) || 0);
          
          return { name: s.name, phone: s.phone, type: 'Supplier', totalBill, totalPaid, balance: totalBill - totalPaid };
        }).filter(x => x.balance > 0);
        
        const karigarDebts = karigars.map(k => {
          const kServices = services.filter(s => s.karigar_name === k.name);
          const kPays = payments.filter(p => p.person_name === k.name && p.person_type === 'karigar');
          let totalBill = Number(k.opening_cash) || 0;
          let totalPaid = 0;
          
          kServices.forEach(s => totalBill += Number(s.charges) || 0);
          kPays.forEach(p => totalPaid += Number(p.amount) || 0);
          
          return { name: k.name, phone: k.phone, type: 'Karigar', totalBill, totalPaid, balance: totalBill - totalPaid };
        }).filter(x => x.balance > 0);
        
        currentData = [...supplierDebts, ...karigarDebts];
        currentTotal = currentData.reduce((sum, x) => sum + x.balance, 0);
        title = 'CREDITORS REPORT';
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Creditors</div><div class="value">${currentData.length}</div></div>
            <div class="summary-item"><div class="label">Total Payable</div><div class="value" style="color:#DC2626;">${formatPKR(currentTotal)}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Name</th><th>Type</th><th>Phone</th><th style="text-align:right;">Total Bill</th><th style="text-align:right;">Paid</th><th style="text-align:right;">Balance</th></tr>`;
      }
      
      // ===== INVENTORY REPORT =====
      else if (type === 'inventory') {
        rawData = await getRecordsFast('products');
        title = 'INVENTORY REPORT';
        
        currentData = rawData.filter(p => p.is_active !== false);
        currentTotal = currentData.reduce((sum, p) => sum + ((Number(p.current_stock) || 0) * (Number(p.cost_price) || 0)), 0);
        
        const totalStock = currentData.reduce((sum, p) => sum + (Number(p.current_stock) || 0), 0);
        const totalWeight = currentData.reduce((sum, p) => sum + ((Number(p.current_stock) || 0) * (Number(p.weight) || 0)), 0);
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Products</div><div class="value">${currentData.length}</div></div>
            <div class="summary-item"><div class="label">Total Stock</div><div class="value">${totalStock}</div></div>
            <div class="summary-item"><div class="label">Total Weight</div><div class="value" style="color:#FCD34D;">${formatWeight(totalWeight)}</div></div>
            <div class="summary-item"><div class="label">Total Stock Value</div><div class="value" style="color:#25D366;">${formatPKR(currentTotal)}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Code</th><th>Name</th><th>Category</th><th>Karat</th><th style="text-align:right;">Weight</th><th style="text-align:right;">Stock</th><th style="text-align:right;">Cost</th><th style="text-align:right;">Sale</th><th style="text-align:right;">Total Value</th></tr>`;
      }
      
      // ===== PROFIT/LOSS REPORT =====
      else if (type === 'profitloss') {
        const sales = await getRecordsFast('sales');
        const purchases = await getRecordsFast('purchases');
        const expenses = await getRecordsFast('expenses');
        
        const fSales = filterByDate(sales, range);
        const fPurchases = filterByDate(purchases, range);
        const fExpenses = filterByDate(expenses, range);
        
        const totalSales = fSales.reduce((sum, s) => sum + (Number(s.total) || 0), 0);
        const totalPurchases = fPurchases.reduce((sum, p) => sum + (Number(p.total) || 0), 0);
        const totalExpenses = fExpenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        
        currentTotal = totalSales - totalPurchases - totalExpenses;
        title = 'PROFIT / LOSS REPORT';
        currentData = [
          { category: 'Sales', amount: totalSales, type: 'income' },
          { category: 'Purchases', amount: totalPurchases, type: 'expense' },
          { category: 'Expenses', amount: totalExpenses, type: 'expense' },
          { category: 'Net Profit/Loss', amount: currentTotal, type: currentTotal >= 0 ? 'profit' : 'loss' }
        ];
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Sales</div><div class="value" style="color:#25D366;">${formatPKR(totalSales)}</div></div>
            <div class="summary-item"><div class="label">Total Purchases</div><div class="value" style="color:#FCA5A5;">${formatPKR(totalPurchases)}</div></div>
            <div class="summary-item"><div class="label">Total Expenses</div><div class="value" style="color:#FCA5A5;">${formatPKR(totalExpenses)}</div></div>
            <div class="summary-item"><div class="label">Net ${currentTotal >= 0 ? 'Profit' : 'Loss'}</div><div class="value" style="color:${currentTotal >= 0 ? '#25D366' : '#DC2626'};">${formatPKR(Math.abs(currentTotal))}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Category</th><th style="text-align:right;">Amount</th><th>Type</th></tr>`;
      }
      
      // ===== CASH FLOW REPORT =====
      else if (type === 'cashflow') {
        const sales = await getRecordsFast('sales');
        const purchases = await getRecordsFast('purchases');
        const expenses = await getRecordsFast('expenses');
        const payments = await getRecordsFast('payments');
        const bankAccounts = await getRecordsFast('bank_accounts');
        const bankTransactions = await getRecordsFast('bank_transactions');
        
        // Cash IN
        const cashInSales = sales.filter(s => s.payment_mode === 'cash' || !s.payment_mode).reduce((sum, s) => sum + (Number(s.received) || 0), 0);
        const cashInPayments = payments.filter(p => p.person_type === 'customer' && (p.payment_mode === 'cash' || !p.payment_mode)).reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
        
        // Cash OUT
        const cashOutPurchases = purchases.filter(p => p.payment_mode === 'cash' || !p.payment_mode).reduce((sum, p) => sum + (Number(p.paid) || 0), 0);
        const cashOutExpenses = expenses.filter(e => e.payment_mode === 'cash' || !e.payment_mode).reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        const cashOutPayments = payments.filter(p => (p.person_type === 'supplier' || p.person_type === 'karigar') && (p.payment_mode === 'cash' || !p.payment_mode)).reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
        
        // Bank
        let bankIn = 0, bankOut = 0;
        bankAccounts.forEach(acc => {
          let balance = Number(acc.opening_balance) || 0;
          const accTxns = bankTransactions.filter(t => t.account_id === acc.id);
          accTxns.forEach(t => {
            if (t.transaction_type === 'deposit') bankIn += Number(t.amount) || 0;
            else bankOut += Number(t.amount) || 0;
          });
        });
        
        const totalCashIn = cashInSales + cashInPayments;
        const totalCashOut = cashOutPurchases + cashOutExpenses + cashOutPayments;
        const cashInHand = totalCashIn - totalCashOut;
        
        currentTotal = cashInHand;
        title = 'CASH FLOW REPORT';
        currentData = [
          { category: 'Cash In - Sales', amount: cashInSales, type: 'in' },
          { category: 'Cash In - Customer Payments', amount: cashInPayments, type: 'in' },
          { category: 'Cash Out - Purchases', amount: cashOutPurchases, type: 'out' },
          { category: 'Cash Out - Expenses', amount: cashOutExpenses, type: 'out' },
          { category: 'Cash Out - Supplier/Karigar Payments', amount: cashOutPayments, type: 'out' },
          { category: 'Bank Deposits', amount: bankIn, type: 'in' },
          { category: 'Bank Withdrawals', amount: bankOut, type: 'out' },
          { category: 'Cash in Hand', amount: cashInHand, type: 'total' }
        ];
        
        summaryHtml = `
          <div class="summary-box">
            <div class="summary-item"><div class="label">Total Cash In</div><div class="value" style="color:#25D366;">${formatPKR(totalCashIn)}</div></div>
            <div class="summary-item"><div class="label">Total Cash Out</div><div class="value" style="color:#DC2626;">${formatPKR(totalCashOut)}</div></div>
            <div class="summary-item"><div class="label">Cash in Hand</div><div class="value" style="color:${cashInHand >= 0 ? '#25D366' : '#DC2626'};">${formatPKR(Math.abs(cashInHand))}</div></div>
            <div class="summary-item"><div class="label">Bank Balance</div><div class="value">${formatPKR(bankIn - bankOut)}</div></div>
          </div>
        `;
        
        tableHeaders = `<tr><th>Category</th><th style="text-align:right;">Amount</th><th>Type</th></tr>`;
      }

      const rangeText = document.getElementById('dateFilter').options[document.getElementById('dateFilter').selectedIndex].text;
      
      container.innerHTML = `
        <div class="letterpad" id="printableReport">
          <div class="letterpad-header">
            <h1>${shopInfo.name || 'AKBAR JEWELLERS'}</h1>
            <p class="urdu">${shopInfo.name_urdu || 'فیض حسینی'}</p>
            <p>${shopInfo.address || ''}</p>
            <p>Phone: ${shopInfo.phone || ''}</p>
            <hr style="border:none; border-top:1px solid #D4AF37; margin:10px 0;">
            <h3 style="font-family:'Playfair Display',serif; color:#1A1A1A; margin:5px 0;">${title}</h3>
            <p style="font-size:11px;">Period: ${rangeText} | Generated: ${formatDate(new Date())}</p>
          </div>
          
          ${summaryHtml}
          
          <div style="overflow-x:auto;">
            <table class="letterpad-table">
              <thead>${tableHeaders}</thead>
              <tbody>
                ${currentData.length === 0 ? '<tr><td colspan="10" style="text-align:center; padding:20px; color:#999;">No records found</td></tr>' : 
                  currentData.map(x => {
                    if (type === 'sales') {
                      return `
                        <tr>
                          <td>${formatDate(x.date)}</td>
                          <td><strong>${x.customer_name}</strong><br><span style="font-size:11px; color:#666;">${x.items_summary}</span></td>
                          <td>${x.qty || 1}</td>
                          <td>${formatWeight((x.qty || 1) * (x.weight || 0))}</td>
                          <td>${formatPKR(x.rate)}</td>
                          <td style="text-align:right; font-weight:600;">${formatPKR(x.total)}</td>
                          <td style="text-align:right; color:#25D366;">${formatPKR(x.received)}</td>
                          <td style="text-align:right; color:${(x.balance || 0) > 0 ? '#DC2626' : '#25D366'};">${formatPKR(x.balance)}</td>
                        </tr>
                      `;
                    } else if (type === 'purchases') {
                      return `
                        <tr>
                          <td>${formatDate(x.date)}</td>
                          <td><strong>${x.supplier_name}</strong><br><span style="font-size:11px; color:#666;">${x.item}</span></td>
                          <td>${formatWeight((x.qty || 1) * (x.weight || 0))}</td>
                          <td>${x.gold_karat || '—'}</td>
                          <td>${formatPKR(x.rate)}</td>
                          <td style="text-align:right; font-weight:600;">${formatPKR(x.total)}</td>
                          <td style="text-align:right; color:#25D366;">${formatPKR(x.paid)}</td>
                          <td style="text-align:right; color:${(x.balance || 0) > 0 ? '#DC2626' : '#25D366'};">${formatPKR(x.balance)}</td>
                        </tr>
                      `;
                    } else if (type === 'expenses') {
                      return `
                        <tr>
                          <td>${formatDate(x.date)}</td>
                          <td><strong>${(x.category || '').toUpperCase()}</strong></td>
                          <td>${x.paid_to || '—'}</td>
                          <td>${x.payment_mode || '—'}</td>
                          <td>${x.notes || '—'}</td>
                          <td style="text-align:right; color:#DC2626; font-weight:600;">${formatPKR(x.amount)}</td>
                        </tr>
                      `;
                    } else if (type === 'karigars') {
                      return `
                        <tr>
                          <td><strong>${x.name}</strong></td>
                          <td>${x.phone}</td>
                          <td>${x.totalJobs}</td>
                          <td style="text-align:right; color:#FCD34D;">${formatWeight(x.goldBalance)}</td>
                          <td style="text-align:right;">${formatPKR(x.totalCharges)}</td>
                          <td style="text-align:right; color:#25D366;">${formatPKR(x.totalPaid)}</td>
                          <td style="text-align:right; color:${x.cashBalance > 0 ? '#DC2626' : '#25D366'}; font-weight:600;">${formatPKR(Math.abs(x.cashBalance))}</td>
                        </tr>
                      `;
                    } else if (type === 'suppliers') {
                      return `
                        <tr>
                          <td><strong>${x.name}</strong></td>
                          <td>${x.phone}</td>
                          <td>${x.totalBills}</td>
                          <td style="text-align:right;">${formatPKR(x.totalPurchased)}</td>
                          <td style="text-align:right; color:#25D366;">${formatPKR(x.totalPaid)}</td>
                          <td style="text-align:right; color:${x.cashBalance > 0 ? '#DC2626' : '#25D366'}; font-weight:600;">${formatPKR(Math.abs(x.cashBalance))}</td>
                        </tr>
                      `;
                    } else if (type === 'customers' || type === 'debtors') {
                      return `
                        <tr>
                          <td><strong>${x.name}</strong></td>
                          <td>${x.phone}</td>
                          ${type === 'debtors' ? `<td>${x.cnic || '—'}</td><td>${x.address || '—'}</td>` : `<td>${x.totalSales || 0}</td>`}
                          <td style="text-align:right;">${formatPKR(x.totalBill)}</td>
                          <td style="text-align:right; color:#25D366;">${formatPKR(x.totalPaid)}</td>
                          <td style="text-align:right; color:${x.balance > 0 ? '#DC2626' : '#25D366'}; font-weight:600;">${formatPKR(Math.abs(x.balance))}</td>
                        </tr>
                      `;
                    } else if (type === 'creditors') {
                      return `
                        <tr>
                          <td><strong>${x.name}</strong></td>
                          <td>${x.type}</td>
                          <td>${x.phone}</td>
                          <td style="text-align:right;">${formatPKR(x.totalBill)}</td>
                          <td style="text-align:right; color:#25D366;">${formatPKR(x.totalPaid)}</td>
                          <td style="text-align:right; color:#DC2626; font-weight:600;">${formatPKR(x.balance)}</td>
                        </tr>
                      `;
                    } else if (type === 'inventory') {
                      const stockValue = (Number(x.current_stock) || 0) * (Number(x.cost_price) || 0);
                      return `
                        <tr>
                          <td>${x.product_code || '—'}</td>
                          <td>${x.name}</td>
                          <td>${(x.category || '').toUpperCase()}</td>
                          <td>${x.karat || '—'}</td>
                          <td style="text-align:right;">${formatWeight(x.weight)}</td>
                          <td style="text-align:right;">${x.current_stock || 0}</td>
                          <td style="text-align:right;">${formatPKR(x.cost_price)}</td>
                          <td style="text-align:right;">${formatPKR(x.sale_price)}</td>
                          <td style="text-align:right; font-weight:600;">${formatPKR(stockValue)}</td>
                        </tr>
                      `;
                    } else if (type === 'profitloss' || type === 'cashflow') {
                      const color = x.type === 'income' || x.type === 'in' || x.type === 'profit' ? '#25D366' : x.type === 'expense' || x.type === 'out' || x.type === 'loss' ? '#DC2626' : '#D4AF37';
                      return `
                        <tr>
                          <td><strong>${x.category}</strong></td>
                          <td style="text-align:right; color:${color}; font-weight:700;">${formatPKR(Math.abs(x.amount))}</td>
                          <td style="text-transform:uppercase; font-size:10px; color:${color};">${x.type}</td>
                        </tr>
                      `;
                    }
                  }).join('')}
              </tbody>
            </table>
          </div>
          
          ${type === 'sales' || type === 'purchases' || type === 'expenses' ? `
            <div class="letterpad-total">TOTAL: ${formatPKR(currentTotal)}</div>
          ` : ''}
          
          <div class="letterpad-footer">
            This is a computer-generated report. Thank you!<br>
            ${shopInfo.name || 'AKBAR JEWELLERS'} © ${new Date().getFullYear()}
            <div style="color:#D4AF37; font-family:'Noto Nastaliq Urdu',serif; direction:rtl; margin-top:8px;">${shopInfo.tagline || 'Diamond aur Kundan Antique Jewellery ke Expert'}</div>
          </div>
        </div>
      `;
    }

    function sendReportWhatsApp() {
      if (currentData.length === 0) { alert('No data to send'); return; }
      
      const rangeText = document.getElementById('dateFilter').options[document.getElementById('dateFilter').selectedIndex].text;
      const title = currentReport.toUpperCase() + ' REPORT';
      
      let msg = `*${shopInfo.name}*\n*${title}*\nPeriod: ${rangeText}\nDate: ${formatDate(new Date())}\n\n`;
      
      if (currentReport === 'sales') {
        msg += `Total Sales: ${formatPKR(currentTotal)}\n`;
        msg += `Total Invoices: ${currentData.length}\n`;
      } else if (currentReport === 'purchases') {
        msg += `Total Purchases: ${formatPKR(currentTotal)}\n`;
        msg += `Total Bills: ${currentData.length}\n`;
      } else if (currentReport === 'expenses') {
        msg += `Total Expenses: ${formatPKR(currentTotal)}\n`;
      } else if (currentReport === 'debtors') {
        msg += `Total Debtors: ${currentData.length}\n`;
        msg += `Total Receivable: ${formatPKR(currentTotal)}\n`;
      } else if (currentReport === 'creditors') {
        msg += `Total Creditors: ${currentData.length}\n`;
        msg += `Total Payable: ${formatPKR(currentTotal)}\n`;
      } else if (currentReport === 'profitloss') {
        msg += `Net ${currentTotal >= 0 ? 'Profit' : 'Loss'}: ${formatPKR(Math.abs(currentTotal))}\n`;
      } else if (currentReport === 'cashflow') {
        msg += `Cash in Hand: ${formatPKR(Math.abs(currentTotal))}\n`;
      }
      
      msg += `\n*${shopInfo.name}*`;
      
      const phone = prompt('Enter WhatsApp number:', '');
      if (phone) openWhatsApp(phone, msg);
    }

    function sendReportEmail() {
      if (currentData.length === 0) { alert('No data to send'); return; }
      
      const rangeText = document.getElementById('dateFilter').options[document.getElementById('dateFilter').selectedIndex].text;
      const title = currentReport.toUpperCase() + ' REPORT';
      
      let body = `${title}\nPeriod: ${rangeText}\nDate: ${formatDate(new Date())}\n\n`;
      
      if (currentReport === 'sales') body += `Total Sales: ${formatPKR(currentTotal)}\nTotal Invoices: ${currentData.length}\n`;
      else if (currentReport === 'purchases') body += `Total Purchases: ${formatPKR(currentTotal)}\nTotal Bills: ${currentData.length}\n`;
      else if (currentReport === 'expenses') body += `Total Expenses: ${formatPKR(currentTotal)}\n`;
      else if (currentReport === 'debtors') body += `Total Debtors: ${currentData.length}\nTotal Receivable: ${formatPKR(currentTotal)}\n`;
      else if (currentReport === 'creditors') body += `Total Creditors: ${currentData.length}\nTotal Payable: ${formatPKR(currentTotal)}\n`;
      else if (currentReport === 'profitloss') body += `Net ${currentTotal >= 0 ? 'Profit' : 'Loss'}: ${formatPKR(Math.abs(currentTotal))}\n`;
      else if (currentReport === 'cashflow') body += `Cash in Hand: ${formatPKR(Math.abs(currentTotal))}\n`;
      
      const email = prompt('Enter email address:', '');
      if (email) sendEmail(email, `${shopInfo.name} – ${title}`, body);
    }
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW error:', err));
    });
  }
</script>
</body>
</html>
