<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karigar Ledger – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
  <style>
    .ledger-header {
      background: linear-gradient(135deg, var(--black-soft), #252525);
      border: 2px solid var(--gold-primary);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
    }
    .ledger-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .ledger-box {
      background: var(--black-royal);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      border: 1px solid rgba(255,215,0,0.2);
    }
    .ledger-box .label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
    .ledger-box .value { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; margin-top: 5px; }
    .txn-table { width: 100%; border-collapse: collapse; background: var(--black-soft); border-radius: 12px; overflow: hidden; }
    .txn-table th { background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05)); color: var(--gold-primary); padding: 12px 10px; text-align: left; font-size: 0.75rem; text-transform: uppercase; }
    .txn-table td { padding: 12px 10px; border-bottom: 1px solid rgba(255,215,0,0.08); font-size: 0.85rem; }
    .txn-table td.number { font-family: var(--font-mono); text-align: right; }
    .bill-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--gold-primary); cursor: pointer; }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Karigar Ledger
    </div>
    <button onclick="navigate('karigars.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <div id="ledgerContent">
      <p style="text-align:center; padding:50px; color:var(--gold-primary);">Loading...</p>
    </div>
  </div>

  <div id="invoiceModal" class="modal">
    <div class="modal-content" style="max-width: 800px; background:#fff; color:#1A1A1A; padding: 40px;">
      <div id="printableLedger"></div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-primary" onclick="printElement('printableLedger')" style="flex:1;">🖨 Print</button>
        <button class="btn-success" onclick="sendLedgerWhatsApp()" style="flex:1;">📱 WhatsApp</button>
        <button class="btn-secondary" onclick="sendLedgerEmail()" style="flex:1; background:#3B82F6; color:white; border:none;">📧 Email</button>
        <button class="btn-danger" onclick="document.getElementById('invoiceModal').classList.remove('active')" style="flex:1;">Close</button>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let currentKarigar = null;
    let allTransactions = [];
    let shopInfo = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'purchase'])) return;
      
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name');
      
      if (!name) {
        alert('No karigar selected');
        window.location.href = 'karigars.html';
        return;
      }
      
      shopInfo = await getShopSettings();
      await loadLedger(name);
    });

    async function loadLedger(name) {
      const karigars = await getRecordsFast('karigars');
      const services = await getRecordsFast('services');
      
      currentKarigar = karigars.find(k => k.name === name);
      if (!currentKarigar) {
        document.getElementById('ledgerContent').innerHTML = '<p style="text-align:center; padding:50px; color:var(--danger);">Karigar not found</p>';
        return;
      }

      const kServices = services.filter(s => s.karigar_name === name);
      
      allTransactions = kServices.map(s => ({
        date: s.service_date || s.created_at,
        desc: s.item || 'Job',
        type: s.type || 'making',
        gold_given: Number(s.gold_given_weight) || 0,
        gold_given_karat: s.gold_given_karat,
        gold_returned: Number(s.gold_returned_weight) || 0,
        gold_returned_karat: s.gold_returned_karat,
        charges: Number(s.charges) || 0,
        paid: Number(s.paid) || 0,
        bill_image: s.bill_image,
        status: s.status
      }));

      allTransactions.sort((a, b) => new Date(a.date) - new Date(b.date));

      // Calculate totals
      let openingGold = Number(currentKarigar.opening_gold) || 0;
      let totalGoldGiven = openingGold;
      let totalGoldReturned = 0;
      let totalCharges = Number(currentKarigar.opening_cash) || 0;
      let totalPaid = 0;

      allTransactions.forEach(t => {
        totalGoldGiven += t.gold_given;
        totalGoldReturned += t.gold_returned;
        totalCharges += t.charges;
        totalPaid += t.paid;
      });

      const goldBalance = totalGoldGiven - totalGoldReturned;
      const cashBalance = totalCharges - totalPaid;

      document.getElementById('ledgerContent').innerHTML = `
        <div class="ledger-header">
          <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
            ${currentKarigar.photo ? `<img src="${currentKarigar.photo}" style="width:80px; height:80px; border-radius:50%; border:3px solid var(--gold-primary); object-fit:cover;">` : '<div style="width:80px; height:80px; border-radius:50%; background:var(--charcoal); display:flex; align-items:center; justify-content:center; font-size:2rem;">👤</div>'}
            <div>
              <h1 style="font-family:var(--font-heading); color:var(--gold-primary); font-size:1.8rem; margin-bottom:5px;">${currentKarigar.name}</h1>
              <p style="color:var(--text-muted);">📞 ${currentKarigar.phone} ${currentKarigar.cnic ? '• CNIC: ' + currentKarigar.cnic : ''}</p>
            </div>
          </div>
          
          <div class="ledger-summary">
            <div class="ledger-box">
              <div class="label">Opening Gold</div>
              <div class="value" style="color:#93C5FD;">${formatWeight(openingGold)}</div>
            </div>
            <div class="ledger-box">
              <div class="label">Total Gold Given</div>
              <div class="value" style="color:#FCD34D;">${formatWeight(totalGoldGiven)}</div>
            </div>
            <div class="ledger-box">
              <div class="label">Total Gold Returned</div>
              <div class="value" style="color:#86EFAC;">${formatWeight(totalGoldReturned)}</div>
            </div>
            <div class="ledger-box">
              <div class="label">Gold Balance</div>
              <div class="value" style="color:${goldBalance > 0 ? 'var(--danger)' : 'var(--success)'};">${formatWeight(goldBalance)}</div>
            </div>
            <div class="ledger-box">
              <div class="label">Total Charges</div>
              <div class="value" style="color:#93C5FD;">${formatPKR(totalCharges)}</div>
            </div>
            <div class="ledger-box">
              <div class="label">Total Paid</div>
              <div class="value" style="color:#86EFAC;">${formatPKR(totalPaid)}</div>
            </div>
            <div class="ledger-box">
              <div class="label">Cash Balance</div>
              <div class="value" style="color:${cashBalance > 0 ? 'var(--danger)' : 'var(--success)'};">${formatPKR(Math.abs(cashBalance))}</div>
            </div>
          </div>

          <div style="display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;">
            <button class="btn-primary" onclick="showLedgerPrint()" style="flex:1;">🖨 Print Ledger</button>
            <button class="btn-success" onclick="showLedgerPrint(); setTimeout(() => sendLedgerWhatsApp(), 500);" style="flex:1;">📱 WhatsApp</button>
            <button class="btn-secondary" onclick="showLedgerPrint(); setTimeout(() => sendLedgerEmail(), 500);" style="flex:1; background:#3B82F6; color:white; border:none;">📧 Email</button>
          </div>
        </div>

        <div class="form-card">
          <h3 class="form-card-title">➕ New Job Entry (Gold Given / Returned)</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Job Description <span class="required">*</span></label>
              <input type="text" id="jItem" class="form-input" placeholder="e.g., Ring Polish / Necklace Making">
            </div>
            <div class="form-group">
              <label class="form-label">Job Type</label>
              <select id="jType" class="form-select">
                <option value="making">Jewelry Making</option>
                <option value="repair">Repair</option>
                <option value="polish">Polish</option>
                <option value="setting">Stone Setting</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Job Date</label>
              <input type="date" id="jDate" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">Status</label>
              <select id="jStatus" class="form-select">
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
                <option value="delivered">Delivered</option>
              </select>
            </div>
          </div>

          <h4 style="color:var(--gold-primary); margin:20px 0 10px; font-family:var(--font-heading);">🪙 Gold Given (Sona Diya)</h4>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Weight <span class="required">*</span></label>
              <div style="display:grid; grid-template-columns: 2fr 1fr; gap:8px;">
                <input type="number" id="jGoldGiven" class="form-input number-input" placeholder="0.000" step="0.001">
                <select id="jGoldGivenUnit" class="form-select">
                  <option value="gram">Gram</option>
                  <option value="tola">Tola</option>
                  <option value="masha">Masha</option>
                  <option value="ratti">Ratti</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Karat</label>
              <select id="jGoldGivenKarat" class="form-select">
                <option value="24K">24K</option>
                <option value="22K">22K</option>
                <option value="21K">21K</option>
                <option value="18K">18K</option>
              </select>
            </div>
          </div>

          <h4 style="color:var(--gold-primary); margin:20px 0 10px; font-family:var(--font-heading);">🪙 Gold Returned (Sona Wapas Aaya)</h4>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Weight</label>
              <div style="display:grid; grid-template-columns: 2fr 1fr; gap:8px;">
                <input type="number" id="jGoldReturned" class="form-input number-input" placeholder="0.000" step="0.001">
                <select id="jGoldReturnedUnit" class="form-select">
                  <option value="gram">Gram</option>
                  <option value="tola">Tola</option>
                  <option value="masha">Masha</option>
                  <option value="ratti">Ratti</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Karat</label>
              <select id="jGoldReturnedKarat" class="form-select">
                <option value="24K">24K</option>
                <option value="22K">22K</option>
                <option value="21K">21K</option>
                <option value="18K">18K</option>
              </select>
            </div>
          </div>

          <h4 style="color:var(--gold-primary); margin:20px 0 10px; font-family:var(--font-heading);">💰 Charges & Payment</h4>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Wage/Charges (Rs)</label>
              <input type="number" id="jCharges" class="form-input number-input" placeholder="0">
            </div>
            <div class="form-group">
              <label class="form-label">Paid (Rs)</label>
              <input type="number" id="jPaid" class="form-input number-input" placeholder="0">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Bill Photo (Karigar ka bill)</label>
            <input type="file" id="jBillImage" class="form-input" accept="image/*" style="padding:10px;">
            <div id="jBillPreview" style="margin-top:10px;"></div>
          </div>

          <button class="btn-primary" onclick="saveJob()" id="saveJobBtn" style="width:100%;">
            💾 Save Job Entry
          </button>
        </div>

        <h2 class="section-title">📒 Transaction History</h2>
        <div style="overflow-x:auto;">
          <table class="txn-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Gold Given</th>
                <th>Gold Returned</th>
                <th>Charges</th>
                <th>Paid</th>
                <th>Bill</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${allTransactions.length === 0 ? '<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-muted);">No transactions yet</td></tr>' :
                allTransactions.map((t, idx) => `
                  <tr>
                    <td>${formatDate(t.date)}</td>
                    <td><strong style="color:var(--gold-primary);">${t.desc}</strong><br><span style="font-size:0.75rem; color:var(--text-muted);">${t.type}</span></td>
                    <td class="number" style="color:#FCD34D;">${t.gold_given > 0 ? formatWeight(t.gold_given) + ' ' + (t.gold_given_karat || '') : '—'}</td>
                    <td class="number" style="color:#86EFAC;">${t.gold_returned > 0 ? formatWeight(t.gold_returned) + ' ' + (t.gold_returned_karat || '') : '—'}</td>
                    <td class="number">${t.charges > 0 ? formatPKR(t.charges) : '—'}</td>
                    <td class="number">${t.paid > 0 ? formatPKR(t.paid) : '—'}</td>
                    <td>${t.bill_image ? `<img src="${t.bill_image}" class="bill-thumb" onclick="window.open('${t.bill_image}', '_blank')">` : '—'}</td>
                    <td><button class="btn-danger" style="padding:4px 10px; font-size:0.75rem;" onclick="deleteJob('${t.id}', ${idx})">🗑️</button></td>
                  </tr>
                `).join('')}
            </tbody>
          </table>
        </div>
      `;

      document.getElementById('jDate').value = new Date().toISOString().slice(0, 10);
    }

    let uploadedBillUrl = '';
    document.addEventListener('change', (e) => {
      if (e.target.id === 'jBillImage' && e.target.files[0]) {
        const file = e.target.files[0];
        document.getElementById('jBillPreview').innerHTML = `<img src="${URL.createObjectURL(file)}" style="max-width:100px; border-radius:8px; border:2px solid var(--gold-primary);">`;
        uploadImage(file).then(url => { uploadedBillUrl = url; }).catch(err => alert('Bill upload failed: ' + err.message));
      }
    });

    async function saveJob() {
      const item = document.getElementById('jItem').value.trim();
      if (!item) { alert('❌ Job description required'); return; }

      const btn = document.getElementById('saveJobBtn');
      btn.textContent = '⏳ Saving...'; btn.disabled = true;

      try {
        const goldGivenValue = parseFloat(document.getElementById('jGoldGiven').value) || 0;
        const goldGivenUnit = document.getElementById('jGoldGivenUnit').value;
        const goldReturnedValue = parseFloat(document.getElementById('jGoldReturned').value) || 0;
        const goldReturnedUnit = document.getElementById('jGoldReturnedUnit').value;

        await addRecord('services', {
          karigar_name: currentKarigar.name,
          karigar_phone: currentKarigar.phone,
          item: item,
          type: document.getElementById('jType').value,
          gold_given_weight: toGrams(goldGivenValue, goldGivenUnit),
          gold_given_karat: document.getElementById('jGoldGivenKarat').value,
          gold_returned_weight: toGrams(goldReturnedValue, goldReturnedUnit),
          gold_returned_karat: document.getElementById('jGoldReturnedKarat').value,
          charges: parseFloat(document.getElementById('jCharges').value) || 0,
          paid: parseFloat(document.getElementById('jPaid').value) || 0,
          bill_image: uploadedBillUrl,
          status: document.getElementById('jStatus').value,
          service_date: document.getElementById('jDate').value
        });

        alert('✅ Job entry saved!');
        uploadedBillUrl = '';
        location.reload();
      } catch (e) {
        alert('❌ Error: ' + e.message);
      } finally {
        btn.textContent = '💾 Save Job Entry';
        btn.disabled = false;
      }
    }

    async function deleteJob(id, idx) {
      if (!confirm('Delete this entry?')) return;
      try {
        await deleteRecord('services', id);
        alert('✅ Deleted');
        location.reload();
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }

    function showLedgerPrint() {
      let totalGoldGiven = Number(currentKarigar.opening_gold) || 0;
      let totalGoldReturned = 0;
      let totalCharges = Number(currentKarigar.opening_cash) || 0;
      let totalPaid = 0;
      allTransactions.forEach(t => {
        totalGoldGiven += t.gold_given;
        totalGoldReturned += t.gold_returned;
        totalCharges += t.charges;
        totalPaid += t.paid;
      });
      const goldBalance = totalGoldGiven - totalGoldReturned;
      const cashBalance = totalCharges - totalPaid;

      document.getElementById('printableLedger').innerHTML = `
        <div style="text-align:center; border-bottom:2px solid #D4AF37; padding-bottom:15px; margin-bottom:20px;">
          <h1 style="font-family:'Playfair Display',serif; color:#D4AF37; margin:0; font-size:28px;">${shopInfo.name}</h1>
          <p style="margin:5px 0; font-size:14px; color:#D4AF37; font-family:'Noto Nastaliq Urdu',serif;" dir="rtl">${shopInfo.name_urdu || 'فیض حسینی'}</p>
          <p style="margin:5px 0; font-size:12px; color:#666;">${shopInfo.address}</p>
          <p style="margin:5px 0; font-size:12px; color:#666;">Phone: ${shopInfo.phone}</p>
        </div>
        <h2 style="text-align:center; color:#1A1A1A; font-family:'Playfair Display',serif; margin-bottom:10px;">KARIGAR LEDGER</h2>
        <p style="text-align:center; color:#666; margin-bottom:20px;">${currentKarigar.name} | ${currentKarigar.phone}</p>
        
        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;">
          <div style="background:#FAF7F0; padding:10px; border-radius:6px; text-align:center;">
            <div style="font-size:10px; color:#666;">Total Gold Given</div>
            <div style="font-weight:700; color:#D4AF37;">${formatWeight(totalGoldGiven)}</div>
          </div>
          <div style="background:#FAF7F0; padding:10px; border-radius:6px; text-align:center;">
            <div style="font-size:10px; color:#666;">Total Returned</div>
            <div style="font-weight:700; color:#D4AF37;">${formatWeight(totalGoldReturned)}</div>
          </div>
          <div style="background:#FAF7F0; padding:10px; border-radius:6px; text-align:center;">
            <div style="font-size:10px; color:#666;">Gold Balance</div>
            <div style="font-weight:700; color:${goldBalance > 0 ? '#DC2626' : '#25D366'};">${formatWeight(goldBalance)}</div>
          </div>
          <div style="background:#FAF7F0; padding:10px; border-radius:6px; text-align:center;">
            <div style="font-size:10px; color:#666;">Cash Balance</div>
            <div style="font-weight:700; color:${cashBalance > 0 ? '#DC2626' : '#25D366'};">${formatPKR(Math.abs(cashBalance))}</div>
          </div>
        </div>

        <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
          <thead>
            <tr style="background:#FAF7F0;">
              <th style="border:1px solid #ddd; padding:8px; text-align:left; font-size:11px; color:#D4AF37;">Date</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:left; font-size:11px; color:#D4AF37;">Description</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:right; font-size:11px; color:#D4AF37;">Gold Given</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:right; font-size:11px; color:#D4AF37;">Gold Returned</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:right; font-size:11px; color:#D4AF37;">Charges</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:right; font-size:11px; color:#D4AF37;">Paid</th>
            </tr>
          </thead>
          <tbody>
            ${allTransactions.map(t => `
              <tr>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px;">${formatDate(t.date)}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px;">${t.desc}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px; text-align:right;">${t.gold_given > 0 ? formatWeight(t.gold_given) : '—'}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px; text-align:right;">${t.gold_returned > 0 ? formatWeight(t.gold_returned) : '—'}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px; text-align:right;">${t.charges > 0 ? formatPKR(t.charges) : '—'}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px; text-align:right;">${t.paid > 0 ? formatPKR(t.paid) : '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div style="text-align:center; margin-top:30px; padding-top:15px; border-top:1px solid #eee; font-size:10px; color:#999;">
          ${shopInfo.name} © ${new Date().getFullYear()} | Generated: ${formatDateTime(new Date())}
        </div>
      `;
      document.getElementById('invoiceModal').classList.add('active');
    }

    function sendLedgerWhatsApp() {
      let msg = `*KARIGAR LEDGER*\n*${shopInfo.name}*\n\n👤 Karigar: ${currentKarigar.name}\n📞 ${currentKarigar.phone}\n\n`;
      
      let totalGoldGiven = Number(currentKarigar.opening_gold) || 0;
      let totalGoldReturned = 0;
      let totalCharges = Number(currentKarigar.opening_cash) || 0;
      let totalPaid = 0;
      allTransactions.forEach(t => {
        totalGoldGiven += t.gold_given;
        totalGoldReturned += t.gold_returned;
        totalCharges += t.charges;
        totalPaid += t.paid;
      });
      
      msg += `🪙 Total Gold Given: ${formatWeight(totalGoldGiven)}\n`;
      msg += `🪙 Total Returned: ${formatWeight(totalGoldReturned)}\n`;
      msg += `🪙 Gold Balance: ${formatWeight(totalGoldGiven - totalGoldReturned)}\n`;
      msg += `💰 Total Charges: ${formatPKR(totalCharges)}\n`;
      msg += `💰 Total Paid: ${formatPKR(totalPaid)}\n`;
      msg += `💰 Cash Balance: ${formatPKR(Math.abs(totalCharges - totalPaid))}\n\n`;
      msg += `Thank you!`;
      
      openWhatsApp(currentKarigar.phone, msg);
    }

    function sendLedgerEmail() {
      let subject = `Karigar Ledger – ${currentKarigar.name}`;
      let body = `Karigar Ledger\n\nName: ${currentKarigar.name}\nPhone: ${currentKarigar.phone}\n\n`;
      
      let totalGoldGiven = Number(currentKarigar.opening_gold) || 0;
      let totalGoldReturned = 0;
      let totalCharges = Number(currentKarigar.opening_cash) || 0;
      let totalPaid = 0;
      allTransactions.forEach(t => {
        totalGoldGiven += t.gold_given;
        totalGoldReturned += t.gold_returned;
        totalCharges += t.charges;
        totalPaid += t.paid;
      });
      
      body += `Total Gold Given: ${formatWeight(totalGoldGiven)}\n`;
      body += `Total Returned: ${formatWeight(totalGoldReturned)}\n`;
      body += `Gold Balance: ${formatWeight(totalGoldGiven - totalGoldReturned)}\n`;
      body += `Total Charges: ${formatPKR(totalCharges)}\n`;
      body += `Total Paid: ${formatPKR(totalPaid)}\n`;
      body += `Cash Balance: ${formatPKR(Math.abs(totalCharges - totalPaid))}\n`;
      
      const email = prompt('Enter email address:', '');
      if (email) sendEmail(email, subject, body);
    }
  </script>
</body>
</html>
