<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products – Akbar Jewellers Software</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
  <style>
    .product-code-display { background: linear-gradient(135deg, #FFD700, #C9A227); color: #0A0A0A; padding: 4px 12px; border-radius: 6px; font-weight: 700; font-family: 'Poppins', sans-serif; font-size: 0.85rem; display: inline-block; margin-left: 8px; }
    .image-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 10px; }
    .image-preview-item { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid #FFD700; }
    .image-preview-item img { width: 100%; height: 80px; object-fit: cover; }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Products
    </div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-nav">
    <button class="nav-btn" onclick="navigate('index.html')">🏠 Dashboard</button>
    <button class="nav-btn" onclick="navigate('sales.html')">💰 Sales</button>
    <button class="nav-btn" onclick="navigate('purchase.html')">📥 Purchase</button>
    <button class="nav-btn active">📦 Products</button>
    <button class="nav-btn" onclick="navigate('reports.html')">📊 Reports</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Product Management</h1>
    <p class="page-subtitle">Add products with unique ID, images, and pricing</p>

    <div class="form-card">
      <h3 class="form-card-title">Add New Product</h3>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input type="text" id="prName" class="form-input" placeholder="e.g., Gold Necklace Set" oninput="generateProductCode()">
        </div>
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select id="prCategory" class="form-select" onchange="generateProductCode()">
            <option value="gold">Gold</option>
            <option value="silver">Silver</option>
            <option value="diamond">Diamond</option>
            <option value="artificial">Artificial</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Product ID (Auto-Generated) *</label>
          <input type="text" id="prCode" class="form-input" readonly style="background:#2A2A2A; color:#FFD700; font-weight:700;">
        </div>
        <div class="form-group">
          <label class="form-label">Subcategory</label>
          <input type="text" id="prSubcategory" class="form-input" placeholder="e.g., Rings, Necklace">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Karat</label>
          <select id="prKarat" class="form-select">
            <option value="">N/A</option>
            <option value="24K">24K</option>
            <option value="22K">22K</option>
            <option value="21K">21K</option>
            <option value="18K">18K</option>
            <option value="16K">16K</option>
            <option value="14K">14K</option>
            <option value="12K">12K</option>
            <option value="10K">10K</option>
            <option value="8K">8K</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Weight (grams) *</label>
          <input type="number" id="prWeight" class="form-input" step="0.001" placeholder="0.000">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Cost Price (Rs) *</label>
          <input type="number" id="prCost" class="form-input" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Sale Price (Rs) *</label>
          <input type="number" id="prSale" class="form-input" placeholder="0">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Stock Quantity</label>
          <input type="number" id="prStock" class="form-input" value="0">
        </div>
        <div class="form-group">
          <label class="form-label">Featured (Homepage)</label>
          <select id="prFeatured" class="form-select">
            <option value="false">No</option>
            <option value="true">Yes</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Product Images (Max 5) *</label>
        <input type="file" id="prImages" class="form-input" accept="image/*" multiple style="padding:10px;" onchange="previewImages(this)">
        <div id="prImagesPreview" class="image-preview-grid"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="prDescription" class="form-input" rows="3" placeholder="Product description..."></textarea>
      </div>

      <button class="btn-primary" onclick="saveProduct()" id="saveBtn" style="width:100%;">Save Product</button>
    </div>

    <h2 class="section-title">All Products</h2>
    <div class="data-list" id="productsList">
      <div class="empty-state"><p>Loading products...</p></div>
    </div>
  </div>

  <script src="../../js/supabase.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let uploadedImageUrls = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin'])) return;
      await generateProductCode();
      loadProducts();
    });

    async function generateProductCode() {
      const cat = document.getElementById('prCategory').value;
      const catPrefix = cat.toUpperCase().slice(0, 3);
      
      try {
        const products = await getRecordsFast('products', true);
        const catCount = products.filter(p => p.category === cat).length;
        const num = String(catCount + 1).padStart(3, '0');
        document.getElementById('prCode').value = `AKBAR-${catPrefix}-${num}`;
      } catch (e) {
        document.getElementById('prCode').value = `AKBAR-${catPrefix}-001`;
      }
    }

    function previewImages(input) {
      const preview = document.getElementById('prImagesPreview');
      preview.innerHTML = '';
      Array.from(input.files).slice(0, 5).forEach(file => {
        const url = URL.createObjectURL(file);
        preview.innerHTML += `<div class="image-preview-item"><img src="${url}"></div>`;
      });
    }

    async function saveProduct() {
      const name = document.getElementById('prName').value.trim();
      const weight = parseFloat(document.getElementById('prWeight').value) || 0;
      const cost = parseFloat(document.getElementById('prCost').value) || 0;
      const sale = parseFloat(document.getElementById('prSale').value) || 0;
      const code = document.getElementById('prCode').value;
      const images = document.getElementById('prImages').files;
      
      if (!name) { alert('❌ Product name required'); return; }
      if (weight <= 0) { alert('❌ Weight required'); return; }
      if (cost <= 0) { alert('❌ Cost price required'); return; }
      if (sale <= 0) { alert('❌ Sale price required'); return; }
      if (images.length === 0) { alert('❌ Please upload at least 1 image'); return; }

      const btn = document.getElementById('saveBtn');
      btn.textContent = 'Uploading Images...'; 
      btn.disabled = true;

      try {
        // Upload images to Cloudinary
        const imageUrls = [];
        for (const file of Array.from(images).slice(0, 5)) {
          const formData = new FormData();
          formData.append('file', file);
          formData.append('upload_preset', CLOUDINARY_PRESET || 'akbar-jewellers');
          
          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME || 'olpbssol'}/image/upload`, {
            method: 'POST',
            body: formData
          });
          
          if (!res.ok) throw new Error('Image upload failed');
          const data = await res.json();
          imageUrls.push(data.secure_url);
        }

        // Save product to Supabase
        const productData = {
          product_code: code,
          name: name,
          category: document.getElementById('prCategory').value,
          subcategory: document.getElementById('prSubcategory').value.trim(),
          karat: document.getElementById('prKarat').value,
          weight: weight,
          cost_price: cost,
          sale_price: sale,
          stock: parseInt(document.getElementById('prStock').value) || 0,
          featured: document.getElementById('prFeatured').value === 'true',
          images: imageUrls,
          description: document.getElementById('prDescription').value.trim(),
          is_active: true
        };

        const res = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(productData)
        });

        if (!res.ok) throw new Error(await res.text());

        alert('✅ Product saved!\n\nID: ' + code);
        clearForm();
        await generateProductCode();
        loadProducts();

      } catch (error) {
        alert('❌ Error: ' + error.message);
      } finally {
        btn.textContent = 'Save Product'; 
        btn.disabled = false;
      }
    }

    function clearForm() {
      ['prName','prWeight','prCost','prSale','prSubcategory','prDescription'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('prImages').value = '';
      document.getElementById('prImagesPreview').innerHTML = '';
      document.getElementById('prStock').value = '0';
      document.getElementById('prFeatured').value = 'false';
    }

    async function loadProducts() {
      const container = document.getElementById('productsList');
      try {
        const products = await getRecordsFast('products', true);
        
        if (!products || products.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>No products yet</p></div>';
          return;
        }

        container.innerHTML = products.map(p => `
          <div class="data-item">
            <div style="display:flex; gap:15px; align-items:center;">
              ${p.images && p.images[0] 
                ? `<img src="${p.images[0]}" style="width:60px; height:60px; border-radius:8px; object-fit:cover; border:2px solid #FFD700;">` 
                : '<div style="width:60px; height:60px; background:#2A2A2A; border-radius:8px; display:flex; align-items:center; justify-content:center;">📦</div>'}
              <div>
                <div class="data-item-title">${p.name}</div>
                <div class="data-item-sub" style="color:#FFD700; font-weight:600;">ID: ${p.product_code || 'N/A'}</div>
                <div class="data-item-sub">${(p.category || '').toUpperCase()} • ${p.weight || 0}g ${p.karat ? '• ' + p.karat : ''}</div>
              </div>
            </div>
            <div style="text-align:right;">
              <div class="data-item-value">${formatPKR(p.sale_price)}</div>
              <div class="data-item-sub">Cost: ${formatPKR(p.cost_price)}</div>
              <button class="btn-icon delete" onclick="deleteProduct('${p.id}')" style="margin-top:8px;">🗑️ Delete</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = '<div class="empty-state"><p>Error loading products: ' + e.message + '</p></div>';
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (!res.ok) throw new Error('Delete failed');
        alert('✅ Deleted');
        loadProducts();
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }
  </script>
</body>
</html>
