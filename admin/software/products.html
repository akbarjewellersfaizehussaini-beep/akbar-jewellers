<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
  <style>
    .product-image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 10px; }
    .product-image-item { border-radius: 8px; overflow: hidden; border: 2px solid var(--gold-primary); }
    .product-image-item img { width: 100%; height: 80px; object-fit: cover; }
    .product-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
    .product-card-item { background: var(--black-soft); border: 1px solid rgba(255,215,0,0.2); border-radius: 14px; overflow: hidden; transition: all 0.3s; }
    .product-card-item:hover { border-color: var(--gold-primary); box-shadow: 0 10px 30px rgba(255,215,0,0.2); transform: translateY(-4px); }
    .product-card-img { width: 100%; height: 180px; object-fit: cover; background: var(--charcoal); }
    .product-card-body { padding: 15px; }
    .product-card-title { font-family: var(--font-heading); color: var(--gold-primary); font-size: 1.05rem; margin-bottom: 5px; }
    .product-card-code { color: #93C5FD; font-size: 0.75rem; font-family: var(--font-mono); margin-bottom: 8px; }
    .stock-tag { display: inline-block; padding: 3px 10px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; margin-top: 5px; }
    .stock-in { background: rgba(37,211,102,0.2); color: #86EFAC; }
    .stock-out { background: rgba(220,38,38,0.2); color: #FCA5A5; }
    .product-actions { display: flex; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Products
    </div>
    <button onclick="goBack('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Product Management</h1>
    <p class="page-subtitle">Total weight + total qty → per piece weight auto</p>

    <div class="form-card">
      <h3 class="form-card-title" id="formTitle">➕ Add New Product</h3>
      <input type="hidden" id="editProductId">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Product Name <span class="required">*</span></label>
          <input type="text" id="prName" class="form-input" placeholder="e.g., Baby Rings">
        </div>
        <div class="form-group">
          <label class="form-label">Category <span class="required">*</span></label>
          <select id="prCategory" class="form-select" onchange="generateProductCode()">
            <option value="gold">Gold</option>
            <option value="silver">Silver</option>
            <option value="diamond">Diamond</option>
            <option value="artificial">Artificial</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Product ID (Auto — Primary Key)</label>
          <input type="text" id="prCode" class="form-input" readonly style="background:var(--charcoal); color:var(--gold-primary); font-weight:700; font-family:var(--font-mono);">
        </div>
        <div class="form-group">
          <label class="form-label">Karat</label>
          <select id="prKarat" class="form-select">
            <option value="">N/A</option>
            <option value="24K">24K</option>
            <option value="22K">22K</option>
            <option value="21K">21K</option>
            <option value="18K">18K</option>
            <option value="16K">16K</option>
            <option value="14K">14K</option>
            <option value="12K">12K</option>
          </select>
        </div>
      </div>

      <!-- MAIN: QTY + TOTAL WEIGHT -->
      <h4 style="color:var(--gold-primary); margin:20px 0 10px; font-family:var(--font-heading);">📦 Quantity & Weight</h4>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Total Quantity (pcs) <span class="required">*</span></label>
          <input type="number" id="prOpeningStock" class="form-input number-input" value="10" min="0" oninput="calcPerPiece()">
        </div>
        <div class="form-group">
          <label class="form-label">Total Weight (grams) <span class="required">*</span></label>
          <input type="number" id="prTotalWeight" class="form-input number-input" step="0.001" placeholder="0.000" oninput="calcPerPiece()">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Per Piece Weight (auto)</label>
          <input type="text" id="prWeight" class="form-input" readonly style="background:var(--charcoal); color:var(--gold-primary); font-weight:700; font-size:1.1rem;">
        </div>
        <div class="form-group">
          <label class="form-label">Size</label>
          <input type="text" id="prSize" class="form-input" placeholder="e.g., 16">
        </div>
      </div>

      <h4 style="color:var(--gold-primary); margin:20px 0 10px; font-family:var(--font-heading);">💰 Pricing</h4>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Cost Price per Gram (Rs) <span class="required">*</span></label>
          <input type="number" id="prCostPerGram" class="form-input number-input" placeholder="0" oninput="calcPerPiece()">
        </div>
        <div class="form-group">
          <label class="form-label">Sale Price per Gram (Rs)</label>
          <input type="number" id="prSalePerGram" class="form-input number-input" placeholder="0" oninput="calcPerPiece()">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Cost per Piece (auto)</label>
          <input type="text" id="prCost" class="form-input" readonly style="background:var(--charcoal); color:#93C5FD; font-weight:700;">
        </div>
        <div class="form-group">
          <label class="form-label">Sale per Piece (auto)</label>
          <input type="text" id="prSale" class="form-input" readonly style="background:var(--charcoal); color:#25D366; font-weight:700;">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Featured</label>
          <select id="prFeatured" class="form-select"><option value="false">No</option><option value="true">Yes</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">Purchase Date</label>
          <input type="date" id="prPurchaseDate" class="form-input">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Images (Max 5) <span class="required">*</span></label>
        <input type="file" id="prImages" class="form-input" accept="image/*" multiple style="padding:10px;" onchange="previewImages(this)">
        <div id="prImagesPreview" class="product-image-grid"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="prDescription" class="form-input" rows="3"></textarea>
      </div>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-primary" onclick="saveProduct()" id="saveBtn" style="flex:1;">💾 Save Product</button>
        <button class="btn-secondary" onclick="cancelEdit()" id="cancelBtn" style="flex:1; display:none;">❌ Cancel</button>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
      <input type="text" id="searchProducts" class="form-input" placeholder="🔍 Search..." style="flex:1; min-width:200px;" oninput="filterProducts()">
      <select id="filterCategory" class="form-select" style="width:auto;" onchange="filterProducts()">
        <option value="">All Categories</option>
        <option value="gold">Gold</option>
        <option value="silver">Silver</option>
        <option value="diamond">Diamond</option>
        <option value="artificial">Artificial</option>
      </select>
    </div>

    <h2 class="section-title">📋 All Products (<span id="productCount">0</span>)</h2>
    <div id="productsGrid" class="product-card-grid">
      <div class="empty-state"><p>Loading...</p></div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let uploadedImages = [];
    let allProducts = [];
    let allPurchases = [];
    let allSales = [];
    let allReturns = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'sales', 'purchase'])) return;
      if (typeof clearCache === 'function') clearCache();
      document.getElementById('prPurchaseDate').value = new Date().toISOString().slice(0, 10);
      await generateProductCode();
      loadProducts();
    });

    async function generateProductCode() {
      const cat = document.getElementById('prCategory').value;
      const prefix = cat.toUpperCase().slice(0, 3);
      try {
        const products = await getRecordsFast('products', true);
        const count = products.filter(p => p.category === cat).length;
        const num = String(count + 1).padStart(3, '0');
        document.getElementById('prCode').value = `AKBAR-${prefix}-${num}`;
      } catch (e) { document.getElementById('prCode').value = `AKBAR-${prefix}-001`; }
    }

    function calcPerPiece() {
      const qty = parseFloat(document.getElementById('prOpeningStock').value) || 0;
      const totalWeight = parseFloat(document.getElementById('prTotalWeight').value) || 0;
      const costPerGram = parseFloat(document.getElementById('prCostPerGram').value) || 0;
      const salePerGram = parseFloat(document.getElementById('prSalePerGram').value) || 0;

      const perPc = qty > 0 ? (totalWeight / qty) : 0;
      document.getElementById('prWeight').value = perPc.toFixed(3) + 'g';

      const costPerPc = perPc * costPerGram;
      const salePerPc = perPc * salePerGram;
      document.getElementById('prCost').value = formatPKR(costPerPc);
      document.getElementById('prSale').value = formatPKR(salePerPc);
    }

    function previewImages(input) {
      const preview = document.getElementById('prImagesPreview');
      preview.innerHTML = '';
      Array.from(input.files).slice(0, 5).forEach(file => {
        preview.innerHTML += `<div class="product-image-item"><img src="${URL.createObjectURL(file)}"></div>`;
      });
    }

    async function saveProduct() {
      const name = document.getElementById('prName').value.trim();
      const totalQty = parseFloat(document.getElementById('prOpeningStock').value) || 0;
      const totalWeight = parseFloat(document.getElementById('prTotalWeight').value) || 0;
      const costPerGram = parseFloat(document.getElementById('prCostPerGram').value) || 0;
      const salePerGram = parseFloat(document.getElementById('prSalePerGram').value) || 0;
      const code = document.getElementById('prCode').value;
      const images = document.getElementById('prImages').files;
      const editId = document.getElementById('editProductId').value;
      const isEdit = !!editId;

      if (!name) { alert('❌ Name required'); return; }
      if (totalQty <= 0) { alert('❌ Total quantity required'); return; }
      if (totalWeight <= 0) { alert('❌ Total weight required'); return; }
      if (costPerGram <= 0) { alert('❌ Cost price required'); return; }
      if (!isEdit && images.length === 0 && uploadedImages.length === 0) { alert('❌ Image upload karein'); return; }

      const btn = document.getElementById('saveBtn');
      btn.textContent = '⏳ Saving...'; btn.disabled = true;

      try {
        const perPieceWeight = totalWeight / totalQty;
        const costPerPc = perPieceWeight * costPerGram;
        const salePerPc = perPieceWeight * salePerGram;

        const imageUrls = [...uploadedImages];
        if (images.length > 0) {
          for (const file of Array.from(images).slice(0, 5)) {
            imageUrls.push(await uploadImage(file));
          }
        }

        const productData = {
          product_code: code,
          name: name,
          category: document.getElementById('prCategory').value,
          karat: document.getElementById('prKarat').value,
          weight: perPieceWeight,
          size: document.getElementById('prSize').value.trim(),
          cost_price: costPerPc,
          sale_price: salePerPc,
          opening_stock: totalQty,
          current_stock: totalQty,
          featured: document.getElementById('prFeatured').value === 'true',
          images: imageUrls.slice(0, 5),
          description: document.getElementById('prDescription').value.trim(),
          purchase_date: document.getElementById('prPurchaseDate').value,
          is_active: true
        };

        if (isEdit) {
          await updateRecord('products', editId, productData);
          alert('✅ Product updated!');
        } else {
          await addRecord('products', productData);
          alert('✅ Product saved!\n\nID: ' + code + '\nPer piece weight: ' + perPieceWeight.toFixed(3) + 'g');
        }

        clearForm();
        await generateProductCode();
        loadProducts();
      } catch (error) { alert('❌ ' + error.message); }
      finally { btn.textContent = '💾 Save Product'; btn.disabled = false; }
    }

    function clearForm() {
      ['prName','prTotalWeight','prCostPerGram','prSalePerGram','prDescription','prSize','editProductId','prWeight','prCost','prSale'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('prImages').value = '';
      document.getElementById('prImagesPreview').innerHTML = '';
      document.getElementById('prOpeningStock').value = '10';
      document.getElementById('prFeatured').value = 'false';
      document.getElementById('prPurchaseDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('formTitle').textContent = '➕ Add New Product';
      document.getElementById('cancelBtn').style.display = 'none';
      uploadedImages = [];
      generateProductCode();
    }

    function cancelEdit() { clearForm(); }

    async function loadProducts() {
      try {
        allProducts = await getRecordsFast('products', true);
        allPurchases = await getRecordsFast('purchases', true);
        allSales = await getRecordsFast('sales', true);
        allReturns = await getRecordsFast('returns', true);
        renderProducts(allProducts);
      } catch (e) {
        document.getElementById('productsGrid').innerHTML = '<div class="empty-state"><p>Error: ' + e.message + '</p></div>';
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('productsGrid');
      document.getElementById('productCount').textContent = products.length;
      if (!products || products.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📦</div><p>No products yet</p></div>';
        return;
      }
      container.innerHTML = products.map(p => {
        const live = calculateLiveStock(p.product_code, allProducts, allPurchases, allSales, allReturns);
        const img = p.images && p.images[0] ? p.images[0] : '../../images/placeholder.svg';
        return `
          <div class="product-card-item">
            <img src="${img}" class="product-card-img" onerror="this.src='../../images/placeholder.svg'">
            <div class="product-card-body">
              <div class="product-card-title">${p.name}</div>
              <div class="product-card-code">${p.product_code || 'N/A'}</div>
              <div style="color:var(--text-muted); font-size:0.75rem; margin-bottom:8px;">${(p.category || '').toUpperCase()} ${p.karat ? '• ' + p.karat : ''}</div>
              <div style="color:#93C5FD; font-family:var(--font-mono); font-size:0.85rem;">Per pc: ${(Number(p.weight)||0).toFixed(3)}g</div>
              <div style="color:var(--gold-primary); font-family:var(--font-mono); font-weight:700; margin-top:5px;">Cost/pc: ${formatPKR(p.cost_price)}</div>
              <div style="color:#25D366; font-family:var(--font-mono); font-weight:700;">Sale/pc: ${formatPKR(p.sale_price)}</div>
              <div><span class="stock-tag ${live.current > 0 ? 'stock-in' : 'stock-out'}">${live.current > 0 ? '✅ Stock: ' + live.current : '❌ Out of Stock'}</span></div>
              <div class="product-actions">
                <button class="btn-secondary" style="flex:1; padding:8px; font-size:0.8rem;" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>✏️ Edit</button>
                ${deleteButtonHTML('deleteProduct', p.id)}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function editProduct(p) {
      document.getElementById('formTitle').textContent = '✏️ Edit Product';
      document.getElementById('editProductId').value = p.id;
      document.getElementById('prName').value = p.name || '';
      document.getElementById('prCategory').value = p.category || 'gold';
      document.getElementById('prCode').value = p.product_code || '';
      document.getElementById('prKarat').value = p.karat || '';
      document.getElementById('prOpeningStock').value = p.opening_stock || 0;
      document.getElementById('prTotalWeight').value = ((Number(p.weight) || 0) * (Number(p.opening_stock) || 0)).toFixed(3);
      document.getElementById('prSize').value = p.size || '';
      const perPc = Number(p.weight) || 0;
      document.getElementById('prCostPerGram').value = perPc > 0 ? Math.round(Number(p.cost_price) / perPc) : 0;
      document.getElementById('prSalePerGram').value = perPc > 0 ? Math.round(Number(p.sale_price) / perPc) : 0;
      document.getElementById('prFeatured').value = p.featured ? 'true' : 'false';
      document.getElementById('prDescription').value = p.description || '';
      document.getElementById('prPurchaseDate').value = p.purchase_date || new Date().toISOString().slice(0, 10);
      uploadedImages = p.images || [];
      document.getElementById('cancelBtn').style.display = 'block';
      calcPerPiece();
      document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth' });
    }

    async function deleteProduct(id) {
      if (!confirmDelete('this product')) return;
      try { await deleteRecord('products', id); alert('✅ Deleted'); loadProducts(); }
      catch (e) { alert('❌ ' + e.message); }
    }

    function filterProducts() {
      const search = document.getElementById('searchProducts').value.toLowerCase();
      const category = document.getElementById('filterCategory').value;
      let filtered = allProducts;
      if (search) filtered = filtered.filter(p => (p.name || '').toLowerCase().includes(search) || (p.product_code || '').toLowerCase().includes(search));
      if (category) filtered = filtered.filter(p => p.category === category);
      renderProducts(filtered);
    }
  </script>
</body>
</html>
