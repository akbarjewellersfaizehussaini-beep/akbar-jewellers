<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Accounts – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
  <style>
    .account-card { background: linear-gradient(135deg, var(--black-soft), #252525); border: 2px solid rgba(255,215,0,0.3); border-radius: 16px; padding: 20px; margin-bottom: 15px; position: relative; overflow: hidden; transition: all 0.3s; }
    .account-card:hover { border-color: var(--gold-primary); box-shadow: 0 10px 30px rgba(255,215,0,0.2); }
    .account-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--gold-primary), var(--gold-deep)); }
    .account-card.bank::before { background: linear-gradient(90deg, #3B82F6, #1E3A8A); }
    .account-card.easypaisa::before { background: linear-gradient(90deg, #25D366, #128C7E); }
    .account-card.jazzcash::before { background: linear-gradient(90deg, #DC2626, #991B1B); }
    .account-type-badge { display: inline-block; padding: 4px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .account-type-badge.bank { background: rgba(59,130,246,0.2); color: #93C5FD; }
    .account-type-badge.easypaisa { background: rgba(37,211,102,0.2); color: #86EFAC; }
    .account-type-badge.jazzcash { background: rgba(220,38,38,0.2); color: #FCA5A5; }
    .account-balance { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 700; color: var(--gold-primary); }
    .account-actions { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
    .account-actions .btn-small { padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; border: 1px solid; font-family: var(--font-body); }
    .total-balance-card { background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05)); border: 2px solid var(--gold-primary); border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 30px; }
    .total-balance-value { font-family: var(--font-heading); font-size: 3rem; color: var(--gold-primary); font-weight: 700; text-shadow: 0 0 30px rgba(255,215,0,0.3); }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Bank Accounts
    </div>
    <button onclick="navigate('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Bank / Easypaisa / JazzCash</h1>
    <p class="page-subtitle">Aap ke saare accounts ka balance ek jagah</p>

    <div class="total-balance-card">
      <div style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px;">Total Balance in All Accounts</div>
      <div class="total-balance-value" id="totalBalance">Rs 0</div>
      <div style="color: var(--text-muted); font-size: 0.85rem; margin-top: 10px;" id="accountCount">0 accounts</div>
    </div>

    <div class="form-card">
      <h3 class="form-card-title" id="formTitle">➕ Add New Account</h3>
      <input type="hidden" id="editAccountId">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Account Type <span class="required">*</span></label>
          <select id="accType" class="form-select">
            <option value="bank">🏦 Bank Account</option>
            <option value="easypaisa">💚 Easypaisa</option>
            <option value="jazzcash">🔴 JazzCash</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Account Name <span class="required">*</span></label>
          <input type="text" id="accName" class="form-input" placeholder="e.g., Meezan Bank / My Easypaisa">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Account Title <span class="required">*</span></label>
          <input type="text" id="accTitle" class="form-input" placeholder="Account holder name">
        </div>
        <div class="form-group">
          <label class="form-label">Account Number / IBAN <span class="required">*</span></label>
          <input type="text" id="accNumber" class="form-input" placeholder="03234086439 / PK36MEZN...">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Branch (Bank only)</label>
          <input type="text" id="accBranch" class="form-input" placeholder="e.g., Tajbagh Lahore">
        </div>
        <div class="form-group">
          <label class="form-label">Opening Balance (Rs) <span class="required">*</span></label>
          <input type="number" id="accOpening" class="form-input number-input" placeholder="0">
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn-primary" onclick="saveAccount()" id="saveAccountBtn" style="flex: 1;">💾 Save Account</button>
        <button class="btn-secondary" onclick="cancelEdit()" id="cancelBtn" style="flex: 1; display: none;">❌ Cancel</button>
      </div>
    </div>

    <h2 class="section-title">📋 All Accounts</h2>
    <div id="accountsGrid">
      <div class="empty-state"><p>Loading...</p></div>
    </div>
  </div>

  <!-- Transaction Modal -->
  <div id="txnModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
      <h2 class="modal-title" id="txnModalTitle">💰 Add Transaction</h2>
      <input type="hidden" id="txnAccountId">
      
      <div class="form-group">
        <label class="form-label">Transaction Type</label>
        <select id="txnType" class="form-select">
          <option value="deposit">➕ Deposit (Paisa Aaya)</option>
          <option value="withdraw">➖ Withdraw (Paisa Gaya)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">Amount (Rs) <span class="required">*</span></label>
        <input type="number" id="txnAmount" class="form-input number-input" placeholder="0">
      </div>
      
      <div class="form-group">
        <label class="form-label">Description</label>
        <input type="text" id="txnDesc" class="form-input" placeholder="e.g., Customer payment / Shop expense">
      </div>
      
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" id="txnDate" class="form-input">
      </div>
      
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn-primary" onclick="saveTransaction()" style="flex: 1;">💾 Save</button>
        <button class="btn-danger" onclick="document.getElementById('txnModal').classList.remove('active')" style="flex: 1;">Close</button>
      </div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="historyModal" class="modal">
    <div class="modal-content" style="max-width: 700px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 class="modal-title" style="margin:0;">📒 Transaction History</h2>
        <button onclick="document.getElementById('historyModal').classList.remove('active')" style="background:none; border:none; color:var(--gold-primary); font-size:1.5rem; cursor:pointer;">×</button>
      </div>
      <div id="historyContent"></div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let allAccounts = [];
    let allTransactions = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin'])) return;
      document.getElementById('txnDate').value = new Date().toISOString().slice(0, 10);
      loadAccounts();
    });

    async function saveAccount() {
      const type = document.getElementById('accType').value;
      const name = document.getElementById('accName').value.trim();
      const title = document.getElementById('accTitle').value.trim();
      const number = document.getElementById('accNumber').value.trim();
      const branch = document.getElementById('accBranch').value.trim();
      const opening = parseFloat(document.getElementById('accOpening').value) || 0;
      const editId = document.getElementById('editAccountId').value;
      const isEdit = !!editId;

      if (!name || !title || !number) { alert('❌ Name, title, and account number required'); return; }

      const btn = document.getElementById('saveAccountBtn');
      btn.textContent = '⏳ Saving...'; btn.disabled = true;

      try {
        const data = {
          account_type: type,
          account_name: name,
          account_title: title,
          account_number: number,
          branch: branch || null,
          opening_balance: opening,
          current_balance: opening,
          is_active: true
        };

        if (isEdit) {
          await updateRecord('bank_accounts', editId, data);
          alert('✅ Account updated!');
        } else {
          await addRecord('bank_accounts', data);
          alert('✅ Account added!');
        }

        clearForm();
        loadAccounts();
      } catch (e) {
        alert('❌ Error: ' + e.message);
      } finally {
        btn.textContent = '💾 Save Account';
        btn.disabled = false;
      }
    }

    function clearForm() {
      ['accName','accTitle','accNumber','accBranch','accOpening','editAccountId'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('formTitle').textContent = '➕ Add New Account';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    function cancelEdit() {
      clearForm();
    }

    async function loadAccounts() {
      const accounts = await getRecordsFast('bank_accounts', true);
      allTransactions = await getRecordsFast('bank_transactions', true) || [];
      allAccounts = accounts;
      
      const container = document.getElementById('accountsGrid');
      
      if (!accounts || accounts.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🏦</div><p>No accounts yet. Add your first account above.</p></div>';
        document.getElementById('totalBalance').textContent = 'Rs 0';
        document.getElementById('accountCount').textContent = '0 accounts';
        return;
      }

      // Calculate balances with transactions
      let totalBalance = 0;
      const accountsWithBalance = accounts.map(acc => {
        let balance = Number(acc.opening_balance) || 0;
        const accTxns = allTransactions.filter(t => t.account_id === acc.id);
        
        accTxns.forEach(t => {
          if (t.transaction_type === 'deposit') balance += Number(t.amount) || 0;
          else if (t.transaction_type === 'withdraw') balance -= Number(t.amount) || 0;
        });
        
        totalBalance += balance;
        return { ...acc, calculated_balance: balance, txn_count: accTxns.length };
      });

      document.getElementById('totalBalance').textContent = formatPKR(totalBalance);
      document.getElementById('accountCount').textContent = accounts.length + ' account' + (accounts.length > 1 ? 's' : '');

      container.innerHTML = accountsWithBalance.map(acc => {
        const typeLabel = acc.account_type === 'bank' ? '🏦 Bank' : acc.account_type === 'easypaisa' ? '💚 Easypaisa' : '🔴 JazzCash';
        return `
          <div class="account-card ${acc.account_type}">
            <div style="display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 10px;">
              <div style="flex: 1; min-width: 200px;">
                <span class="account-type-badge ${acc.account_type}">${typeLabel}</span>
                <h3 style="font-family: var(--font-heading); color: var(--gold-primary); font-size: 1.2rem; margin: 10px 0 5px;">${acc.account_name}</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 3px;">👤 ${acc.account_title}</p>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 3px; font-family: var(--font-mono);">💳 ${acc.account_number}</p>
                ${acc.branch ? `<p style="color: var(--text-muted); font-size: 0.85rem;">📍 ${acc.branch}</p>` : ''}
              </div>
              <div style="text-align: right;">
                <div style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;">Current Balance</div>
                <div class="account-balance" style="color: ${acc.calculated_balance >= 0 ? 'var(--gold-primary)' : 'var(--danger)'};">${formatPKR(acc.calculated_balance)}</div>
                <div style="color: var(--text-muted); font-size: 0.75rem; margin-top: 5px;">${acc.txn_count} transactions</div>
              </div>
            </div>
            <div class="account-actions">
              <button class="btn-small" style="background: rgba(37,211,102,0.2); color: #86EFAC; border-color: var(--success);" onclick="openTxnModal('${acc.id}', '${acc.account_name}')">💰 Add Transaction</button>
              <button class="btn-small" style="background: rgba(59,130,246,0.2); color: #93C5FD; border-color: var(--info);" onclick="viewHistory('${acc.id}', '${acc.account_name}')">📒 History</button>
              <button class="btn-small" style="background: rgba(255,215,0,0.2); color: var(--gold-primary); border-color: var(--gold-primary);" onclick='editAccount(${JSON.stringify(acc).replace(/'/g, "&#39;")})'>✏️ Edit</button>
              <button class="btn-small" style="background: rgba(220,38,38,0.2); color: #FCA5A5; border-color: var(--danger);" onclick="deleteAccount('${acc.id}')">🗑️ Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function editAccount(acc) {
      document.getElementById('formTitle').textContent = '✏️ Edit Account';
      document.getElementById('editAccountId').value = acc.id;
      document.getElementById('accType').value = acc.account_type || 'bank';
      document.getElementById('accName').value = acc.account_name || '';
      document.getElementById('accTitle').value = acc.account_title || '';
      document.getElementById('accNumber').value = acc.account_number || '';
      document.getElementById('accBranch').value = acc.branch || '';
      document.getElementById('accOpening').value = acc.opening_balance || 0;
      document.getElementById('cancelBtn').style.display = 'block';
      document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth' });
    }

    async function deleteAccount(id) {
      if (!confirm('Delete this account? All transactions will also be deleted.')) return;
      try {
        await deleteRecord('bank_accounts', id);
        alert('✅ Deleted');
        loadAccounts();
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }

    function openTxnModal(accountId, accountName) {
      document.getElementById('txnAccountId').value = accountId;
      document.getElementById('txnModalTitle').textContent = `💰 Transaction – ${accountName}`;
      document.getElementById('txnAmount').value = '';
      document.getElementById('txnDesc').value = '';
      document.getElementById('txnDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('txnModal').classList.add('active');
    }

    async function saveTransaction() {
      const accountId = document.getElementById('txnAccountId').value;
      const type = document.getElementById('txnType').value;
      const amount = parseFloat(document.getElementById('txnAmount').value) || 0;
      const desc = document.getElementById('txnDesc').value.trim();
      const date = document.getElementById('txnDate').value;

      if (amount <= 0) { alert('❌ Enter valid amount'); return; }

      try {
        await addRecord('bank_transactions', {
          account_id: accountId,
          transaction_type: type,
          amount: amount,
          description: desc,
          transaction_date: date
        });
        alert('✅ Transaction saved!');
        document.getElementById('txnModal').classList.remove('active');
        loadAccounts();
      } catch (e) {
        alert('❌ Error: ' + e.message);
      }
    }

    async function viewHistory(accountId, accountName) {
      const txns = allTransactions.filter(t => t.account_id === accountId).sort((a, b) => new Date(b.transaction_date || b.created_at) - new Date(a.transaction_date || a.created_at));
      
      document.getElementById('historyContent').innerHTML = `
        <h3 style="color: var(--gold-primary); margin-bottom: 15px; font-family: var(--font-heading);">${accountName}</h3>
        ${txns.length === 0 ? '<p style="text-align: center; color: var(--text-muted); padding: 30px;">No transactions yet</p>' : `
          <div style="overflow-x: auto;">
            <table class="professional-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Description</th>
                  <th style="text-align: right;">Amount</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${txns.map(t => `
                  <tr>
                    <td>${formatDate(t.transaction_date || t.created_at)}</td>
                    <td><span style="color: ${t.transaction_type === 'deposit' ? 'var(--success)' : 'var(--danger)'}; font-weight: 700;">${t.transaction_type === 'deposit' ? '➕ Deposit' : '➖ Withdraw'}</span></td>
                    <td>${t.description || '—'}</td>
                    <td class="number" style="color: ${t.transaction_type === 'deposit' ? 'var(--success)' : 'var(--danger)'};">${t.transaction_type === 'deposit' ? '+' : '-'} ${formatPKR(t.amount)}</td>
                    <td><button class="btn-danger" style="padding: 4px 8px; font-size: 0.7rem;" onclick="deleteTxn('${t.id}')">🗑️</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `}
      `;
      document.getElementById('historyModal').classList.add('active');
    }

    async function deleteTxn(id) {
      if (!confirm('Delete this transaction?')) return;
      try {
        await deleteRecord('bank_transactions', id);
        alert('✅ Deleted');
        document.getElementById('historyModal').classList.remove('active');
        loadAccounts();
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }
  </script>
</body>
</html>
