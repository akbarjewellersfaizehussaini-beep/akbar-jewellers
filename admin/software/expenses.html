<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>
  <div class="sw-header">
    <div class="sw-logo">Expenses</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Expense Management</h1>
    
    <div class="stats-grid">
      <div class="stat-card gold"><div class="stat-label">Total Expenses</div><div class="stat-value" id="totalExpenses" style="font-family:'Playfair Display',serif;">Rs 0</div></div>
      <div class="stat-card silver"><div class="stat-label">This Month</div><div class="stat-value" id="monthExpenses" style="font-family:'Playfair Display',serif;">Rs 0</div></div>
      <div class="stat-card diamond"><div class="stat-label">Total Entries</div><div class="stat-value" id="totalCount" style="font-family:'Playfair Display',serif;">0</div></div>
    </div>

    <div class="form-card">
      <h3 class="form-card-title">Add Expense</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select id="eCategory" class="form-select">
            <option value="rent">Shop Rent</option>
            <option value="electricity">Electricity Bill</option>
            <option value="salary">Staff Salary</option>
            <option value="karigar">Karigar Payment</option>
            <option value="supplier">Supplier Payment</option>
            <option value="transport">Transport</option>
            <option value="food">Food / Tea</option>
            <option value="packaging">Packaging</option>
            <option value="repair">Shop Repair</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Amount (Rs) *</label><input type="number" id="eAmount" class="form-input" placeholder="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Paid To</label><input type="text" id="ePaidTo" class="form-input" placeholder="Person / Business name"></div>
        <div class="form-group">
          <label class="form-label">Payment Mode</label>
          <select id="ePayment" class="form-select">
            <option value="cash">Cash</option>
            <option value="bank">Bank Transfer</option>
            <option value="easypaisa">Easypaisa</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Expense Date</label><input type="date" id="eDate" class="form-input"></div>
        <div class="form-group"><label class="form-label">Notes</label><input type="text" id="eNotes" class="form-input" placeholder="Optional"></div>
      </div>
      <button class="btn-primary" onclick="saveExpense()" style="width:100%;">Save Expense</button>
    </div>

    <h2 class="section-title">Recent Expenses</h2>
    <div class="data-list" id="expensesList"></div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'sales', 'purchase'])) return;
      document.getElementById('eDate').value = new Date().toISOString().slice(0, 10);
      loadExpenses();
    });

    async function saveExpense() {
      const amount = parseFloat(document.getElementById('eAmount').value) || 0;
      if (amount <= 0) { alert('❌ Enter valid amount'); return; }

      const btn = event.target;
      btn.textContent = 'Saving...'; btn.disabled = true;

      try {
        await addRecord('expenses', {
          category: document.getElementById('eCategory').value,
          amount: amount,
          paid_to: document.getElementById('ePaidTo').value.trim(),
          payment_mode: document.getElementById('ePayment').value,
          notes: document.getElementById('eNotes').value.trim(),
          expense_date: document.getElementById('eDate').value || new Date().toISOString().slice(0,10)
        });
        
        alert('✅ Expense saved!');
        clearForm(); loadExpenses();
      } catch (e) {
        alert('❌ ' + e.message);
      } finally {
        btn.textContent = 'Save Expense'; btn.disabled = false;
      }
    }

    function clearForm() {
      ['eAmount','ePaidTo','eNotes'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('eDate').value = new Date().toISOString().slice(0,10);
    }

    async function loadExpenses() {
      const expenses = await getRecordsFast('expenses');
      const container = document.getElementById('expensesList');
      
      const total = expenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
      const thisMonth = new Date().toISOString().slice(0, 7);
      const monthTotal = expenses.filter(e => e.date?.startsWith(thisMonth)).reduce((sum, e) => sum + (Number(e.amount) || 0), 0);

      document.getElementById('totalExpenses').textContent = formatPKR(total);
      document.getElementById('monthExpenses').textContent = formatPKR(monthTotal);
      document.getElementById('totalCount').textContent = expenses.length;

      if (expenses.length === 0) { container.innerHTML = '<div class="empty-state"><p>No expenses yet</p></div>'; return; }
      
      container.innerHTML = expenses.slice(0, 30).map(e => `
        <div class="data-item">
          <div>
            <div class="data-item-title">${(e.category||'').toUpperCase()}</div>
            <div class="data-item-sub">${e.paid_to ? '👤 ' + e.paid_to + ' • ' : ''}${e.payment_mode} • ${formatDate(e.expense_date || e.created_at)}</div>
          </div>
          <div class="data-item-value" style="color:#FCA5A5;">- ${formatPKR(e.amount)}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
