<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karigars – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Karigar Management
    </div>
    <button onclick="navigate('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Karigar Management</h1>
    <p class="page-subtitle">Gold weight ledger – sona diya, wapas aaya, baqi</p>

    <div class="form-card">
      <h3 class="form-card-title">➕ Add New Karigar</h3>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Name <span class="required">*</span></label>
          <input type="text" id="kName" class="form-input" placeholder="Karigar ka naam">
        </div>
        <div class="form-group">
          <label class="form-label">Phone <span class="required">*</span></label>
          <input type="tel" id="kPhone" class="form-input" placeholder="03XXXXXXXXX">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">CNIC</label>
          <input type="text" id="kCNIC" class="form-input" placeholder="XXXXX-XXXXXXX-X">
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" id="kAddress" class="form-input" placeholder="Address">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Opening Gold Balance (gram)</label>
          <input type="number" id="kOpeningGold" class="form-input number-input" placeholder="0.000" step="0.001">
        </div>
        <div class="form-group">
          <label class="form-label">Opening Cash Balance (Rs)</label>
          <input type="number" id="kOpeningCash" class="form-input number-input" placeholder="0">
        </div>
      </div>

      <button class="btn-primary" onclick="saveKarigar()" id="saveKarigarBtn" style="width:100%;">
        💾 Save Karigar
      </button>
    </div>

    <h2 class="section-title">📋 All Karigars</h2>
    <div class="data-list" id="karigarsList">
      <div class="empty-state"><p>Loading...</p></div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'purchase'])) return;
      loadKarigars();
    });

    async function saveKarigar() {
      const name = document.getElementById('kName').value.trim();
      const phone = document.getElementById('kPhone').value.trim();
      
      if (!name || !phone) { alert('❌ Name and phone required'); return; }

      const btn = document.getElementById('saveKarigarBtn');
      btn.textContent = '⏳ Saving...'; btn.disabled = true;

      try {
        await addRecord('karigars', {
          name,
          phone,
          cnic: document.getElementById('kCNIC').value.trim(),
          address: document.getElementById('kAddress').value.trim(),
          opening_gold: parseFloat(document.getElementById('kOpeningGold').value) || 0,
          opening_cash: parseFloat(document.getElementById('kOpeningCash').value) || 0
        });
        
        alert('✅ Karigar saved!');
        clearForm();
        loadKarigars();
      } catch (e) {
        alert('❌ Error: ' + e.message);
      } finally {
        btn.textContent = '💾 Save Karigar'; btn.disabled = false;
      }
    }

    function clearForm() {
      ['kName','kPhone','kCNIC','kAddress','kOpeningGold','kOpeningCash'].forEach(id => document.getElementById(id).value = '');
    }

    async function loadKarigars() {
      const karigars = await getRecordsFast('karigars');
      const services = await getRecordsFast('services');
      const payments = await getRecordsFast('payments');
      const container = document.getElementById('karigarsList');
      
      if (!karigars || karigars.length === 0) { 
        container.innerHTML = '<div class="empty-state"><div class="icon">👷</div><p>No karigars yet</p></div>'; 
        return; 
      }
      
      container.innerHTML = karigars.map(k => {
        const kServices = services.filter(s => s.karigar_name === k.name);
        const kPays = payments.filter(p => p.person_name === k.name && p.person_type === 'karigar');
        
        let totalGoldGiven = Number(k.opening_gold) || 0;
        let totalGoldReturned = 0;
        let totalCharges = Number(k.opening_cash) || 0;
        let totalPaid = 0;
        
        kServices.forEach(s => {
          totalGoldGiven += Number(s.gold_given_weight) || 0;
          totalGoldReturned += Number(s.gold_returned_weight) || 0;
          totalCharges += Number(s.charges) || 0;
          totalPaid += Number(s.paid) || 0;
        });
        kPays.forEach(p => totalPaid += Number(p.amount) || 0);
        
        const goldBalance = totalGoldGiven - totalGoldReturned;
        const cashBalance = totalCharges - totalPaid;
        
        return `
          <div class="data-item">
            <div style="cursor:pointer; flex:1;" onclick="window.location.href='karigar-ledger.html?name=${encodeURIComponent(k.name)}'">
              <div class="data-item-title">${k.name}</div>
              <div class="data-item-sub">📞 ${k.phone} ${k.cnic ? '• CNIC: ' + k.cnic : ''}</div>
              <div class="data-item-sub">📦 ${kServices.length} jobs</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <div style="text-align:right;">
                <div style="color:${goldBalance > 0 ? 'var(--danger)' : 'var(--success)'}; font-weight:700; font-size:0.9rem;">
                  🪙 ${formatWeight(goldBalance)} gold
                </div>
                <div style="color:${cashBalance > 0 ? 'var(--danger)' : 'var(--success)'}; font-weight:700; font-size:0.8rem;">
                  💰 ${formatPKR(Math.abs(cashBalance))}
                </div>
              </div>
              ${deleteButtonHTML('deleteKarigar', k.id)}
            </div>
          </div>
        `;
      }).join('');
    }

    async function deleteKarigar(id) {
      if (!confirmDelete('this karigar')) return;
      try {
        await deleteRecord('karigars', id);
        alert('✅ Karigar deleted');
        loadKarigars();
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }
  </script>
</body>
</html>
