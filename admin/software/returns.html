<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Returns – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Returns
    </div>
    <button onclick="goBack('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Returns (Wapsi)</h1>
    <p class="page-subtitle">Sale wapas — stock auto add hoga</p>

    <div class="form-card">
      <h3 class="form-card-title">🔍 Find Sale Invoice</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Search by Customer / Invoice</label>
          <input type="text" id="searchSale" class="form-input" placeholder="🔍 Customer name ya invoice number..." oninput="searchSales()">
        </div>
      </div>
      <div id="salesList" style="max-height: 400px; overflow-y: auto;">
        <div class="empty-state"><p>Search karein...</p></div>
      </div>
    </div>

    <div id="returnForm" style="display:none;">
      <div class="form-card" style="border-color: var(--danger);">
        <h3 class="form-card-title">🔄 Process Return</h3>
        <div style="background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.3); border-radius: 12px; padding: 15px; margin-bottom: 20px;">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; text-align: center;">
            <div><div style="color: var(--text-muted); font-size: 0.7rem;">INVOICE</div><div style="color: #93C5FD; font-weight: 700; font-family: var(--font-mono);" id="infoInvoice">—</div></div>
            <div><div style="color: var(--text-muted); font-size: 0.7rem;">CUSTOMER</div><div style="color: var(--gold-primary); font-weight: 700;" id="infoCustomer">—</div></div>
            <div><div style="color: var(--text-muted); font-size: 0.7rem;">SOLD QTY</div><div style="color: #FCD34D; font-weight: 700;" id="infoSoldQty">—</div></div>
            <div><div style="color: var(--text-muted); font-size: 0.7rem;">TOTAL</div><div style="color: #FFF8DC; font-weight: 700; font-family: var(--font-mono);" id="infoTotal">Rs 0</div></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Return Quantity <span class="required">*</span></label>
            <input type="number" id="rQty" class="form-input number-input" placeholder="0" min="1" oninput="autoCalcReturn()">
          </div>
          <div class="form-group">
            <label class="form-label">Return Amount (Refund) <span class="required">*</span></label>
            <input type="number" id="rAmount" class="form-input number-input" placeholder="0" oninput="autoCalcReturn()">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Return Date</label>
            <input type="date" id="rDate" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Reason</label>
            <select id="rReason" class="form-select">
              <option value="damaged">Damaged</option>
              <option value="wrong">Wrong Item</option>
              <option value="customer_request">Customer Request</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea id="rNotes" class="form-input" rows="2"></textarea>
        </div>

        <div style="background:rgba(255,215,0,0.1); border:2px solid var(--gold-primary); border-radius:12px; padding:15px; margin-bottom:15px; text-align:center;">
          <div style="color:var(--text-muted); font-size:0.75rem;">AUTO-CALCULATED REFUND</div>
          <div style="color:var(--gold-primary); font-family:var(--font-heading); font-size:1.8rem; font-weight:700;" id="autoRefund">Rs 0</div>
        </div>

        <button class="btn-danger" onclick="saveReturn()" id="saveReturnBtn" style="width:100%;">🔄 Process Return</button>
      </div>
    </div>

    <h2 class="section-title">📋 Recent Returns</h2>
    <div class="data-list" id="recentReturns"></div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let allSales = [];
    let selectedSale = null;
    let filteredSales = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'sales'])) return;
      if (typeof clearCache === 'function') clearCache();
      document.getElementById('rDate').value = new Date().toISOString().slice(0, 10);
      allSales = await getRecordsFast('sales', true);
      loadRecentReturns();
    });

    function searchSales() {
      const search = document.getElementById('searchSale').value.toLowerCase();
      const container = document.getElementById('salesList');
      if (!search) { container.innerHTML = '<div class="empty-state"><p>Type to search...</p></div>'; return; }
      filteredSales = allSales.filter(s =>
        (s.customer_name || '').toLowerCase().includes(search) ||
        (s.invoice_number || '').toLowerCase().includes(search)
      ).slice(0, 20);
      if (filteredSales.length === 0) { container.innerHTML = '<div class="empty-state"><p>No invoices</p></div>'; return; }
      container.innerHTML = filteredSales.map((s, idx) => `
        <div class="data-item" style="cursor:pointer;" onclick='selectSale(${idx})'>
          <div>
            <div class="data-item-title">${s.invoice_number} - ${s.customer_name}</div>
            <div class="data-item-sub">${s.items_summary} • Qty: ${s.qty || 1} • ${formatDate(s.sale_date)}</div>
          </div>
          <div class="data-item-value">${formatPKR(s.total)}</div>
        </div>
      `).join('');
    }

    function selectSale(idx) {
      selectedSale = filteredSales[idx];
      document.getElementById('returnForm').style.display = 'block';
      document.getElementById('infoInvoice').textContent = selectedSale.invoice_number;
      document.getElementById('infoCustomer').textContent = selectedSale.customer_name;
      document.getElementById('infoSoldQty').textContent = (selectedSale.qty || 1) + ' pcs';
      document.getElementById('infoTotal').textContent = formatPKR(selectedSale.total);
      document.getElementById('rQty').value = selectedSale.qty || 1;
      autoCalcReturn();
      document.getElementById('returnForm').scrollIntoView({ behavior: 'smooth' });
    }

    function autoCalcReturn() {
      if (!selectedSale) return;
      const qty = parseFloat(document.getElementById('rQty').value) || 0;
      const soldQty = Number(selectedSale.qty) || 1;
      const perPcAmount = soldQty > 0 ? (Number(selectedSale.total) / soldQty) : 0;
      const refund = qty * perPcAmount;
      document.getElementById('rAmount').value = Math.round(refund);
      document.getElementById('autoRefund').textContent = formatPKR(refund);
    }

    async function saveReturn() {
      if (!selectedSale) { alert('❌ Sale select karein'); return; }
      const qty = parseFloat(document.getElementById('rQty').value) || 0;
      const amount = parseFloat(document.getElementById('rAmount').value) || 0;
      if (qty <= 0 || amount <= 0) { alert('❌ Valid qty + amount'); return; }
      const btn = document.getElementById('saveReturnBtn');
      btn.textContent = '⏳ Processing...'; btn.disabled = true;
      try {
        const returnData = {
          sale_id: selectedSale.id,
          invoice_number: selectedSale.invoice_number,
          product_id: selectedSale.product_id,
          customer_name: selectedSale.customer_name,
          customer_phone: selectedSale.customer_phone,
          qty: qty,
          total: amount,
          reason: document.getElementById('rReason').value,
          notes: document.getElementById('rNotes').value.trim(),
          return_date: document.getElementById('rDate').value
        };
        await addRecord('returns', returnData);
        alert('✅ Return processed! Stock auto add ho gaya.');
        document.getElementById('returnForm').style.display = 'none';
        selectedSale = null;
        allSales = await getRecordsFast('sales', true);
        loadRecentReturns();
      } catch (e) { alert('❌ ' + e.message); }
      finally { btn.textContent = '🔄 Process Return'; btn.disabled = false; }
    }

    async function loadRecentReturns() {
      const returns = await getRecordsFast('returns', true);
      const container = document.getElementById('recentReturns');
      if (returns.length === 0) { container.innerHTML = '<div class="empty-state"><p>No returns yet</p></div>'; return; }
      container.innerHTML = returns.slice(0, 20).map(r => `
        <div class="data-item">
          <div>
            <div class="data-item-title">${r.invoice_number} - ${r.customer_name}</div>
            <div class="data-item-sub">Qty: ${r.qty} • ${r.reason} • ${formatDate(r.return_date)}</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="data-item-value" style="color:#FCA5A5;">- ${formatPKR(r.total)}</div>
            ${deleteButtonHTML('deleteReturn', r.id)}
          </div>
        </div>
      `).join('');
    }

    async function deleteReturn(id) {
      if (!confirmDelete('this return')) return;
      try { await deleteRecord('returns', id); alert('✅ Deleted'); loadRecentReturns(); }
      catch (e) { alert('❌ ' + e.message); }
    }
  </script>
</body>
</html>
