<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Returns – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Returns
    </div>
    <button onclick="navigateFresh('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Return Management</h1>
    <p class="page-subtitle">Customer se wapas aane wale products — stock auto-update</p>

    <div class="form-card">
      <h3 class="form-card-title">🔄 New Return Entry</h3>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Select Invoice to Return <span class="required">*</span></label>
          <select id="returnInvoice" class="form-select" onchange="loadInvoiceDetails()">
            <option value="">-- Select Invoice --</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Return Date</label>
          <input type="date" id="returnDate" class="form-input">
        </div>
      </div>

      <div id="invoiceDetails" style="display: none;">
        <div style="background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3); border-radius: 12px; padding: 15px; margin-bottom: 20px;">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; text-align: center;">
            <div>
              <div style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase;">Invoice #</div>
              <div style="color: var(--gold-primary); font-weight: 700; font-family: var(--font-mono); font-size: 0.95rem;" id="infoInvNum">—</div>
            </div>
            <div>
              <div style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase;">Customer</div>
              <div style="color: #FFF8DC; font-weight: 700;" id="infoCustomer">—</div>
            </div>
            <div>
              <div style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase;">Product</div>
              <div style="color: #93C5FD; font-weight: 700;" id="infoProduct">—</div>
            </div>
            <div>
              <div style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase;">Total</div>
              <div style="color: var(--gold-primary); font-weight: 700; font-family: var(--font-mono);" id="infoTotal">—</div>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Return Qty <span class="required">*</span></label>
            <input type="number" id="returnQty" class="form-input number-input" placeholder="0" min="1" oninput="calcReturn()">
          </div>
          <div class="form-group">
            <label class="form-label">Return Weight (per piece)</label>
            <input type="number" id="returnWeight" class="form-input number-input" step="0.001" placeholder="0.000" oninput="calcReturn()">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Refund Rate/gram (Rs)</label>
            <input type="number" id="returnRate" class="form-input number-input" placeholder="0" oninput="calcReturn()">
          </div>
          <div class="form-group">
            <label class="form-label">Discount (Rs)</label>
            <input type="number" id="returnDiscount" class="form-input number-input" placeholder="0" oninput="calcReturn()">
          </div>
        </div>

        <div style="background: linear-gradient(135deg, rgba(37,211,102,0.1), rgba(37,211,102,0.02)); border: 2px solid #25D366; border-radius: 12px; padding: 20px; margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.9rem;">
            <span style="color: var(--text-muted);">Metal Value</span>
            <strong style="color: #FFF8DC; font-family: var(--font-mono);" id="bdMetal">Rs 0</strong>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.9rem;">
            <span style="color: var(--text-muted);">GST</span>
            <strong style="color: #FCA5A5; font-family: var(--font-mono);" id="bdGST">Rs 0</strong>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.9rem;">
            <span style="color: var(--text-muted);">Discount</span>
            <strong style="color: #86EFAC; font-family: var(--font-mono);" id="bdDiscount">Rs 0</strong>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 10px 0; border-top: 2px solid #25D366; margin-top: 8px; font-size: 1.1rem;">
            <span style="color: #25D366; font-weight: 700;">TOTAL REFUND</span>
            <strong style="color: #25D366; font-family: var(--font-heading);" id="bdTotal">Rs 0</strong>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Refund Mode</label>
            <select id="returnMode" class="form-select">
              <option value="cash">Cash Refund</option>
              <option value="bank">Bank Transfer</option>
              <option value="easypaisa">Easypaisa</option>
              <option value="jazzcash">JazzCash</option>
              <option value="exchange">Exchange (New Item)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Reason for Return</label>
          <textarea id="returnReason" class="form-input" rows="2" placeholder="e.g., Size issue, Design change, Defect..."></textarea>
        </div>

        <button class="btn-primary" onclick="saveReturn()" id="saveReturnBtn" style="width: 100%;">
          🔄 Process Return
        </button>
      </div>
    </div>

    <h2 class="section-title">📋 Recent Returns</h2>
    <div class="data-list" id="returnsList"></div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let allSales = [];
    let allReturns = [];
    let selectedInvoice = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'sales'])) return;
      if (typeof clearCache === 'function') clearCache();
      
      document.getElementById('returnDate').value = new Date().toISOString().slice(0, 10);
      
      allSales = await getRecordsFast('sales', true);
      allReturns = await getRecordsFast('returns', true) || [];
      
      const invoiceSelect = document.getElementById('returnInvoice');
      allSales.forEach(s => {
        invoiceSelect.innerHTML += `<option value="${s.id}">${s.invoice_number} - ${s.customer_name} - ${formatPKR(s.total)}</option>`;
      });
      
      loadReturns();
    });

    function loadInvoiceDetails() {
      const invId = document.getElementById('returnInvoice').value;
      if (!invId) {
        document.getElementById('invoiceDetails').style.display = 'none';
        return;
      }
      
      selectedInvoice = allSales.find(s => s.id === invId);
      if (!selectedInvoice) return;
      
      document.getElementById('invoiceDetails').style.display = 'block';
      document.getElementById('infoInvNum').textContent = selectedInvoice.invoice_number;
      document.getElementById('infoCustomer').textContent = selectedInvoice.customer_name;
      document.getElementById('infoProduct').textContent = selectedInvoice.items_summary;
      document.getElementById('infoTotal').textContent = formatPKR(selectedInvoice.total);
      
      document.getElementById('returnQty').value = selectedInvoice.qty || 1;
      document.getElementById('returnWeight').value = selectedInvoice.weight || 0;
      document.getElementById('returnRate').value = selectedInvoice.rate || 0;
      
      calcReturn();
    }

    function calcReturn() {
      const qty = parseFloat(document.getElementById('returnQty').value) || 0;
      const weight = parseFloat(document.getElementById('returnWeight').value) || 0;
      const rate = parseFloat(document.getElementById('returnRate').value) || 0;
      const discount = parseFloat(document.getElementById('returnDiscount').value) || 0;
      
      const totalWeight = qty * weight;
      const metal = totalWeight * rate;
      const gst = Math.round(metal * 0.03);
      const total = metal + gst - discount;
      
      document.getElementById('bdMetal').textContent = formatPKR(metal);
      document.getElementById('bdGST').textContent = formatPKR(gst);
      document.getElementById('bdDiscount').textContent = '- ' + formatPKR(discount);
      document.getElementById('bdTotal').textContent = formatPKR(total);
    }

    async function saveReturn() {
      if (!selectedInvoice) { alert('❌ Invoice select karein'); return; }
      
      const qty = parseFloat(document.getElementById('returnQty').value) || 0;
      if (qty <= 0) { alert('❌ Valid qty enter karein'); return; }
      
      const btn = document.getElementById('saveReturnBtn');
      btn.textContent = '⏳ Processing...'; btn.disabled = true;

      try {
        const totalRefund = parseFloat(document.getElementById('bdTotal').textContent.replace(/[^0-9]/g, '')) || 0;
        
        const returnData = {
          return_number: 'RET-' + Date.now(),
          original_invoice: selectedInvoice.invoice_number,
          product_id: selectedInvoice.product_id,
          customer_name: selectedInvoice.customer_name,
          customer_phone: selectedInvoice.customer_phone,
          qty: qty,
          weight: parseFloat(document.getElementById('returnWeight').value) || 0,
          rate: parseFloat(document.getElementById('returnRate').value) || 0,
          refund_amount: totalRefund,
          refund_mode: document.getElementById('returnMode').value,
          reason: document.getElementById('returnReason').value.trim(),
          return_date: document.getElementById('returnDate').value
        };
        
        await addRecord('returns', returnData);
        
        // Auto-update product stock (add back)
        if (selectedInvoice.product_id) {
          const products = await getRecordsFast('products', true);
          const prod = products.find(p => p.product_code === selectedInvoice.product_id);
          if (prod) {
            const newStock = (Number(prod.current_stock) || 0) + qty;
            await updateRecord('products', prod.id, { current_stock: newStock });
          }
        }
        
        alert('✅ Return processed!\n\nRefund: ' + formatPKR(totalRefund) + '\nStock updated!');
        
        document.getElementById('returnInvoice').value = '';
        document.getElementById('invoiceDetails').style.display = 'none';
        document.getElementById('returnReason').value = '';
        selectedInvoice = null;
        
        allReturns = await getRecordsFast('returns', true) || [];
        loadReturns();
      } catch (e) {
        alert('❌ Error: ' + e.message);
      } finally {
        btn.textContent = '🔄 Process Return'; btn.disabled = false;
      }
    }

    async function loadReturns() {
      const container = document.getElementById('returnsList');
      
      if (allReturns.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No returns yet</p></div>';
        return;
      }

      container.innerHTML = allReturns.slice(0, 20).map(r => `
        <div class="data-item">
          <div>
            <div class="data-item-title">${r.customer_name} <span style="color: #FCA5A5; font-size: 0.75rem;">(${r.return_number})</span></div>
            <div class="data-item-sub">Invoice: ${r.original_invoice} • Qty: ${r.qty} • ${formatDate(r.return_date)}</div>
            <div class="data-item-sub" style="font-size: 0.7rem;">Mode: ${(r.refund_mode || '').toUpperCase()}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div class="data-item-value" style="color: #FCA5A5;">- ${formatPKR(r.refund_amount)}</div>
            ${deleteButtonHTML('deleteReturn', r.id)}
          </div>
        </div>
      `).join('');
    }

    async function deleteReturn(id) {
      if (!confirmDelete('this return')) return;
      try {
        await deleteRecord('returns', id);
        alert('✅ Return deleted');
        allReturns = await getRecordsFast('returns', true) || [];
        loadReturns();
      } catch (e) { alert('❌ ' + e.message); }
    }
  </script>
</body>
</html>
