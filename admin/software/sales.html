<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      New Sale
    </div>
    <button onclick="goBack('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">New Sale</h1>
    <p class="page-subtitle">Product select karein — cash ya credit sale</p>

    <!-- SALE TYPE -->
    <div class="form-card" style="border-color: var(--gold-primary);">
      <h3 class="form-card-title">💳 Sale Type <span class="required">*</span></h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <label style="padding: 18px; background: var(--black-royal); border: 2px solid #25D366; border-radius: 14px; cursor: pointer; text-align: center; transition: all 0.3s;" id="cashLabel">
          <input type="radio" name="saleType" value="cash" checked onchange="onSaleTypeChange()" style="margin-right: 8px;">
          <span style="font-size: 2rem;">💵</span>
          <div style="color: #25D366; font-weight: 700; margin-top: 8px;">CASH SALE</div>
          <div style="color: var(--text-muted); font-size: 0.75rem;">Poori payment abhi</div>
        </label>
        <label style="padding: 18px; background: var(--black-royal); border: 2px solid #FCD34D; border-radius: 14px; cursor: pointer; text-align: center; transition: all 0.3s;" id="creditLabel">
          <input type="radio" name="saleType" value="credit" onchange="onSaleTypeChange()" style="margin-right: 8px;">
          <span style="font-size: 2rem;">📝</span>
          <div style="color: #FCD34D; font-weight: 700; margin-top: 8px;">CREDIT SALE (UDHAAR)</div>
          <div style="color: var(--text-muted); font-size: 0.75rem;">Udhaar / advance</div>
        </label>
      </div>
    </div>

    <!-- CUSTOMER -->
    <div class="form-card">
      <h3 class="form-card-title">👤 Customer Info</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Select Customer</label>
          <select id="selectCustomer" class="form-select" onchange="fillCustomer()">
            <option value="">-- New Customer --</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Sale Date</label>
          <input type="date" id="sDate" class="form-input">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Customer Name <span class="required">*</span></label>
          <input type="text" id="cName" class="form-input" placeholder="Name">
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" id="cPhone" class="form-input" placeholder="03XXXXXXXXX">
        </div>
      </div>
    </div>

    <!-- ITEM -->
    <div class="form-card">
      <h3 class="form-card-title">📿 Item Details</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Product (Existing Only) <span class="required">*</span></label>
          <select id="sProductId" class="form-select" onchange="autoFillProduct()">
            <option value="">-- Select Product --</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Item Description</label>
          <input type="text" id="sItem" class="form-input" readonly style="background:var(--charcoal);">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Available Stock</label>
          <input type="text" id="sStock" class="form-input" readonly style="background:var(--charcoal); color:#86EFAC; font-weight:700;">
        </div>
        <div class="form-group">
          <label class="form-label">Per Piece Weight</label>
          <input type="text" id="sPerPcWeight" class="form-input" readonly style="background:var(--charcoal); color:#93C5FD; font-weight:700;">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Quantity <span class="required">*</span></label>
          <input type="number" id="sQty" class="form-input number-input" value="1" min="1" oninput="autoCalc()">
        </div>
        <div class="form-group">
          <label class="form-label">Total Weight (auto)</label>
          <input type="text" id="sTotalWeight" class="form-input" readonly style="background:var(--charcoal); color:var(--gold-primary); font-weight:700;">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Sale Rate/gram (Rs) <span class="required">*</span></label>
          <input type="number" id="sRate" class="form-input number-input" placeholder="0" oninput="autoCalc()">
        </div>
        <div class="form-group">
          <label class="form-label">Making Charges (per piece)</label>
          <input type="number" id="sMaking" class="form-input number-input" placeholder="0" oninput="autoCalc()">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Polish (per piece)</label>
          <input type="number" id="sPolish" class="form-input number-input" placeholder="0" oninput="autoCalc()">
        </div>
        <div class="form-group">
          <label class="form-label">Discount (Rs)</label>
          <input type="number" id="sDiscount" class="form-input number-input" placeholder="0" oninput="autoCalc()">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">GST %</label>
          <input type="number" id="sGST" class="form-input number-input" readonly style="background:var(--charcoal); color:var(--gold-primary);">
        </div>
      </div>
    </div>

    <!-- PRICE BREAKDOWN -->
    <div class="form-card" style="background:linear-gradient(135deg,rgba(255,215,0,0.1),rgba(255,215,0,0.02)); border-color:var(--gold-primary);">
      <h3 class="form-card-title">💰 Price Breakdown</h3>
      <div style="display:grid; grid-template-columns:1fr auto; gap:10px; font-size:0.95rem;">
        <span style="color:var(--text-muted);">Metal Value</span>
        <strong id="bdMetal" style="color:var(--text-light); text-align:right; font-family:var(--font-mono);">Rs 0</strong>
        <span style="color:var(--text-muted);">Making</span>
        <strong id="bdMaking" style="color:var(--text-light); text-align:right; font-family:var(--font-mono);">Rs 0</strong>
        <span style="color:var(--text-muted);">Polish</span>
        <strong id="bdPolish" style="color:var(--text-light); text-align:right; font-family:var(--font-mono);">Rs 0</strong>
        <span style="color:var(--gold-primary); font-weight:700; border-top:1px solid var(--gold-primary); padding-top:8px;">Subtotal</span>
        <strong id="bdSubtotal" style="color:var(--gold-primary); text-align:right; font-family:var(--font-mono); border-top:1px solid var(--gold-primary); padding-top:8px;">Rs 0</strong>
        <span style="color:var(--text-muted);">GST</span>
        <strong id="bdGST" style="color:var(--text-light); text-align:right; font-family:var(--font-mono);">Rs 0</strong>
        <span style="color:var(--success);">Discount</span>
        <strong id="bdDiscount" style="color:var(--success); text-align:right; font-family:var(--font-mono);">Rs 0</strong>
        <span style="color:var(--gold-primary); font-weight:700; font-size:1.3rem; border-top:2px solid var(--gold-primary); padding-top:10px;">TOTAL</span>
        <strong id="bdTotal" style="color:var(--gold-primary); text-align:right; font-size:1.5rem; font-family:var(--font-heading); border-top:2px solid var(--gold-primary); padding-top:10px;">Rs 0</strong>
      </div>
    </div>

    <!-- PAYMENT -->
    <div class="form-card">
      <h3 class="form-card-title">💳 Payment</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Payment Mode</label>
          <select id="sPaymentMode" class="form-select" onchange="onPaymentModeChange()">
            <option value="cash">Cash</option>
            <option value="bank">Bank Transfer</option>
            <option value="easypaisa">Easypaisa</option>
            <option value="jazzcash">JazzCash</option>
          </select>
        </div>
        <div class="form-group" id="advanceGroup" style="display:none;">
          <label class="form-label">Advance Received (Rs)</label>
          <input type="number" id="sPaid" class="form-input number-input" placeholder="0" oninput="autoCalc()">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Received (Rs)</label>
          <input type="number" id="sReceived" class="form-input number-input" placeholder="0" readonly style="background:var(--charcoal); color:#86EFAC; font-weight:700;">
        </div>
        <div class="form-group">
          <label class="form-label">Balance (Rs)</label>
          <input type="number" id="sRemaining" class="form-input number-input" readonly style="background:var(--charcoal); color:#FCD34D; font-weight:700;">
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;">
      <button class="btn-primary" onclick="saveSale(false)" id="saveSaleBtn" style="flex: 1;">💾 Save & View Invoice</button>
      <button class="btn-success" onclick="saveSale(true)" style="flex: 1;">📱 Save & WhatsApp</button>
    </div>

    <h2 class="section-title">📋 Recent Sales</h2>
    <div class="data-list" id="salesList"></div>
  </div>

  <div id="invoiceModal" class="modal">
    <div class="modal-content" style="max-width: 800px; background:#fff; color:#1A1A1A; padding: 40px;">
      <div id="printableInvoice"></div>
      <div class="action-buttons-grid">
        <button class="action-btn print-btn" onclick="printElement('printableInvoice')"><span class="btn-icon">🖨</span><span class="btn-text">Print</span></button>
        <button class="action-btn whatsapp-btn" onclick="sendInvoiceWhatsApp()"><span class="btn-icon">📱</span><span class="btn-text">WhatsApp</span></button>
        <button class="action-btn email-btn" onclick="sendInvoiceEmail()"><span class="btn-icon">📧</span><span class="btn-text">Email</span></button>
        <button class="action-btn close-btn" onclick="document.getElementById('invoiceModal').classList.remove('active')"><span class="btn-icon">✕</span><span class="btn-text">Close</span></button>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let shopRules = { gst_pct: 3 };
    let allProducts = [];
    let allPurchases = [];
    let allSales = [];
    let allReturns = [];
    let customers = [];
    let currentInvoice = null;
    let selectedProduct = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'sales'])) return;
      if (typeof clearCache === 'function') clearCache();
      document.getElementById('sDate').value = new Date().toISOString().slice(0, 10);
      shopRules = await getShopSettings();
      document.getElementById('sGST').value = shopRules.gst_pct || 3;

      allProducts = await getRecordsFast('products', true);
      allPurchases = await getRecordsFast('purchases', true);
      allSales = await getRecordsFast('sales', true);
      allReturns = await getRecordsFast('returns', true);
      customers = await getRecordsFast('customers', true);

      const prodSelect = document.getElementById('sProductId');
      allProducts.forEach(p => {
        const live = calculateLiveStock(p.product_code, allProducts, allPurchases, allSales, allReturns);
        prodSelect.innerHTML += `<option value="${p.product_code}">${p.product_code} - ${p.name} (Stock: ${live.current})</option>`;
      });

      const custSelect = document.getElementById('selectCustomer');
      customers.forEach(c => {
        custSelect.innerHTML += `<option value="${c.name}">${c.name} - ${c.phone || ''}</option>`;
      });

      onSaleTypeChange();
      loadSales();
      autoCalc();
    });

    function onSaleTypeChange() {
      const type = document.querySelector('input[name="saleType"]:checked').value;
      const cashLabel = document.getElementById('cashLabel');
      const creditLabel = document.getElementById('creditLabel');
      if (type === 'cash') {
        cashLabel.style.background = 'rgba(37,211,102,0.15)';
        creditLabel.style.background = 'var(--black-royal)';
        document.getElementById('advanceGroup').style.display = 'none';
      } else {
        creditLabel.style.background = 'rgba(252,211,77,0.15)';
        cashLabel.style.background = 'var(--black-royal)';
        document.getElementById('advanceGroup').style.display = 'block';
      }
      autoCalc();
    }

    function onPaymentModeChange() { autoCalc(); }

    function fillCustomer() {
      const name = document.getElementById('selectCustomer').value;
      if (!name) return;
      const c = customers.find(x => x.name === name);
      if (c) { document.getElementById('cName').value = c.name || ''; document.getElementById('cPhone').value = c.phone || ''; }
    }

    function autoFillProduct() {
      const code = document.getElementById('sProductId').value;
      if (!code) { selectedProduct = null; return; }
      const prod = allProducts.find(p => p.product_code === code);
      if (prod) {
        selectedProduct = prod;
        document.getElementById('sItem').value = prod.name;
        const live = calculateLiveStock(prod.product_code, allProducts, allPurchases, allSales, allReturns);
        const perPc = Number(prod.weight) || 0;
        document.getElementById('sStock').value = live.current + ' units';
        document.getElementById('sStock').style.color = live.current > 0 ? '#86EFAC' : '#FCA5A5';
        document.getElementById('sPerPcWeight').value = perPc.toFixed(3) + 'g';
        autoCalc();
      }
    }

    function autoCalc() {
      const qty = parseFloat(document.getElementById('sQty').value) || 0;
      const weight = selectedProduct ? (Number(selectedProduct.weight) || 0) : 0;
      const rate = parseFloat(document.getElementById('sRate').value) || 0;
      const making = parseFloat(document.getElementById('sMaking').value) || 0;
      const polish = parseFloat(document.getElementById('sPolish').value) || 0;
      const discount = parseFloat(document.getElementById('sDiscount').value) || 0;

      const totalWeight = qty * weight;
      const metal = totalWeight * rate;
      const makingTotal = making * qty;
      const polishTotal = polish * qty;
      const subtotal = metal + makingTotal + polishTotal;
      const gstPct = shopRules.gst_pct || 3;
      const gst = subtotal * (gstPct / 100);
      const total = subtotal + gst - discount;

      document.getElementById('sTotalWeight').value = formatWeight(totalWeight);
      document.getElementById('bdMetal').textContent = formatPKR(metal);
      document.getElementById('bdMaking').textContent = formatPKR(makingTotal);
      document.getElementById('bdPolish').textContent = formatPKR(polishTotal);
      document.getElementById('bdSubtotal').textContent = formatPKR(subtotal);
      document.getElementById('bdGST').textContent = formatPKR(gst);
      document.getElementById('bdDiscount').textContent = '- ' + formatPKR(discount);
      document.getElementById('bdTotal').textContent = formatPKR(total);

      const type = document.querySelector('input[name="saleType"]:checked').value;
      let received = 0;
      if (type === 'cash') {
        received = Math.round(total);
      } else {
        received = Math.round(parseFloat(document.getElementById('sPaid').value) || 0);
      }
      document.getElementById('sReceived').value = received;
      document.getElementById('sRemaining').value = Math.max(0, Math.round(total - received));
    }

    async function saveSale(sendWA) {
      const customer = document.getElementById('cName').value.trim();
      const productCode = document.getElementById('sProductId').value;
      if (!customer) { alert('❌ Customer name required'); return; }
      if (!productCode || !selectedProduct) { alert('❌ Product select karein'); return; }

      // STOCK CHECK
      const live = calculateLiveStock(productCode, allProducts, allPurchases, allSales, allReturns);
      const qty = parseFloat(document.getElementById('sQty').value) || 0;
      if (live.current <= 0) { alert('❌ Stock khatam hai! Pehle purchase karein.'); return; }
      if (qty > live.current) { alert(`❌ Sirf ${live.current} units available hain.`); return; }
      if (qty <= 0) { alert('❌ Valid quantity'); return; }

      const total = parseFloat(document.getElementById('bdTotal').textContent.replace(/[^0-9]/g, '')) || 0;
      if (total <= 0) { alert('❌ Total 0 hai'); return; }

      const btn = document.getElementById('saveSaleBtn');
      btn.textContent = '⏳ Saving...'; btn.disabled = true;

      try {
        const type = document.querySelector('input[name="saleType"]:checked').value;
        const weight = Number(selectedProduct.weight) || 0;
        const received = parseFloat(document.getElementById('sReceived').value) || 0;

        const sale = {
          invoice_number: 'AKBAR-' + Date.now(),
          product_id: productCode,
          customer_name: customer,
          customer_phone: document.getElementById('cPhone').value.trim(),
          items_summary: selectedProduct.name,
          qty: qty,
          weight: weight,
          total_weight: qty * weight,
          rate: parseFloat(document.getElementById('sRate').value) || 0,
          making: parseFloat(document.getElementById('sMaking').value) || 0,
          polish: parseFloat(document.getElementById('sPolish').value) || 0,
          discount: parseFloat(document.getElementById('sDiscount').value) || 0,
          gst_pct: shopRules.gst_pct || 3,
          total: total,
          received: received,
          balance: Math.max(0, total - received),
          payment_type: type === 'cash' ? 'full' : 'credit',
          payment_mode: type === 'cash' ? document.getElementById('sPaymentMode').value : 'credit',
          sale_date: document.getElementById('sDate').value
        };

        const saved = await addRecord('sales', sale);
        if (sendWA) {
          const shop = await getShopSettings();
          const msg = `*INVOICE: ${sale.invoice_number}*\nCustomer: ${customer}\nItem: ${selectedProduct.name} x ${qty}\nTotal: ${formatPKR(total)}\nReceived: ${formatPKR(received)}\nBalance: ${formatPKR(sale.balance)}\n\n${shop.name}`;
          openWhatsApp(sale.customer_phone, msg);
        }
        currentInvoice = saved;
        showInvoice(saved);
        clearForm();
        // Refresh data
        allSales = await getRecordsFast('sales', true);
        allProducts = await getRecordsFast('products', true);
        const prodSelect = document.getElementById('sProductId');
        prodSelect.innerHTML = '<option value="">-- Select Product --</option>';
        allProducts.forEach(p => {
          const lv = calculateLiveStock(p.product_code, allProducts, allPurchases, allSales, allReturns);
          prodSelect.innerHTML += `<option value="${p.product_code}">${p.product_code} - ${p.name} (Stock: ${lv.current})</option>`;
        });
        loadSales();
      } catch (e) { alert('❌ Error: ' + e.message); }
      finally { btn.textContent = sendWA ? '📱 Save & WhatsApp' : '💾 Save & View Invoice'; btn.disabled = false; }
    }

    async function showInvoice(sale) {
      const shop = await getShopSettings();
      const qty = sale.qty || 1;
      const weight = sale.weight || 0;
      const rate = sale.rate || 0;
      const making = sale.making || 0;
      const polish = sale.polish || 0;
      const discount = sale.discount || 0;
      const totalWeight = qty * weight;
      const metal = totalWeight * rate;
      const subtotal = metal + (making * qty) + (polish * qty);
      const gst = Math.round(subtotal * ((sale.gst_pct || 3) / 100));
      document.getElementById('printableInvoice').innerHTML = `
        <div style="text-align:center; border-bottom:2px solid #D4AF37; padding-bottom:15px; margin-bottom:20px;">
          <h1 style="font-family:'Playfair Display',serif; color:#D4AF37; margin:0; font-size:28px;">${shop.name}</h1>
          <p style="margin:5px 0; font-size:14px; color:#D4AF37; font-family:'Noto Nastaliq Urdu',serif;" dir="rtl">${shop.name_urdu || 'فیض حسینی'}</p>
          <p style="margin:5px 0; font-size:12px; color:#666;">${shop.address}</p>
          <p style="margin:5px 0; font-size:12px; color:#666;">Phone: ${shop.phone}</p>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
          <div><p style="margin:0; font-size:14px;"><strong>Invoice #:</strong> ${sale.invoice_number}</p><p style="margin:5px 0; font-size:14px;"><strong>Date:</strong> ${formatDate(sale.sale_date)}</p><p style="margin:5px 0; font-size:14px;"><strong>Type:</strong> ${sale.payment_type === 'full' ? 'CASH' : 'CREDIT'}</p></div>
          <div style="text-align:right;"><p style="margin:0; font-size:14px;"><strong>Customer:</strong> ${sale.customer_name}</p><p style="margin:5px 0; font-size:14px;"><strong>Phone:</strong> ${sale.customer_phone || '—'}</p></div>
        </div>
        <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
          <thead><tr style="background:#FAF7F0;"><th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Item</th><th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Qty</th><th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Weight</th><th style="border:1px solid #ddd; padding:10px; text-align:left; font-size:12px; color:#D4AF37;">Rate/g</th></tr></thead>
          <tbody><tr><td style="border:1px solid #ddd; padding:10px; font-size:14px;">${sale.items_summary}</td><td style="border:1px solid #ddd; padding:10px; font-size:14px;">${qty}</td><td style="border:1px solid #ddd; padding:10px; font-size:14px;">${formatWeight(totalWeight)}</td><td style="border:1px solid #ddd; padding:10px; font-size:14px;">${formatPKR(rate)}</td></tr></tbody>
        </table>
        <div style="background:#FAF7F0; padding:20px; border-radius:8px; margin-bottom:20px;">
          <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #E5E5E5;"><span style="font-size:13px; color:#666;">Metal Value</span><strong>${formatPKR(metal)}</strong></div>
          <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #E5E5E5;"><span style="font-size:13px; color:#666;">Making</span><strong>${formatPKR(making*qty)}</strong></div>
          <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #E5E5E5;"><span style="font-size:13px; color:#666;">Polish</span><strong>${formatPKR(polish*qty)}</strong></div>
          <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #E5E5E5;"><span style="font-size:13px; color:#666;">GST</span><strong>${formatPKR(gst)}</strong></div>
          ${discount > 0 ? `<div style="display:flex; justify-content:space-between; padding:8px 0; color:#25D366;"><span>Discount</span><strong>- ${formatPKR(discount)}</strong></div>` : ''}
          <div style="display:flex; justify-content:space-between; padding:12px 0; border-top:2px solid #D4AF37;"><span style="font-size:16px; color:#D4AF37; font-weight:700;">TOTAL</span><strong style="font-size:20px; color:#D4AF37;">${formatPKR(sale.total)}</strong></div>
        </div>
        <div style="text-align:right;"><p>Received: <strong>${formatPKR(sale.received)}</strong></p><p>Balance: <strong style="color:${sale.balance > 0 ? '#DC2626' : '#25D366'};">${formatPKR(sale.balance)}</strong></p></div>
      `;
      document.getElementById('invoiceModal').classList.add('active');
    }

    function sendInvoiceWhatsApp() {
      if (!currentInvoice) return;
      const msg = `*INVOICE: ${currentInvoice.invoice_number}*\nCustomer: ${currentInvoice.customer_name}\nItem: ${currentInvoice.items_summary}\nTotal: ${formatPKR(currentInvoice.total)}\nReceived: ${formatPKR(currentInvoice.received)}\nBalance: ${formatPKR(currentInvoice.balance)}`;
      openWhatsApp(currentInvoice.customer_phone, msg);
    }

    function sendInvoiceEmail() {
      if (!currentInvoice) return;
      const email = prompt('Customer email:', '');
      if (!email) return;
      sendEmail(email, `Invoice ${currentInvoice.invoice_number}`, `Invoice: ${currentInvoice.invoice_number}\nTotal: ${formatPKR(currentInvoice.total)}`);
    }

    function clearForm() {
      ['cName','cPhone','sItem','sRate','sMaking','sPolish','sDiscount','sPaid','sReceived','sRemaining','sStock','sPerPcWeight','sTotalWeight'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
      document.getElementById('sQty').value = '1';
      document.getElementById('sProductId').value = '';
      document.getElementById('selectCustomer').value = '';
      document.getElementById('sDate').value = new Date().toISOString().slice(0,10);
      selectedProduct = null;
      autoCalc();
    }

    async function loadSales() {
      const sales = await getRecordsFast('sales', true);
      const container = document.getElementById('salesList');
      if (sales.length === 0) { container.innerHTML = '<div class="empty-state"><p>No sales yet</p></div>'; return; }
      container.innerHTML = sales.slice(0, 20).map(s => `
        <div class="data-item">
          <div style="cursor:pointer; flex:1;" onclick='showInvoice(${JSON.stringify(s).replace(/'/g, "&#39;")})'>
            <div class="data-item-title">${s.items_summary} <span style="color:var(--gold-primary); font-size:0.8rem;">(Qty: ${s.qty || 1})</span></div>
            <div class="data-item-sub">${s.customer_name} • ${formatDate(s.sale_date)} • ${s.payment_type === 'full' ? '💵 Cash' : '📝 Credit'}</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="data-item-value">${formatPKR(s.total)}</div>
            ${deleteButtonHTML('deleteSale', s.id)}
          </div>
        </div>
      `).join('');
    }

    async function deleteSale(id) {
      if (!confirmDelete('this sale')) return;
      try { await deleteRecord('sales', id); alert('✅ Deleted'); allSales = await getRecordsFast('sales', true); loadSales(); }
      catch (e) { alert('❌ ' + e.message); }
    }
  </script>
</body>
</html>
