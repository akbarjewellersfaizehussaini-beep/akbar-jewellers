<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
    .login-box { background: var(--black-soft); border: 2px solid var(--gold-primary); border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 60px rgba(255,215,0,0.2); }
    .login-logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--gold-primary); margin: 0 auto 20px; display: block; box-shadow: 0 0 30px rgba(255,215,0,0.5); }
    .login-title { font-family: var(--font-heading); color: var(--gold-primary); font-size: 1.8rem; margin-bottom: 5px; }
    .login-urdu { font-family: var(--font-urdu); color: var(--gold-primary); font-size: 1.1rem; margin-bottom: 10px; direction: rtl; }
    .login-subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 0.9rem; letter-spacing: 2px; }
    .login-input { width: 100%; padding: 14px; margin-bottom: 15px; background: var(--black-royal); border: 1px solid rgba(255,215,0,0.3); border-radius: 10px; color: var(--text-light); font-size: 1rem; box-sizing: border-box; font-family: var(--font-body); transition: all 0.3s; }
    .login-input:focus { outline: none; border-color: var(--gold-primary); box-shadow: 0 0 20px rgba(255,215,0,0.2); }
    .login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold-primary), var(--gold-deep)); color: var(--black-royal); border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; font-family: var(--font-body); transition: all 0.3s; }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,215,0,0.4); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error { background: rgba(220,38,38,0.2); border: 1px solid var(--danger); color: #FCA5A5; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; display: none; text-align: left; }
    .login-info { color: var(--text-muted); font-size: 0.8rem; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,215,0,0.1); line-height: 1.8; }
    .creator-credit { color: #666; font-size: 0.7rem; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="login-box">
    <img src="../../images/logo.png" class="login-logo" onerror="this.style.display='none'" alt="Logo">
    <h1 class="login-title">AKBAR JEWELLERS</h1>
    <p class="login-urdu">فیض حسینی</p>
    <p class="login-subtitle">BUSINESS SOFTWARE</p>
    
    <div id="loginError" class="login-error"></div>
    
    <input type="text" id="loginUser" class="login-input" placeholder="Username" autocomplete="username">
    <input type="password" id="loginPass" class="login-input" placeholder="Password" autocomplete="current-password" onkeypress="if(event.key==='Enter') doLogin()">
    
    <button class="login-btn" id="loginBtn" onclick="doLogin()">🔐 Login</button>

    <div class="login-info">
      <strong style="color: var(--gold-primary);">Demo Logins:</strong><br>
      Admin: <code>admin</code> / <code>admin123</code><br>
      Sales: <code>sales</code> / <code>sales123</code><br>
      Purchase: <code>purchase</code> / <code>purchase123</code>
    </div>

    <div class="creator-credit">
      Designed by Bilal Marghoob Creations | 0326 6501314
    </div>
  </div>

  <script src="../../js/supabase.js"></script>
  <script src="db.js"></script>
  <script>
    function showError(msg) {
      const box = document.getElementById('loginError');
      box.textContent = msg;
      box.style.display = 'block';
    }

    async function doLogin() {
      const user = document.getElementById('loginUser').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value.trim();
      const btn = document.getElementById('loginBtn');
      
      document.getElementById('loginError').style.display = 'none';
      
      if (!user || !pass) { showError('❌ Please enter username and password'); return; }
      
      btn.textContent = '⏳ Logging in...';
      btn.disabled = true;

      try {
        if (typeof sbFetch === 'undefined') {
          throw new Error('Database not loaded. Check db.js file.');
        }

        const rows = await sbFetch(`admin_users?email=eq.${user}&select=*`);
        
        if (rows && rows.length > 0) {
          const dbUser = rows[0];
          
          if (dbUser.password_hash === pass) {
            localStorage.setItem('akbar_user_session', JSON.stringify(dbUser));
            window.location.href = 'index.html';
          } else {
            showError('❌ Wrong password. Please try again.');
          }
        } else {
          showError('❌ User not found. Check username.');
        }
      } catch (e) {
        showError('❌ Error: ' + e.message);
      } finally {
        btn.textContent = '🔐 Login';
        btn.disabled = false;
      }
    }
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW error:', err));
    });
  }
</script>
</body>
</html>
