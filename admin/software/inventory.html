<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Payments
    </div>
    <button onclick="goBack('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Payment Receipt</h1>
    <p class="page-subtitle">Sirf balance wale log dikhaye ja rahe hain</p>

    <div class="form-card">
      <h3 class="form-card-title">📋 Select Person</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Person Type</label>
          <select id="pType" class="form-select" onchange="loadPersonsWithBalance()">
            <option value="customer">👥 Customers</option>
            <option value="supplier">🏭 Suppliers</option>
            <option value="karigar">👷 Karigars</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Search</label>
          <input type="text" id="searchPerson" class="form-input" placeholder="🔍 Name ya phone..." oninput="filterPersonCards()">
        </div>
      </div>
      <div id="personsList" style="max-height: 400px; overflow-y: auto;">
        <div class="empty-state"><p>Loading...</p></div>
      </div>
    </div>

    <div id="paymentFormContainer" style="display: none;">
      <div class="form-card">
        <h3 class="form-card-title">💰 Payment Entry</h3>
        <div style="background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.03)); border: 2px solid var(--gold-primary); border-radius: 14px; padding: 20px; margin-bottom: 20px;">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; text-align: center;">
            <div><div style="color: var(--text-muted); font-size: 0.7rem;">PERSON</div><div style="color: var(--gold-primary); font-weight: 700;" id="infoPersonName">—</div><div style="color: var(--text-muted); font-size: 0.75rem;" id="infoPersonPhone">—</div></div>
            <div><div style="color: var(--text-muted); font-size: 0.7rem;">BILL</div><div style="color: #93C5FD; font-weight: 700; font-family: var(--font-mono);" id="infoTotalBill">Rs 0</div></div>
            <div><div style="color: var(--text-muted); font-size: 0.7rem;">PAID</div><div style="color: #86EFAC; font-weight: 700; font-family: var(--font-mono);" id="infoTotalPaid">Rs 0</div></div>
            <div><div style="color: var(--text-muted); font-size: 0.7rem;">BALANCE</div><div style="color: #FCA5A5; font-weight: 700; font-family: var(--font-mono); font-size: 1.1rem;" id="infoBalance">Rs 0</div></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Amount (Rs) <span class="required">*</span></label>
            <input type="number" id="pAmount" class="form-input number-input" placeholder="0">
          </div>
          <div class="form-group">
            <label class="form-label">Payment Type</label>
            <select id="pPayType" class="form-select">
              <option value="due">Against Due</option>
              <option value="advance">Advance</option>
              <option value="full">Full & Final</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Payment Mode</label>
            <select id="pMode" class="form-select">
              <option value="cash">Cash</option>
              <option value="bank">Bank Transfer</option>
              <option value="easypaisa">Easypaisa</option>
              <option value="jazzcash">JazzCash</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Payment Date <span class="required">*</span></label>
            <input type="date" id="pDate" class="form-input">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <input type="text" id="pNotes" class="form-input" placeholder="Any details...">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 15px;">
          <button class="btn-primary" onclick="savePayment(false)" id="savePayBtn" style="flex: 1;">💾 Save & Receipt</button>
          <button class="btn-success" onclick="savePayment(true)" style="flex: 1;">📱 Save & WhatsApp</button>
        </div>
      </div>
    </div>

    <h2 class="section-title">📋 Recent Payments</h2>
    <div class="data-list" id="paymentsList"></div>
  </div>

  <div id="receiptModal" class="modal">
    <div class="modal-content" style="max-width: 600px; background:#fff; color:#1A1A1A; padding: 40px;">
      <div id="printableReceipt"></div>
      <div class="action-buttons-grid">
        <button class="action-btn print-btn" onclick="printElement('printableReceipt')"><span class="btn-icon">🖨</span><span class="btn-text">Print</span></button>
        <button class="action-btn whatsapp-btn" onclick="sendReceiptWhatsApp()"><span class="btn-icon">📱</span><span class="btn-text">WhatsApp</span></button>
        <button class="action-btn close-btn" onclick="document.getElementById('receiptModal').classList.remove('active')"><span class="btn-icon">✕</span><span class="btn-text">Close</span></button>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let currentReceipt = null;
    let allPersons = [];
    let selectedPerson = null;
    let currentType = 'customer';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'sales', 'purchase'])) return;
      if (typeof clearCache === 'function') clearCache();
      document.getElementById('pDate').value = new Date().toISOString().slice(0, 10);
      await loadPersonsWithBalance();
      loadPayments();
    });

    async function loadPersonsWithBalance() {
      currentType = document.getElementById('pType').value;
      const container = document.getElementById('personsList');
      container.innerHTML = '<div class="empty-state"><p>Loading...</p></div>';
      document.getElementById('paymentFormContainer').style.display = 'none';
      selectedPerson = null;
      try {
        const sales = await getRecordsFast('sales', true);
        const purchases = await getRecordsFast('purchases', true);
        const payments = await getRecordsFast('payments', true);
        const services = await getRecordsFast('services', true);
        allPersons = [];
        if (currentType === 'customer') {
          const customers = await getRecordsFast('customers', true);
          allPersons = customers.map(c => {
            const cSales = sales.filter(s => s.customer_name === c.name);
            const cPays = payments.filter(p => p.person_name === c.name && p.person_type === 'customer');
            let bill = Number(c.opening_balance) || 0, paid = 0;
            cSales.forEach(s => bill += Number(s.total) || 0);
            cPays.forEach(p => paid += Number(p.amount) || 0);
            return { id: c.id, name: c.name, phone: c.phone, type: 'customer', totalBill: bill, totalPaid: paid, balance: bill - paid };
          }).filter(p => p.balance !== 0);
        } else if (currentType === 'supplier') {
          const suppliers = await getRecordsFast('suppliers', true);
          allPersons = suppliers.map(s => {
            const sPurch = purchases.filter(p => p.supplier_name === s.name);
            const sPays = payments.filter(p => p.person_name === s.name && p.person_type === 'supplier');
            let bill = Number(s.opening_cash) || 0, paid = 0;
            sPurch.forEach(p => bill += Number(p.total) || 0);
            sPays.forEach(p => paid += Number(p.amount) || 0);
            return { id: s.id, name: s.name, phone: s.phone, type: 'supplier', totalBill: bill, totalPaid: paid, balance: bill - paid };
          }).filter(p => p.balance !== 0);
        } else if (currentType === 'karigar') {
          const karigars = await getRecordsFast('karigars', true);
          allPersons = karigars.map(k => {
            const kServices = services.filter(s => s.karigar_name === k.name);
            const kPays = payments.filter(p => p.person_name === k.name && p.person_type === 'karigar');
            let bill = Number(k.opening_cash) || 0, paid = 0;
            kServices.forEach(s => bill += Number(s.charges) || 0);
            kPays.forEach(p => paid += Number(p.amount) || 0);
            return { id: k.id, name: k.name, phone: k.phone, type: 'karigar', totalBill: bill, totalPaid: paid, balance: bill - paid };
          }).filter(p => p.balance !== 0);
        }
        renderPersonsList();
      } catch (e) { container.innerHTML = '<div class="empty-state"><p>Error: ' + e.message + '</p></div>'; }
    }

    function renderPersonsList() {
      const container = document.getElementById('personsList');
      if (allPersons.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="icon">✅</div><p>No ${currentType}s with balance</p></div>`;
        return;
      }
      container.innerHTML = allPersons.map((p, idx) => {
        const isDue = p.balance > 0;
        const badgeColor = isDue ? '#FCA5A5' : '#86EFAC';
        const badgeBg = isDue ? 'rgba(220,38,38,0.2)' : 'rgba(37,211,102,0.2)';
        const balanceText = isDue ? `Due: ${formatPKR(p.balance)}` : `Advance: ${formatPKR(Math.abs(p.balance))}`;
        return `
          <div class="person-card" data-name="${p.name.toLowerCase()}" data-phone="${(p.phone || '').toLowerCase()}" onclick="selectPerson(${idx})" style="background:var(--black-royal); border:1px solid rgba(255,215,0,0.2); border-radius:12px; padding:15px; margin-bottom:10px; cursor:pointer;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
              <div><div style="color: var(--gold-primary); font-weight: 700;">${p.name}</div><div style="color: var(--text-muted); font-size: 0.8rem;">📞 ${p.phone || '—'}</div></div>
              <span style="padding:2px 10px; border-radius:50px; font-size:0.7rem; font-weight:700; background:${badgeBg}; color:${badgeColor};">${balanceText}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterPersonCards() {
      const search = document.getElementById('searchPerson').value.toLowerCase();
      document.querySelectorAll('.person-card').forEach(card => {
        const name = card.getAttribute('data-name');
        const phone = card.getAttribute('data-phone');
        card.style.display = (name.includes(search) || phone.includes(search)) ? 'block' : 'none';
      });
    }

    function selectPerson(idx) {
      selectedPerson = allPersons[idx];
      document.querySelectorAll('.person-card').forEach((c, i) => {
        c.style.borderColor = i === idx ? 'var(--gold-primary)' : 'rgba(255,215,0,0.2)';
        c.style.background = i === idx ? 'rgba(255,215,0,0.1)' : 'var(--black-royal)';
      });
      document.getElementById('paymentFormContainer').style.display = 'block';
      document.getElementById('infoPersonName').textContent = selectedPerson.name;
      document.getElementById('infoPersonPhone').textContent = selectedPerson.phone || '—';
      document.getElementById('infoTotalBill').textContent = formatPKR(selectedPerson.totalBill);
      document.getElementById('infoTotalPaid').textContent = formatPKR(selectedPerson.totalPaid);
      document.getElementById('infoBalance').textContent = formatPKR(Math.abs(selectedPerson.balance));
      document.getElementById('pAmount').value = Math.round(Math.abs(selectedPerson.balance));
      document.getElementById('pPayType').value = selectedPerson.balance > 0 ? 'due' : 'advance';
      document.getElementById('paymentFormContainer').scrollIntoView({ behavior: 'smooth' });
    }

    async function savePayment(sendWA) {
      if (!selectedPerson) { alert('❌ Select person'); return; }
      const amount = parseFloat(document.getElementById('pAmount').value) || 0;
      const payDate = document.getElementById('pDate').value;
      if (amount <= 0) { alert('❌ Valid amount'); return; }
      if (!payDate) { alert('❌ Date'); return; }
      const btn = document.getElementById('savePayBtn');
      btn.textContent = '⏳ Saving...'; btn.disabled = true;
      try {
        const payment = {
          receipt_number: 'RCV-' + Date.now(),
          person_type: selectedPerson.type,
          person_name: selectedPerson.name,
          person_phone: selectedPerson.phone,
          amount: amount,
          payment_type: document.getElementById('pPayType').value,
          payment_mode: document.getElementById('pMode').value,
          notes: document.getElementById('pNotes').value.trim(),
          payment_date: payDate
        };
        const saved = await addRecord('payments', payment);
        currentReceipt = saved;
        if (sendWA) {
          const action = selectedPerson.type === 'customer' ? 'Received from' : 'Paid to';
          openWhatsApp(selectedPerson.phone, `*PAYMENT RECEIPT*\nReceipt #: ${payment.receipt_number}\n${action}: ${selectedPerson.name}\nAmount: ${formatPKR(amount)}\nDate: ${formatDate(payment.payment_date)}\nMode: ${payment.payment_mode.toUpperCase()}`);
        }
        showReceipt(saved);
        document.getElementById('pAmount').value = '';
        document.getElementById('pNotes').value = '';
        document.getElementById('paymentFormContainer').style.display = 'none';
        selectedPerson = null;
        await loadPersonsWithBalance();
        loadPayments();
      } catch (e) { alert('❌ ' + e.message); }
      finally { btn.textContent = sendWA ? '📱 Save & WhatsApp' : '💾 Save & Receipt'; btn.disabled = false; }
    }

    async function showReceipt(p) {
      const shop = await getShopSettings();
      const action = p.person_type === 'customer' ? 'RECEIVED FROM' : 'PAID TO';
      document.getElementById('printableReceipt').innerHTML = `
        <div style="text-align:center; border-bottom:2px solid #D4AF37; padding-bottom:15px; margin-bottom:20px;">
          <h1 style="font-family:'Playfair Display',serif; color:#D4AF37; margin:0; font-size:24px;">${shop.name}</h1>
          <p style="margin:5px 0; font-size:14px; color:#D4AF37; font-family:'Noto Nastaliq Urdu',serif;" dir="rtl">${shop.name_urdu || 'فیض حسینی'}</p>
          <p style="margin:5px 0; font-size:12px; color:#666;">${shop.address}</p>
        </div>
        <h2 style="text-align:center; color:#1A1A1A; font-family:'Playfair Display',serif;">PAYMENT RECEIPT</h2>
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-size:14px;">
          <div><p><strong>Receipt #:</strong> ${p.receipt_number}</p><p><strong>Date:</strong> ${formatDate(p.payment_date)}</p></div>
          <div style="text-align:right;"><p><strong>Mode:</strong> ${(p.payment_mode||'').toUpperCase()}</p><p><strong>Type:</strong> ${(p.payment_type||'').toUpperCase()}</p></div>
        </div>
        <div style="background:#FAF7F0; padding:15px; border-radius:8px; margin-bottom:20px;">
          <p style="margin:5px 0; font-size:12px; color:#888;">${action}</p>
          <h3 style="margin:5px 0; color:#D4AF37;">${p.person_name}</h3>
        </div>
        <div style="text-align:center; border-top:2px solid #D4AF37; border-bottom:2px solid #D4AF37; padding:20px 0; margin-bottom:20px;">
          <p style="margin:0; font-size:12px; color:#888;">AMOUNT</p>
          <h2 style="margin:5px 0; color:#D4AF37; font-family:'Playfair Display',serif; font-size:36px;">${formatPKR(p.amount)}</h2>
        </div>
      `;
      document.getElementById('receiptModal').classList.add('active');
    }

    function sendReceiptWhatsApp() {
      if (!currentReceipt) return;
      const action = currentReceipt.person_type === 'customer' ? 'Received from' : 'Paid to';
      openWhatsApp(currentReceipt.person_phone, `*PAYMENT RECEIPT*\nReceipt #: ${currentReceipt.receipt_number}\n${action}: ${currentReceipt.person_name}\nAmount: ${formatPKR(currentReceipt.amount)}`);
    }

    async function loadPayments() {
      const payments = await getRecordsFast('payments', true);
      const container = document.getElementById('paymentsList');
      if (payments.length === 0) { container.innerHTML = '<div class="empty-state"><p>No payments yet</p></div>'; return; }
      container.innerHTML = payments.slice(0, 20).map(p => {
        const isReceive = p.person_type === 'customer';
        const color = isReceive ? '#86EFAC' : '#FCA5A5';
        const sign = isReceive ? '+' : '-';
        return `
          <div class="data-item">
            <div style="cursor:pointer; flex:1;" onclick='showReceipt(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
              <div class="data-item-title">${p.person_name} <span style="font-size:0.7rem; color:#888;">(${p.person_type})</span></div>
              <div class="data-item-sub">${p.receipt_number} • ${formatDate(p.payment_date)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="data-item-value" style="color:${color};">${sign} ${formatPKR(p.amount)}</div>
              ${deleteButtonHTML('deletePayment', p.id)}
            </div>
          </div>
        `;
      }).join('');
    }

    async function deletePayment(id) {
      if (!confirmDelete('this payment')) return;
      try { await deleteRecord('payments', id); alert('✅ Deleted'); loadPayments(); await loadPersonsWithBalance(); }
      catch (e) { alert('❌ ' + e.message); }
    }
  </script>
</body>
</html>
