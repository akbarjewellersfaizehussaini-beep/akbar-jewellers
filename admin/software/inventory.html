<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
  <style>
    .inventory-card { background: linear-gradient(135deg, var(--black-soft), #252525); border: 1px solid rgba(255,215,0,0.2); border-radius: 14px; padding: 20px; margin-bottom: 15px; cursor: pointer; transition: all 0.3s; }
    .inventory-card:hover { border-color: var(--gold-primary); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255,215,0,0.2); }
    .inventory-card.selected { border-color: var(--gold-primary); background: rgba(255,215,0,0.05); }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Add Inventory
    </div>
    <button onclick="navigateFresh('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Add Inventory Stock</h1>
    <p class="page-subtitle">Sirf existing products select kar sakte hain</p>

    <div class="form-card">
      <h3 class="form-card-title">📦 Select Product (Primary Key)</h3>
      
      <div class="form-group">
        <label class="form-label">Search Product</label>
        <input type="text" id="searchProduct" class="form-input" placeholder="🔍 Search by name or code..." oninput="filterProducts()">
      </div>

      <div id="productsList" style="max-height: 400px; overflow-y: auto;">
        <div class="empty-state"><p>Loading products...</p></div>
      </div>
    </div>

    <div id="addStockForm" style="display: none;">
      <div class="form-card">
        <h3 class="form-card-title">➕ Add Stock to: <span id="selectedProductName" style="color: var(--gold-primary);"></span></h3>
        
        <div style="background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3); border-radius: 12px; padding: 15px; margin-bottom: 20px;">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; text-align: center;">
            <div>
              <div style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase;">Product ID</div>
              <div style="color: #93C5FD; font-weight: 700; font-family: var(--font-mono); font-size: 1rem;" id="infoProductCode">—</div>
            </div>
            <div>
              <div style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase;">Current Stock</div>
              <div style="color: #86EFAC; font-weight: 700; font-family: var(--font-mono); font-size: 1rem;" id="infoCurrentStock">0</div>
            </div>
            <div>
              <div style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase;">Weight/Unit</div>
              <div style="color: var(--gold-primary); font-weight: 700; font-family: var(--font-mono); font-size: 1rem;" id="infoWeight">0g</div>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Quantity to Add <span class="required">*</span></label>
            <input type="number" id="addQty" class="form-input number-input" placeholder="0" min="1">
          </div>
          <div class="form-group">
            <label class="form-label">Purchase Rate/gram (Rs) — Optional</label>
            <input type="number" id="addRate" class="form-input number-input" placeholder="0">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Supplier Name</label>
            <input type="text" id="addSupplier" class="form-input" placeholder="Supplier">
          </div>
          <div class="form-group">
            <label class="form-label">Invoice/Bill No (Optional)</label>
            <input type="text" id="addInvoiceNo" class="form-input" placeholder="Bill number">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea id="addNotes" class="form-input" rows="2" placeholder="Any details..."></textarea>
        </div>

        <button class="btn-primary" onclick="saveStock()" id="saveStockBtn" style="width: 100%;">
          💾 Add to Stock
        </button>
      </div>
    </div>

    <h2 class="section-title">📋 Recent Stock Additions</h2>
    <div class="data-list" id="recentAdditions"></div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let allProducts = [];
    let selectedProduct = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'purchase'])) return;
      if (typeof clearCache === 'function') clearCache();
      await loadProductsList();
      loadRecentAdditions();
    });

    async function loadProductsList() {
      allProducts = await getRecordsFast('products', true);
      renderProductsList(allProducts);
    }

    function renderProductsList(products) {
      const container = document.getElementById('productsList');
      if (!products || products.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📦</div><p>No products yet. Pehle products add karein.</p></div>';
        return;
      }

      container.innerHTML = products.map(p => `
        <div class="inventory-card" data-name="${(p.name || '').toLowerCase()}" data-code="${(p.product_code || '').toLowerCase()}" onclick='selectProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
              <div style="color: var(--gold-primary); font-weight: 700; font-size: 1rem;">${p.name}</div>
              <div style="color: #93C5FD; font-size: 0.75rem; font-family: var(--font-mono);">${p.product_code}</div>
              <div style="color: var(--text-muted); font-size: 0.8rem;">${(p.category || '').toUpperCase()} ${p.karat ? '• ' + p.karat : ''} • ${formatWeight(p.weight)}</div>
            </div>
            <div style="text-align: right;">
              <div style="color: ${(p.current_stock || 0) > 0 ? '#86EFAC' : '#FCA5A5'}; font-weight: 700; font-size: 1.1rem;">${p.current_stock || 0} units</div>
              <div style="color: var(--text-muted); font-size: 0.75rem;">Current Stock</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterProducts() {
      const search = document.getElementById('searchProduct').value.toLowerCase();
      const cards = document.querySelectorAll('.inventory-card');
      cards.forEach(card => {
        const name = card.getAttribute('data-name');
        const code = card.getAttribute('data-code');
        card.style.display = (name.includes(search) || code.includes(search)) ? 'block' : 'none';
      });
    }

    function selectProduct(p) {
      selectedProduct = p;
      document.querySelectorAll('.inventory-card').forEach(c => c.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
      
      document.getElementById('addStockForm').style.display = 'block';
      document.getElementById('selectedProductName').textContent = p.name;
      document.getElementById('infoProductCode').textContent = p.product_code;
      document.getElementById('infoCurrentStock').textContent = (p.current_stock || 0) + ' units';
      document.getElementById('infoWeight').textContent = formatWeight(p.weight);
      document.getElementById('addQty').value = '';
      document.getElementById('addRate').value = '';
      document.getElementById('addSupplier').value = '';
      document.getElementById('addInvoiceNo').value = '';
      document.getElementById('addNotes').value = '';
      
      document.getElementById('addStockForm').scrollIntoView({ behavior: 'smooth' });
    }

    async function saveStock() {
      if (!selectedProduct) { alert('❌ Product select karein'); return; }
      
      const qty = parseInt(document.getElementById('addQty').value) || 0;
      if (qty <= 0) { alert('❌ Valid quantity enter karein'); return; }

      const btn = document.getElementById('saveStockBtn');
      btn.textContent = '⏳ Saving...'; btn.disabled = true;

      try {
        const newStock = (Number(selectedProduct.current_stock) || 0) + qty;
        
        // Update product stock
        await updateRecord('products', selectedProduct.id, { current_stock: newStock });
        
        // Also add to purchases table for tracking
        const rate = parseFloat(document.getElementById('addRate').value) || 0;
        const purchaseData = {
          invoice_no: 'INV-' + Date.now(),
          product_id: selectedProduct.product_code,
          supplier_name: document.getElementById('addSupplier').value.trim() || 'Stock Addition',
          supplier_phone: '',
          item: selectedProduct.name,
          qty: qty,
          weight: selectedProduct.weight || 0,
          total_weight: qty * (selectedProduct.weight || 0),
          gold_weight: qty * (selectedProduct.weight || 0),
          gold_karat: selectedProduct.karat || '24K',
          gold_rate: rate,
          rate: rate,
          total: rate * qty * (selectedProduct.weight || 0),
          paid: 0,
          balance: rate * qty * (selectedProduct.weight || 0),
          payment_mode: 'credit',
          purchase_date: new Date().toISOString().slice(0, 10)
        };
        
        if (rate > 0) {
          await addRecord('purchases', purchaseData);
        }
        
        alert('✅ Stock added! ' + qty + ' units added to ' + selectedProduct.name + '\n\nNew Stock: ' + newStock + ' units');
        
        selectedProduct = null;
        document.getElementById('addStockForm').style.display = 'none';
        
        await loadProductsList();
        loadRecentAdditions();
      } catch (e) {
        alert('❌ Error: ' + e.message);
      } finally {
        btn.textContent = '💾 Add to Stock'; btn.disabled = false;
      }
    }

    async function loadRecentAdditions() {
      const purchases = await getRecordsFast('purchases', true);
      const recent = purchases.slice(0, 10);
      const container = document.getElementById('recentAdditions');
      
      if (recent.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No stock additions yet</p></div>';
        return;
      }

      container.innerHTML = recent.map(p => `
        <div class="data-item">
          <div>
            <div class="data-item-title">${p.item} <span style="color: var(--gold-primary); font-size: 0.8rem;">(Qty: ${p.qty || 1})</span></div>
            <div class="data-item-sub">${p.supplier_name} • ${formatDate(p.purchase_date || p.created_at)}</div>
          </div>
          <div class="data-item-value">${formatPKR(p.total)}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
