<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">Suppliers</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Supplier Management</h1>

    <div class="form-card">
      <h3 class="form-card-title">Add New Supplier</h3>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Name *</label><input type="text" id="sName" class="form-input" placeholder="Supplier Name"></div>
        <div class="form-group"><label class="form-label">Phone *</label><input type="tel" id="sPhone" class="form-input" placeholder="03XXXXXXXXX"></div>
      </div>
      <div class="form-group"><label class="form-label">Address</label><input type="text" id="sAddress" class="form-input" placeholder="Address"></div>
      <div class="form-group">
        <label class="form-label">Supplier Photo</label>
        <input type="file" id="sPhoto" class="form-input" accept="image/*" style="padding:10px;">
        <div id="sPhotoPreview" style="margin-top:10px;"></div>
      </div>
      <button class="btn-primary" onclick="saveSupplier()" style="width:100%;">Save Supplier</button>
    </div>

    <h2 class="section-title">All Suppliers (Click name for Khata)</h2>
    <div class="data-list" id="suppliersList"></div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'purchase'])) return;
      loadSuppliers();
    });

    document.getElementById('sPhoto')?.addEventListener('change', (e) => {
      if (e.target.files[0]) document.getElementById('sPhotoPreview').innerHTML = `<img src="${URL.createObjectURL(e.target.files[0])}" style="max-width:100px; border-radius:8px; border:2px solid #FFD700;">`;
    });

    async function saveSupplier() {
      const name = document.getElementById('sName').value.trim();
      const phone = document.getElementById('sPhone').value.trim();
      if (!name || !phone) { alert('❌ Name and phone required'); return; }

      const btn = event.target;
      btn.textContent = 'Saving...'; btn.disabled = true;

      try {
        let photoUrl = null;
        if (document.getElementById('sPhoto').files[0]) {
          photoUrl = await uploadImage(document.getElementById('sPhoto').files[0]);
        }
        await addRecord('suppliers', {
          name, phone,
          address: document.getElementById('sAddress').value.trim(),
          photo: photoUrl
        });
        alert('✅ Supplier saved!');
        clearForm(); loadSuppliers();
      } catch (e) { alert('❌ ' + e.message); }
      finally { btn.textContent = 'Save Supplier'; btn.disabled = false; }
    }

    function clearForm() {
      ['sName','sPhone','sAddress'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('sPhoto').value = '';
      document.getElementById('sPhotoPreview').innerHTML = '';
    }

    async function loadSuppliers() {
      const suppliers = await getRecordsFast('suppliers');
      const purchases = await getRecordsFast('purchases');
      const payments = await getRecordsFast('payments');
      const container = document.getElementById('suppliersList');
      
      if (suppliers.length === 0) { container.innerHTML = '<div class="empty-state"><p>No suppliers yet</p></div>'; return; }
      
      container.innerHTML = suppliers.map(s => {
        const sPurch = purchases.filter(p => p.supplier_name === s.name);
        const sPays = payments.filter(p => p.person_name === s.name && p.person_type === 'supplier');
        
        let totalBill = sPurch.reduce((sum, p) => sum + (Number(p.total)||0), 0);
        let totalPaid = sPays.reduce((sum, p) => sum + (Number(p.amount)||0), 0);
        let balance = totalBill - totalPaid;
        
        let balHtml = '';
        if (balance > 0) balHtml = `<span style="color:#FCA5A5;">Payable: ${formatPKR(balance)}</span>`;
        else if (balance < 0) balHtml = `<span style="color:#86EFAC;">Advance: ${formatPKR(Math.abs(balance))}</span>`;
        else balHtml = `<span style="color:#B8B8B8;">Clear</span>`;

        return `
        <div class="data-item" style="cursor:pointer;" onclick="openLedger('supplier','${s.name}')">
          <div style="display:flex; gap:15px; align-items:center;">
            ${s.photo ? `<img src="${s.photo}" style="width:50px; height:50px; border-radius:50%; border:2px solid #FFD700; object-fit:cover;">` : '<div style="width:50px; height:50px; border-radius:50%; background:#2A2A2A; display:flex; align-items:center; justify-content:center;">📦</div>'}
            <div>
              <div class="data-item-title">${s.name}</div>
              <div class="data-item-sub">📞 ${s.phone}</div>
              ${s.address ? `<div class="data-item-sub">📍 ${s.address}</div>` : ''}
            </div>
          </div>
          <div style="text-align:right;">
            <div class="data-item-value" style="font-size:0.95rem;">${balHtml}</div>
            <div class="data-item-sub" style="font-size:0.7rem;">Click for Khata</div>
          </div>
        </div>
        `;
      }).join('');
    }

    function openLedger(type, name) {
      window.location.href = `ledger.html?type=${type}&name=${encodeURIComponent(name)}`;
    }
  </script>
</body>
</html>
