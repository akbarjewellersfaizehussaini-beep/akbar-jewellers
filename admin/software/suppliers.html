<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Gold Suppliers
    </div>
    <button onclick="navigate('index.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Gold Supplier Management</h1>
    <p class="page-subtitle">Sona kharida, paisa diya, baqi</p>

    <div class="form-card">
      <h3 class="form-card-title">➕ Add New Gold Supplier</h3>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Supplier Name <span class="required">*</span></label>
          <input type="text" id="sName" class="form-input" placeholder="Supplier ka naam">
        </div>
        <div class="form-group">
          <label class="form-label">Phone <span class="required">*</span></label>
          <input type="tel" id="sPhone" class="form-input" placeholder="03XXXXXXXXX">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">CNIC</label>
          <input type="text" id="sCNIC" class="form-input" placeholder="XXXXX-XXXXXXX-X">
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" id="sAddress" class="form-input" placeholder="Address">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Opening Cash (Rs)</label>
          <input type="number" id="sOpeningCash" class="form-input number-input" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Opening Gold (gram)</label>
          <input type="number" id="sOpeningGold" class="form-input number-input" placeholder="0.000" step="0.001">
        </div>
      </div>

      <button class="btn-primary" onclick="saveSupplier()" id="saveSupplierBtn" style="width:100%;">
        💾 Save Supplier
      </button>
    </div>

    <h2 class="section-title">📋 All Suppliers</h2>
    <div class="data-list" id="suppliersList">
      <div class="empty-state"><p>Loading...</p></div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'purchase'])) return;
      loadSuppliers();
    });

    async function saveSupplier() {
      const name = document.getElementById('sName').value.trim();
      const phone = document.getElementById('sPhone').value.trim();
      
      if (!name || !phone) { alert('❌ Name and phone required'); return; }

      const btn = document.getElementById('saveSupplierBtn');
      btn.textContent = '⏳ Saving...'; btn.disabled = true;

      try {
        await addRecord('suppliers', {
          name,
          phone,
          cnic: document.getElementById('sCNIC').value.trim(),
          address: document.getElementById('sAddress').value.trim(),
          opening_cash: parseFloat(document.getElementById('sOpeningCash').value) || 0,
          opening_gold: parseFloat(document.getElementById('sOpeningGold').value) || 0
        });
        
        alert('✅ Supplier saved!');
        clearForm();
        loadSuppliers();
      } catch (e) {
        alert('❌ Error: ' + e.message);
      } finally {
        btn.textContent = '💾 Save Supplier'; btn.disabled = false;
      }
    }

    function clearForm() {
      ['sName','sPhone','sCNIC','sAddress','sOpeningCash','sOpeningGold'].forEach(id => document.getElementById(id).value = '');
    }

    async function loadSuppliers() {
      const suppliers = await getRecordsFast('suppliers');
      const purchases = await getRecordsFast('purchases');
      const payments = await getRecordsFast('payments');
      const container = document.getElementById('suppliersList');
      
      if (!suppliers || suppliers.length === 0) { 
        container.innerHTML = '<div class="empty-state"><div class="icon">🏭</div><p>No suppliers yet</p></div>'; 
        return; 
      }
      
      container.innerHTML = suppliers.map(s => {
        const sPurch = purchases.filter(p => p.supplier_name === s.name);
        const sPays = payments.filter(p => p.person_name === s.name && p.person_type === 'supplier');
        let totalBill = Number(s.opening_cash) || 0;
        let totalPaid = 0;
        sPurch.forEach(p => totalBill += Number(p.total) || 0);
        sPays.forEach(p => totalPaid += Number(p.amount) || 0);
        const balance = totalBill - totalPaid;
        
        return `
          <div class="data-item">
            <div style="cursor:pointer; flex:1;" onclick="window.location.href='supplier-ledger.html?name=${encodeURIComponent(s.name)}'">
              <div class="data-item-title">${s.name}</div>
              <div class="data-item-sub">📞 ${s.phone} ${s.cnic ? '• CNIC: ' + s.cnic : ''}</div>
              <div class="data-item-sub">📦 ${sPurch.length} purchases • ${sPays.length} payments</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <div style="text-align:right;">
                <div style="color:${balance > 0 ? 'var(--danger)' : 'var(--success)'}; font-weight:700; font-size:1rem;">
                  ${formatPKR(Math.abs(balance))} ${balance > 0 ? 'Payable' : 'Advance'}
                </div>
              </div>
              ${deleteButtonHTML('deleteSupplier', s.id)}
            </div>
          </div>
        `;
      }).join('');
    }

    async function deleteSupplier(id) {
      if (!confirmDelete('this supplier')) return;
      try {
        await deleteRecord('suppliers', id);
        alert('✅ Supplier deleted');
        loadSuppliers();
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }
  </script>
</body>
</html>
