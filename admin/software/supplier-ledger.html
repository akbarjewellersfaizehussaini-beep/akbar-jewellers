<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Ledger – Akbar Jewellers Software</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="stylesheet" href="style-software.css">
  <style>
    .ledger-header { background: linear-gradient(135deg, var(--black-soft), #252525); border: 2px solid var(--gold-primary); border-radius: 16px; padding: 25px; margin-bottom: 25px; }
    .ledger-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
    .ledger-box { background: var(--black-royal); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid rgba(255,215,0,0.2); }
    .ledger-box .label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
    .ledger-box .value { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; margin-top: 5px; }
    .txn-table { width: 100%; border-collapse: collapse; background: var(--black-soft); border-radius: 12px; overflow: hidden; }
    .txn-table th { background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05)); color: var(--gold-primary); padding: 12px 10px; text-align: left; font-size: 0.75rem; text-transform: uppercase; }
    .txn-table td { padding: 12px 10px; border-bottom: 1px solid rgba(255,215,0,0.08); font-size: 0.85rem; }
    .txn-table td.number { font-family: var(--font-mono); text-align: right; }
    .bill-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--gold-primary); cursor: pointer; }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">
      <img src="../../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      Supplier Ledger
    </div>
    <button onclick="navigate('suppliers.html')" style="background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-content">
    <div id="ledgerContent">
      <p style="text-align:center; padding:50px; color:var(--gold-primary);">Loading...</p>
    </div>
  </div>

  <div id="invoiceModal" class="modal">
    <div class="modal-content" style="max-width: 800px; background:#fff; color:#1A1A1A; padding: 40px;">
      <div id="printableLedger"></div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-primary" onclick="printElement('printableLedger')" style="flex:1;">🖨 Print</button>
        <button class="btn-success" onclick="sendLedgerWhatsApp()" style="flex:1;">📱 WhatsApp</button>
        <button class="btn-secondary" onclick="sendLedgerEmail()" style="flex:1; background:#3B82F6; color:white; border:none;">📧 Email</button>
        <button class="btn-danger" onclick="document.getElementById('invoiceModal').classList.remove('active')" style="flex:1;">Close</button>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let currentSupplier = null;
    let allTransactions = [];
    let shopInfo = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuth(['admin', 'purchase'])) return;
      
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name');
      
      if (!name) {
        alert('No supplier selected');
        window.location.href = 'suppliers.html';
        return;
      }
      
      shopInfo = await getShopSettings();
      await loadLedger(name);
    });

    async function loadLedger(name) {
      const suppliers = await getRecordsFast('suppliers');
      const purchases = await getRecordsFast('purchases');
      
      currentSupplier = suppliers.find(s => s.name === name);
      if (!currentSupplier) {
        document.getElementById('ledgerContent').innerHTML = '<p style="text-align:center; padding:50px; color:var(--danger);">Supplier not found</p>';
        return;
      }

      const sPurchases = purchases.filter(p => p.supplier_name === name);
      
      allTransactions = sPurchases.map(p => ({
        id: p.id,
        date: p.purchase_date || p.created_at,
        desc: p.item || 'Gold Purchase',
        gold_weight: Number(p.gold_weight) || Number(p.weight) || 0,
        gold_karat: p.gold_karat,
        gold_rate: Number(p.gold_rate) || Number(p.rate) || 0,
        total: Number(p.total) || 0,
        paid: Number(p.paid) || 0,
        balance: Number(p.balance) || 0,
        bill_image: p.bill_image,
        payment_mode: p.payment_mode,
        invoice_no: p.invoice_no
      }));

      allTransactions.sort((a, b) => new Date(a.date) - new Date(b.date));

      let openingGold = Number(currentSupplier.opening_gold) || 0;
      let totalGoldPurchased = openingGold;
      let totalCashBill = Number(currentSupplier.opening_cash) || 0;
      let totalCashPaid = 0;

      allTransactions.forEach(t => {
        totalGoldPurchased += t.gold_weight;
        totalCashBill += t.total;
        totalCashPaid += t.paid;
      });

      const cashBalance = totalCashBill - totalCashPaid;

      document.getElementById('ledgerContent').innerHTML = `
        <div class="ledger-header">
          <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
            ${currentSupplier.photo ? `<img src="${currentSupplier.photo}" style="width:80px; height:80px; border-radius:50%; border:3px solid var(--gold-primary); object-fit:cover;">` : '<div style="width:80px; height:80px; border-radius:50%; background:var(--charcoal); display:flex; align-items:center; justify-content:center; font-size:2rem;">🏭</div>'}
            <div>
              <h1 style="font-family:var(--font-heading); color:var(--gold-primary); font-size:1.8rem; margin-bottom:5px;">${currentSupplier.name}</h1>
              <p style="color:var(--text-muted);">📞 ${currentSupplier.phone} ${currentSupplier.cnic ? '• CNIC: ' + currentSupplier.cnic : ''}</p>
            </div>
          </div>
          
          <div class="ledger-summary">
            <div class="ledger-box">
              <div class="label">Opening Gold</div>
              <div class="value" style="color:#93C5FD;">${formatWeight(openingGold)}</div>
            </div>
            <div class="ledger-box">
              <div class="label">Total Gold Purchased</div>
              <div class="value" style="color:#FCD34D;">${formatWeight(totalGoldPurchased)}</div>
            </div>
            <div class="ledger-box">
              <div class="label">Total Bill</div>
              <div class="value" style="color:#93C5FD;">${formatPKR(totalCashBill)}</div>
            </div>
            <div class="ledger-box">
              <div class="label">Total Paid</div>
              <div class="value" style="color:#86EFAC;">${formatPKR(totalCashPaid)}</div>
            </div>
            <div class="ledger-box">
              <div class="label">Cash Balance</div>
              <div class="value" style="color:${cashBalance > 0 ? 'var(--danger)' : 'var(--success)'};">${formatPKR(Math.abs(cashBalance))}</div>
            </div>
          </div>

          <div style="display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;">
            <button class="btn-primary" onclick="showLedgerPrint()" style="flex:1;">🖨 Print Ledger</button>
            <button class="btn-success" onclick="showLedgerPrint(); setTimeout(() => sendLedgerWhatsApp(), 500);" style="flex:1;">📱 WhatsApp</button>
            <button class="btn-secondary" onclick="showLedgerPrint(); setTimeout(() => sendLedgerEmail(), 500);" style="flex:1; background:#3B82F6; color:white; border:none;">📧 Email</button>
          </div>
        </div>

        <div class="form-card">
          <h3 class="form-card-title">➕ New Gold Purchase Entry</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Item/Description <span class="required">*</span></label>
              <input type="text" id="pItem" class="form-input" placeholder="e.g., Gold Biscuit / Gold Bar">
            </div>
            <div class="form-group">
              <label class="form-label">Purchase Date</label>
              <input type="date" id="pDate" class="form-input">
            </div>
          </div>

          <h4 style="color:var(--gold-primary); margin:20px 0 10px; font-family:var(--font-heading);">🪙 Gold Details</h4>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Weight <span class="required">*</span></label>
              <div style="display:grid; grid-template-columns: 2fr 1fr; gap:8px;">
                <input type="number" id="pGoldWeight" class="form-input number-input" placeholder="0.000" step="0.001">
                <select id="pGoldUnit" class="form-select">
                  <option value="gram">Gram</option>
                  <option value="tola">Tola</option>
                  <option value="masha">Masha</option>
                  <option value="ratti">Ratti</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Karat</label>
              <select id="pGoldKarat" class="form-select">
                <option value="24K">24K</option>
                <option value="22K">22K</option>
                <option value="21K">21K</option>
                <option value="18K">18K</option>
                <option value="16K">16K</option>
                <option value="14K">14K</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Rate/gram (Rs) <span class="required">*</span></label>
              <input type="number" id="pGoldRate" class="form-input number-input" placeholder="0">
            </div>
            <div class="form-group">
              <label class="form-label">Total Bill (Rs) — Auto</label>
              <input type="number" id="pTotalBill" class="form-input number-input" readonly style="background:var(--charcoal); color:var(--gold-primary);">
            </div>
          </div>

          <h4 style="color:var(--gold-primary); margin:20px 0 10px; font-family:var(--font-heading);">💰 Payment</h4>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Paid (Rs)</label>
              <input type="number" id="pPaid" class="form-input number-input" placeholder="0">
            </div>
            <div class="form-group">
              <label class="form-label">Balance (Rs) — Auto</label>
              <input type="number" id="pBalance" class="form-input number-input" readonly style="background:var(--charcoal); color:#FCD34D; font-weight:700;">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Payment Mode</label>
              <select id="pPaymentMode" class="form-select">
                <option value="cash">Cash</option>
                <option value="bank">Bank Transfer</option>
                <option value="easypaisa">Easypaisa</option>
                <option value="jazzcash">JazzCash</option>
                <option value="credit">Credit (Udhaar)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Bill Photo (Supplier ka bill)</label>
            <input type="file" id="pBillImage" class="form-input" accept="image/*" style="padding:10px;">
            <div id="pBillPreview" style="margin-top:10px;"></div>
          </div>

          <button class="btn-primary" onclick="savePurchase()" id="savePurchaseBtn" style="width:100%;">
            💾 Save Purchase Entry
          </button>
        </div>

        <h2 class="section-title">📒 Purchase History</h2>
        <div style="overflow-x:auto;">
          <table class="txn-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Item</th>
                <th>Gold Weight</th>
                <th>Karat</th>
                <th>Rate/g</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Balance</th>
                <th>Bill</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${allTransactions.length === 0 ? '<tr><td colspan="10" style="text-align:center; padding:30px; color:var(--text-muted);">No purchases yet</td></tr>' :
                allTransactions.map((t, idx) => `
                  <tr>
                    <td>${formatDate(t.date)}</td>
                    <td><strong style="color:var(--gold-primary);">${t.desc}</strong><br><span style="font-size:0.7rem; color:var(--text-muted);">${t.invoice_no || ''}</span></td>
                    <td class="number" style="color:#FCD34D;">${formatWeight(t.gold_weight)}</td>
                    <td>${t.gold_karat || '—'}</td>
                    <td class="number">${t.gold_rate > 0 ? formatPKR(t.gold_rate) : '—'}</td>
                    <td class="number">${formatPKR(t.total)}</td>
                    <td class="number" style="color:#86EFAC;">${formatPKR(t.paid)}</td>
                    <td class="number" style="color:${t.balance > 0 ? 'var(--danger)' : 'var(--success)'};">${formatPKR(t.balance)}</td>
                    <td>${t.bill_image ? `<img src="${t.bill_image}" class="bill-thumb" onclick="window.open('${t.bill_image}', '_blank')">` : '—'}</td>
                    <td><button class="btn-danger" style="padding:4px 10px; font-size:0.75rem;" onclick="deletePurchase('${t.id}')">🗑️</button></td>
                  </tr>
                `).join('')}
            </tbody>
          </table>
        </div>
      `;

      // Auto calculate on input
      ['pGoldWeight','pGoldRate','pPaid'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', autoCalcPurchase);
      });
      document.getElementById('pGoldUnit')?.addEventListener('change', autoCalcPurchase);

      document.getElementById('pDate').value = new Date().toISOString().slice(0, 10);
    }

    function autoCalcPurchase() {
      const weight = parseFloat(document.getElementById('pGoldWeight').value) || 0;
      const unit = document.getElementById('pGoldUnit').value;
      const rate = parseFloat(document.getElementById('pGoldRate').value) || 0;
      const weightInGrams = toGrams(weight, unit);
      const total = Math.round(weightInGrams * rate);
      document.getElementById('pTotalBill').value = total;
      
      const paid = parseFloat(document.getElementById('pPaid').value) || 0;
      document.getElementById('pBalance').value = Math.max(0, total - paid);
    }

    let uploadedBillUrl = '';
    document.addEventListener('change', (e) => {
      if (e.target.id === 'pBillImage' && e.target.files[0]) {
        const file = e.target.files[0];
        document.getElementById('pBillPreview').innerHTML = `<img src="${URL.createObjectURL(file)}" style="max-width:100px; border-radius:8px; border:2px solid var(--gold-primary);">`;
        uploadImage(file).then(url => { uploadedBillUrl = url; }).catch(err => alert('Bill upload failed: ' + err.message));
      }
    });

    async function savePurchase() {
      const item = document.getElementById('pItem').value.trim();
      const weight = parseFloat(document.getElementById('pGoldWeight').value) || 0;
      const rate = parseFloat(document.getElementById('pGoldRate').value) || 0;
      
      if (!item || weight <= 0 || rate <= 0) { alert('❌ Item, weight, and rate required'); return; }

      const btn = document.getElementById('savePurchaseBtn');
      btn.textContent = '⏳ Saving...'; 
      btn.disabled = true;

      try {
        const unit = document.getElementById('pGoldUnit').value;
        const weightInGrams = toGrams(weight, unit);
        const total = parseFloat(document.getElementById('pTotalBill').value) || 0;
        const paid = parseFloat(document.getElementById('pPaid').value) || 0;

        await addRecord('purchases', {
          invoice_no: 'PUR-' + Date.now(),
          supplier_name: currentSupplier.name,
          supplier_phone: currentSupplier.phone,
          item: item,
          gold_weight: weightInGrams,
          weight: weightInGrams,
          gold_karat: document.getElementById('pGoldKarat').value,
          gold_rate: rate,
          rate: rate,
          total: total,
          paid: paid,
          balance: total - paid,
          payment_mode: document.getElementById('pPaymentMode').value,
          bill_image: uploadedBillUrl,
          purchase_date: document.getElementById('pDate').value
        });

        alert('✅ Purchase saved!');
        uploadedBillUrl = '';
        location.reload();
      } catch (e) {
        alert('❌ Error: ' + e.message);
      } finally {
        btn.textContent = '💾 Save Purchase Entry';
        btn.disabled = false;
      }
    }

    async function deletePurchase(id) {
      if (!confirm('Delete this purchase?')) return;
      try {
        await deleteRecord('purchases', id);
        alert('✅ Deleted');
        location.reload();
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }

    function showLedgerPrint() {
      let totalGoldPurchased = Number(currentSupplier.opening_gold) || 0;
      let totalCashBill = Number(currentSupplier.opening_cash) || 0;
      let totalCashPaid = 0;

      allTransactions.forEach(t => {
        totalGoldPurchased += t.gold_weight;
        totalCashBill += t.total;
        totalCashPaid += t.paid;
      });

      const cashBalance = totalCashBill - totalCashPaid;

      document.getElementById('printableLedger').innerHTML = `
        <div style="text-align:center; border-bottom:2px solid #D4AF37; padding-bottom:15px; margin-bottom:20px;">
          <h1 style="font-family:'Playfair Display',serif; color:#D4AF37; margin:0; font-size:28px;">${shopInfo.name}</h1>
          <p style="margin:5px 0; font-size:14px; color:#D4AF37; font-family:'Noto Nastaliq Urdu',serif;" dir="rtl">${shopInfo.name_urdu || 'فیض حسینی'}</p>
          <p style="margin:5px 0; font-size:12px; color:#666;">${shopInfo.address}</p>
          <p style="margin:5px 0; font-size:12px; color:#666;">Phone: ${shopInfo.phone}</p>
        </div>
        <h2 style="text-align:center; color:#1A1A1A; font-family:'Playfair Display',serif; margin-bottom:10px;">GOLD SUPPLIER LEDGER</h2>
        <p style="text-align:center; color:#666; margin-bottom:20px;">${currentSupplier.name} | ${currentSupplier.phone}</p>
        
        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;">
          <div style="background:#FAF7F0; padding:10px; border-radius:6px; text-align:center;">
            <div style="font-size:10px; color:#666;">Total Gold Purchased</div>
            <div style="font-weight:700; color:#D4AF37;">${formatWeight(totalGoldPurchased)}</div>
          </div>
          <div style="background:#FAF7F0; padding:10px; border-radius:6px; text-align:center;">
            <div style="font-size:10px; color:#666;">Total Bill</div>
            <div style="font-weight:700; color:#D4AF37;">${formatPKR(totalCashBill)}</div>
          </div>
          <div style="background:#FAF7F0; padding:10px; border-radius:6px; text-align:center;">
            <div style="font-size:10px; color:#666;">Total Paid</div>
            <div style="font-weight:700; color:#D4AF37;">${formatPKR(totalCashPaid)}</div>
          </div>
          <div style="background:#FAF7F0; padding:10px; border-radius:6px; text-align:center;">
            <div style="font-size:10px; color:#666;">Balance</div>
            <div style="font-weight:700; color:${cashBalance > 0 ? '#DC2626' : '#25D366'};">${formatPKR(Math.abs(cashBalance))}</div>
          </div>
        </div>

        <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
          <thead>
            <tr style="background:#FAF7F0;">
              <th style="border:1px solid #ddd; padding:8px; text-align:left; font-size:11px; color:#D4AF37;">Date</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:left; font-size:11px; color:#D4AF37;">Item</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:right; font-size:11px; color:#D4AF37;">Weight</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:right; font-size:11px; color:#D4AF37;">Karat</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:right; font-size:11px; color:#D4AF37;">Rate/g</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:right; font-size:11px; color:#D4AF37;">Total</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:right; font-size:11px; color:#D4AF37;">Paid</th>
              <th style="border:1px solid #ddd; padding:8px; text-align:right; font-size:11px; color:#D4AF37;">Balance</th>
            </tr>
          </thead>
          <tbody>
            ${allTransactions.map(t => `
              <tr>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px;">${formatDate(t.date)}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px;">${t.desc}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px; text-align:right;">${formatWeight(t.gold_weight)}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px; text-align:right;">${t.gold_karat || '—'}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px; text-align:right;">${t.gold_rate > 0 ? formatPKR(t.gold_rate) : '—'}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px; text-align:right;">${formatPKR(t.total)}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px; text-align:right;">${formatPKR(t.paid)}</td>
                <td style="border:1px solid #ddd; padding:8px; font-size:11px; text-align:right;">${formatPKR(t.balance)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div style="text-align:center; margin-top:30px; padding-top:15px; border-top:1px solid #eee; font-size:10px; color:#999;">
          ${shopInfo.name} © ${new Date().getFullYear()} | Generated: ${formatDateTime(new Date())}
        </div>
      `;
      document.getElementById('invoiceModal').classList.add('active');
    }

    function sendLedgerWhatsApp() {
      let totalGoldPurchased = Number(currentSupplier.opening_gold) || 0;
      let totalCashBill = Number(currentSupplier.opening_cash) || 0;
      let totalCashPaid = 0;
      allTransactions.forEach(t => {
        totalGoldPurchased += t.gold_weight;
        totalCashBill += t.total;
        totalCashPaid += t.paid;
      });
      
      let msg = `*GOLD SUPPLIER LEDGER*\n*${shopInfo.name}*\n\n🏭 Supplier: ${currentSupplier.name}\n📞 ${currentSupplier.phone}\n\n`;
      msg += `🪙 Total Gold Purchased: ${formatWeight(totalGoldPurchased)}\n`;
      msg += `💰 Total Bill: ${formatPKR(totalCashBill)}\n`;
      msg += `💰 Total Paid: ${formatPKR(totalCashPaid)}\n`;
      msg += `💰 Balance: ${formatPKR(Math.abs(totalCashBill - totalCashPaid))}\n\n`;
      msg += `Thank you!`;
      
      openWhatsApp(currentSupplier.phone, msg);
    }

    function sendLedgerEmail() {
      let subject = `Supplier Ledger – ${currentSupplier.name}`;
      let body = `Gold Supplier Ledger\n\nName: ${currentSupplier.name}\nPhone: ${currentSupplier.phone}\n\n`;
      
      let totalGoldPurchased = Number(currentSupplier.opening_gold) || 0;
      let totalCashBill = Number(currentSupplier.opening_cash) || 0;
      let totalCashPaid = 0;
      allTransactions.forEach(t => {
        totalGoldPurchased += t.gold_weight;
        totalCashBill += t.total;
        totalCashPaid += t.paid;
      });
      
      body += `Total Gold Purchased: ${formatWeight(totalGoldPurchased)}\n`;
      body += `Total Bill: ${formatPKR(totalCashBill)}\n`;
      body += `Total Paid: ${formatPKR(totalCashPaid)}\n`;
      body += `Balance: ${formatPKR(Math.abs(totalCashBill - totalCashPaid))}\n`;
      
      const email = prompt('Enter email address:', '');
      if (email) sendEmail(email, subject, body);
    }
  </script>

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW error:', err));
    });
  }
</script>
