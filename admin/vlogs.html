<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vlogs – Akbar Jewellers Admin</title>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: #0A0A0A; color: #FFF8DC; font-family: 'Poppins', sans-serif; }
    .admin-header { background: #1C1C1C; border-bottom: 2px solid #FFD700; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .admin-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: #FFD700; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .admin-logo img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #FFD700; }
    .admin-nav { display: flex; gap: 20px; align-items: center; }
    .admin-nav a { color: #FFF8DC; text-decoration: none; font-size: 0.9rem; }
    .admin-nav a:hover, .admin-nav a.active { color: #FFD700; }
    .logout-btn { background: rgba(220,38,38,0.2); color: #FCA5A5; padding: 8px 18px; border-radius: 50px; border: 1px solid #DC2626; cursor: pointer; font-size: 0.85rem; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #FFD700; }
    .btn-add { background: linear-gradient(135deg, #FFD700, #C9A227); color: #0A0A0A; padding: 12px 28px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; }
    .vlogs-admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 25px; }
    .vlog-admin-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; overflow: hidden; transition: all 0.3s; }
    .vlog-admin-card:hover { border-color: #FFD700; box-shadow: 0 10px 30px rgba(255,215,0,0.2); }
    .vlog-thumb { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
    .vlog-thumb img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .vlog-admin-info { padding: 15px; }
    .vlog-admin-info h4 { color: #FFD700; font-family: 'Playfair Display', serif; font-size: 1rem; margin-bottom: 6px; }
    .vlog-admin-info p { color: #B8B8B8; font-size: 0.85rem; margin-bottom: 10px; }
    .vlog-admin-actions { display: flex; gap: 8px; }
    .btn-action { flex: 1; padding: 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; border: 1px solid; font-family: 'Poppins', sans-serif; }
    .btn-edit { background: rgba(59,130,246,0.2); color: #93C5FD; border-color: #3B82F6; }
    .btn-delete { background: rgba(220,38,38,0.2); color: #FCA5A5; border-color: #DC2626; }
    .admin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .admin-modal.active { display: flex; }
    .admin-modal-content { background: #1C1C1C; border: 2px solid #FFD700; border-radius: 20px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; }
    .admin-modal-content h2 { color: #FFD700; font-family: 'Playfair Display', serif; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-label { color: #FFD700; font-size: 0.85rem; display: block; margin-bottom: 6px; font-weight: 600; }
    .form-input { width: 100%; padding: 10px 14px; background: #0A0A0A; border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; color: #FFF8DC; font-family: 'Poppins', sans-serif; font-size: 0.9rem; }
    .form-input:focus { outline: none; border-color: #FFD700; }
    @media (max-width: 768px) {
      .admin-nav a:not(.logout-btn) { display: none; }
      .admin-nav a.mobile-show { display: block; }
    }
  </style>
</head>
<body>

  <div class="admin-header">
    <div class="admin-logo">
      <img src="../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      AKBAR JEWELLERS – Admin
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html" class="mobile-show">Dashboard</a>
      <a href="products.html" class="mobile-show">Products</a>
      <a href="orders.html" class="mobile-show">Orders</a>
      <a href="blogs.html" class="mobile-show">Blogs</a>
      <a href="vlogs.html" class="active mobile-show">Vlogs</a>
      <a href="settings.html" class="mobile-show">Settings</a>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>
  </div>

  <div style="max-width: 1400px; margin: 0 auto; padding: 25px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 class="section-title">Vlogs Management</h1>
      <button class="btn-add" onclick="openVlogModal()">+ Add New Vlog</button>
    </div>

    <div style="background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(59,130,246,0.02)); border: 1px solid #3B82F6; border-radius: 12px; padding: 15px; margin-bottom: 25px;">
      <strong style="color: #93C5FD;">💡 How to add a vlog:</strong>
      <p style="color: #B8B8B8; font-size: 0.85rem; margin-top: 4px;">
        YouTube video ka URL paste karein (e.g., https://www.youtube.com/watch?v=VIDEO_ID). Title aur description likhein. Save karein.
      </p>
    </div>

    <div id="vlogsGrid" class="vlogs-admin-grid">
      <div style="text-align: center; padding: 40px; color: #FFD700; grid-column: 1/-1;">Loading vlogs...</div>
    </div>
  </div>

  <div id="vlogModal" class="admin-modal">
    <div class="admin-modal-content">
      <h2 id="vlogModalTitle">Add New Vlog</h2>

      <form id="vlogForm">
        <input type="hidden" id="editVlogId">

        <div class="form-group">
          <label class="form-label">YouTube URL *</label>
          <input type="url" id="vlogYoutubeUrl" class="form-input" placeholder="https://www.youtube.com/watch?v=..." required>
        </div>

        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" id="vlogTitle" class="form-input" placeholder="e.g., Gold Bridal Collection 2026" required>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="vlogDescription" class="form-input" rows="3" placeholder="Short description..."></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="vlogCategory" class="form-input">
              <option value="showcase">Showcase</option>
              <option value="bridal">Bridal</option>
              <option value="diamond">Diamond</option>
              <option value="kundan">Kundan</option>
              <option value="antique">Antique</option>
              <option value="gold">Gold</option>
              <option value="silver">Silver</option>
              <option value="artificial">Artificial</option>
              <option value="shop-tour">Shop Tour</option>
              <option value="behind-scenes">Behind Scenes</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Display Order</label>
            <input type="number" id="vlogOrder" class="form-input" value="0">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Active</label>
          <select id="vlogActive" class="form-input">
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="button" onclick="closeVlogModal()" style="flex:1; padding:12px; background:transparent; border:2px solid #FFD700; color:#FFD700; border-radius:50px; cursor:pointer; font-family: 'Poppins', sans-serif;">Cancel</button>
          <button type="submit" class="btn-add" style="flex:1;">Save Vlog</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    function checkAuth() {
      const session = localStorage.getItem('akbar_admin_session');
      if (!session) { window.location.href = 'login.html'; return false; }
      try {
        const data = JSON.parse(session);
        if (Date.now() > data.expires_at) {
          localStorage.removeItem('akbar_admin_session');
          window.location.href = 'login.html';
          return false;
        }
        return true;
      } catch { window.location.href = 'login.html'; return false; }
    }
    function logout() { localStorage.removeItem('akbar_admin_session'); window.location.href = 'login.html'; }

    function extractYoutubeId(url) {
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
        /youtube\.com\/shorts\/([^&\n?#]+)/
      ];
      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      return null;
    }

    function openVlogModal() {
      document.getElementById('vlogModalTitle').textContent = 'Add New Vlog';
      document.getElementById('vlogForm').reset();
      document.getElementById('editVlogId').value = '';
      document.getElementById('vlogModal').classList.add('active');
    }

    function closeVlogModal() {
      document.getElementById('vlogModal').classList.remove('active');
    }

    async function loadVlogs() {
      const grid = document.getElementById('vlogsGrid');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/vlogs?select=*&order=display_order.asc,created_at.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const vlogs = await res.json();

        if (!vlogs || vlogs.length === 0) {
          grid.innerHTML = '<p style="color:#B8B8B8; grid-column:1/-1; text-align:center; padding:40px;">No vlogs yet. Click "+ Add New Vlog" to start.</p>';
          return;
        }

        grid.innerHTML = vlogs.map(v => `
          <div class="vlog-admin-card">
            <div class="vlog-thumb">
              <img src="https://img.youtube.com/vi/${v.youtube_id}/mqdefault.jpg" alt="${v.title}">
            </div>
            <div class="vlog-admin-info">
              <h4>${v.title}</h4>
              <p>${v.category || 'Video'} • Order: ${v.display_order || 0}</p>
              <div class="vlog-admin-actions">
                <button class="btn-action btn-edit" onclick='editVlog(${JSON.stringify(v).replace(/'/g, "&#39;")})'>✏️ Edit</button>
                <button class="btn-action btn-delete" onclick="deleteVlog('${v.id}')">🗑️ Delete</button>
              </div>
            </div>
          </div>
        `).join('');

      } catch (e) {
        console.error(e);
        grid.innerHTML = '<p style="color:#FCA5A5; grid-column:1/-1; text-align:center; padding:40px;">Error loading vlogs</p>';
      }
    }

    function editVlog(v) {
      document.getElementById('vlogModalTitle').textContent = 'Edit Vlog';
      document.getElementById('editVlogId').value = v.id;
      document.getElementById('vlogYoutubeUrl').value = `https://www.youtube.com/watch?v=${v.youtube_id}`;
      document.getElementById('vlogTitle').value = v.title || '';
      document.getElementById('vlogDescription').value = v.description || '';
      document.getElementById('vlogCategory').value = v.category || 'showcase';
      document.getElementById('vlogOrder').value = v.display_order || 0;
      document.getElementById('vlogActive').value = v.is_active ? 'true' : 'false';
      document.getElementById('vlogModal').classList.add('active');
    }

    document.getElementById('vlogForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('editVlogId').value;
      const isEdit = !!editId;

      const url = document.getElementById('vlogYoutubeUrl').value.trim();
      const youtubeId = extractYoutubeId(url);

      if (!youtubeId) {
        alert('❌ Invalid YouTube URL. Please paste a valid URL.');
        return;
      }

      const data = {
        youtube_id: youtubeId,
        title: document.getElementById('vlogTitle').value.trim(),
        description: document.getElementById('vlogDescription').value.trim(),
        category: document.getElementById('vlogCategory').value,
        display_order: parseInt(document.getElementById('vlogOrder').value) || 0,
        is_active: document.getElementById('vlogActive').value === 'true'
      };

      try {
        const apiUrl = isEdit
          ? `${SUPABASE_URL}/rest/v1/vlogs?id=eq.${editId}`
          : `${SUPABASE_URL}/rest/v1/vlogs`;
        const method = isEdit ? 'PATCH' : 'POST';

        const res = await fetch(apiUrl, {
          method,
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        if (!res.ok) throw new Error(await res.text());

        alert('✅ Vlog ' + (isEdit ? 'updated' : 'added'));
        closeVlogModal();
        loadVlogs();
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    });

    async function deleteVlog(id) {
      if (!confirm('Delete this vlog?')) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/vlogs?id=eq.${id}`, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (!res.ok) throw new Error('Delete failed');
        alert('✅ Deleted');
        loadVlogs();
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!checkAuth()) return;
      loadVlogs();
    });
  </script>

</body>
</html>
