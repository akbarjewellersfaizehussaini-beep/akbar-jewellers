<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings – SHAH REHAN JEWELLERS Admin</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon-admin.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: #0A0A0A; color: #FFF8DC; font-family: 'Poppins', sans-serif; }
    .admin-header { background: #1C1C1C; border-bottom: 2px solid #FFD700; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .admin-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: #FFD700; font-weight: 700; }
    .admin-nav { display: flex; gap: 20px; align-items: center; }
    .admin-nav a { color: #FFF8DC; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
    .admin-nav a:hover, .admin-nav a.active { color: #FFD700; }
    .logout-btn { background: rgba(220,38,38,0.2); color: #FCA5A5; padding: 8px 18px; border-radius: 50px; border: 1px solid #DC2626; cursor: pointer; font-size: 0.85rem; font-family: 'Poppins', sans-serif; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #FFD700; margin-bottom: 20px; }
    .settings-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 16px; padding: 25px; margin-bottom: 25px; }
    .settings-card h3 { color: #FFD700; font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,215,0,0.1); }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { color: #B8B8B8; font-size: 0.9rem; }
    .setting-value { color: #FFD700; font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 12px; }
    .edit-icon { background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.4); color: #FFD700; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; font-size: 0.9rem; }
    .edit-icon:hover { background: #FFD700; color: #0A0A0A; transform: scale(1.1); }
    .add-btn { background: linear-gradient(135deg, #FFD700, #C9A227); color: #0A0A0A; padding: 10px 20px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; font-family: 'Poppins', sans-serif; }
    .add-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,215,0,0.4); }
    .pay-section-title { color: #FFD700; font-family: 'Playfair Display', serif; font-size: 1.1rem; margin: 20px 0 12px; display: flex; align-items: center; gap: 8px; }
    .pay-section-title img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #FFD700; }
    .bank-card { background: rgba(255,215,0,0.05); border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 15px; margin-bottom: 12px; }
    .bank-card h4 { color: #FFD700; font-size: 1rem; margin-bottom: 8px; }
    .bank-card p { color: #B8B8B8; font-size: 0.85rem; margin-bottom: 4px; }
    .bank-card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-small { padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; border: 1px solid; font-family: 'Poppins', sans-serif; }
    .btn-edit-small { background: rgba(59,130,246,0.2); color: #93C5FD; border-color: #3B82F6; }
    .btn-edit-small:hover { background: #3B82F6; color: white; }
    .btn-delete-small { background: rgba(220,38,38,0.2); color: #FCA5A5; border-color: #DC2626; }
    .btn-delete-small:hover { background: #DC2626; color: white; }
    .admin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .admin-modal.active { display: flex; }
    .admin-modal-content { background: #1C1C1C; border: 2px solid #FFD700; border-radius: 20px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; }
    .admin-modal-content h2 { color: #FFD700; font-family: 'Playfair Display', serif; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-label { color: #FFD700; font-size: 0.85rem; display: block; margin-bottom: 6px; font-weight: 600; }
    .form-input { width: 100%; padding: 10px 14px; background: #0A0A0A; border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; color: #FFF8DC; font-family: 'Poppins', sans-serif; }
    .form-input:focus { outline: none; border-color: #FFD700; }
    @media (max-width: 768px) { .admin-nav a:not(.logout-btn) { display: none; } }
  </style>
</head>
<body>

  <div class="admin-header">
    <div class="admin-logo">SHAH REHAN JEWELLERS – Admin</div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html">Orders</a>
      <a href="vlogs.html">Vlogs</a>
      <a href="blogs.html">Blogs</a>
      <a href="settings.html" class="active">Settings</a>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>
  </div>

  <div style="max-width: 1000px; margin: 0 auto; padding: 25px;">
    <h1 class="section-title">Settings</h1>

    <!-- CHARGES CONFIGURATION -->
    <div class="settings-card">
      <h3>⚙️ Charges Configuration</h3>
      <div id="chargesContainer">
        <div class="setting-row">
          <span class="setting-label">Making Charges</span>
          <span class="setting-value">
            <span id="makingChargesValue">15%</span>
            <button class="edit-icon" onclick="editCharge('Making Charges', 15)">✏️</button>
          </span>
        </div>
        <div class="setting-row">
          <span class="setting-label">Polish Charges</span>
          <span class="setting-value">
            <span id="polishChargesValue">10%</span>
            <button class="edit-icon" onclick="editCharge('Polish Charges', 10)">✏️</button>
          </span>
        </div>
        <div class="setting-row">
          <span class="setting-label">GST</span>
          <span class="setting-value">
            <span id="gstValue">3%</span>
            <button class="edit-icon" onclick="editCharge('GST', 3)">✏️</button>
          </span>
        </div>
        <div class="setting-row">
          <span class="setting-label">Service Charges (Biscuit)</span>
          <span class="setting-value">
            <span id="serviceChargesValue">1%</span>
            <button class="edit-icon" onclick="editCharge('Service Charges', 1)">✏️</button>
          </span>
        </div>
      </div>
    </div>

    <!-- PAYMENT DETAILS -->
    <div class="settings-card">
      <h3>💳 Payment Details</h3>

      <!-- Easypaisa Section -->
      <div class="pay-section-title">
        <img src="../images/easypaisa.jpg" alt="Easypaisa" onerror="this.src='../images/placeholder.svg'">
        Easypaisa
        <button class="add-btn" style="margin-left: auto;" onclick="openPayModal('easypaisa')">+ Add</button>
      </div>
      <div id="easypaisaContainer"></div>

      <!-- JazzCash Section -->
      <div class="pay-section-title">
        <img src="../images/jazzcash.jpg" alt="JazzCash" onerror="this.src='../images/placeholder.svg'">
        JazzCash
        <button class="add-btn" style="margin-left: auto;" onclick="openPayModal('jazzcash')">+ Add</button>
      </div>
      <div id="jazzcashContainer"></div>

      <!-- Bank Section -->
      <div class="pay-section-title">
        <img src="../images/bank.jpg" alt="Bank" onerror="this.src='../images/placeholder.svg'">
        Bank Transfer
        <button class="add-btn" style="margin-left: auto;" onclick="openPayModal('bank')">+ Add Bank</button>
      </div>
      <div id="bankContainer"></div>
    </div>
  </div>

  <!-- Charge Edit Modal -->
  <div id="chargeModal" class="admin-modal">
    <div class="admin-modal-content">
      <h2 id="chargeModalTitle">Edit Charge</h2>
      <form id="chargeForm">
        <div class="form-group">
          <label class="form-label">Charge Name</label>
          <input type="text" id="chargeName" class="form-input" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Value (%)</label>
          <input type="number" id="chargeValue" class="form-input" step="0.1" min="0" required>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="button" onclick="closeChargeModal()" style="flex:1; padding:12px; background:transparent; border:2px solid #FFD700; color:#FFD700; border-radius:50px; cursor:pointer;">Cancel</button>
          <button type="submit" class="add-btn" style="flex:1; justify-content:center;">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Payment Method Modal -->
  <div id="payModal" class="admin-modal">
    <div class="admin-modal-content">
      <h2 id="payModalTitle">Add Payment Method</h2>
      <form id="payForm">
        <input type="hidden" id="editPayId">
        <input type="hidden" id="payType">
        <div class="form-group">
          <label class="form-label">Method Name *</label>
          <input type="text" id="payName" class="form-input" placeholder="e.g., Easypaisa / Meezan Bank" required>
        </div>
        <div class="form-group">
          <label class="form-label">Account Title *</label>
          <input type="text" id="payTitle" class="form-input" placeholder="e.g., Syed Ahmed Bilal" required>
        </div>
        <div class="form-group">
          <label class="form-label">Account Number / IBAN *</label>
          <input type="text" id="payNumber" class="form-input" placeholder="e.g., 03266501314 / PK36MEZN..." required>
        </div>
        <div class="form-group">
          <label class="form-label">Branch (Bank only, optional)</label>
          <input type="text" id="payBranch" class="form-input" placeholder="e.g., Lahore Cantt">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="button" onclick="closePayModal()" style="flex:1; padding:12px; background:transparent; border:2px solid #FFD700; color:#FFD700; border-radius:50px; cursor:pointer;">Cancel</button>
          <button type="submit" class="add-btn" style="flex:1; justify-content:center;">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    function checkAuth() {
      const session = localStorage.getItem('srj_admin_session');
      if (!session) { window.location.href = 'login.html'; return false; }
      try {
        const data = JSON.parse(session);
        if (Date.now() > data.expires_at) {
          localStorage.removeItem('srj_admin_session');
          window.location.href = 'login.html';
          return false;
        }
        return true;
      } catch { window.location.href = 'login.html'; return false; }
    }
    function logout() { localStorage.removeItem('srj_admin_session'); window.location.href = 'login.html'; }

    // ===== CHARGES =====
    function editCharge(name, currentValue) {
      document.getElementById('chargeModalTitle').textContent = 'Edit ' + name;
      document.getElementById('chargeName').value = name;
      document.getElementById('chargeValue').value = currentValue;
      document.getElementById('chargeModal').classList.add('active');
    }
    function closeChargeModal() { document.getElementById('chargeModal').classList.remove('active'); }

    document.getElementById('chargeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('chargeName').value;
      const value = parseFloat(document.getElementById('chargeValue').value);
      if (name === 'Making Charges') document.getElementById('makingChargesValue').textContent = value + '%';
      if (name === 'Polish Charges') document.getElementById('polishChargesValue').textContent = value + '%';
      if (name === 'GST') document.getElementById('gstValue').textContent = value + '%';
      if (name === 'Service Charges') document.getElementById('serviceChargesValue').textContent = value + '%';
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/settings?setting_key=eq.${encodeURIComponent(name)}`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const existing = await res.json();
        if (existing && existing.length > 0) {
          await fetch(`${SUPABASE_URL}/rest/v1/settings?setting_key=eq.${encodeURIComponent(name)}`, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ setting_value: value.toString() })
          });
        } else {
          await fetch(`${SUPABASE_URL}/rest/v1/settings`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ setting_key: name, setting_value: value.toString() })
          });
        }
        alert('✅ ' + name + ' updated to ' + value + '%');
        closeChargeModal();
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    });

    // ===== PAYMENT METHODS =====
    function openPayModal(type) {
      document.getElementById('payModalTitle').textContent = 'Add ' + type.charAt(0).toUpperCase() + type.slice(1);
      document.getElementById('payForm').reset();
      document.getElementById('editPayId').value = '';
      document.getElementById('payType').value = type;
      document.getElementById('payModal').classList.add('active');
    }
    function closePayModal() { document.getElementById('payModal').classList.remove('active'); }

    async function loadPaymentMethods() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/payment_methods?select=*&order=created_at.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const methods = await res.json();

        const containers = {
          easypaisa: document.getElementById('easypaisaContainer'),
          jazzcash: document.getElementById('jazzcashContainer'),
          bank: document.getElementById('bankContainer')
        };

        // Clear
        Object.values(containers).forEach(c => c.innerHTML = '');

        const grouped = { easypaisa: [], jazzcash: [], bank: [] };
        methods.forEach(m => {
          if (grouped[m.method_type]) grouped[m.method_type].push(m);
        });

        Object.keys(grouped).forEach(type => {
          if (grouped[type].length === 0) {
            containers[type].innerHTML = `<p style="color:#B8B8B8; font-size:0.85rem; padding:10px;">No ${type} accounts yet</p>`;
          } else {
            containers[type].innerHTML = grouped[type].map(m => `
              <div class="bank-card">
                <h4>${m.method_name}</h4>
                <p><strong>Title:</strong> ${m.account_title}</p>
                <p><strong>Account:</strong> ${m.account_number}</p>
                ${m.branch ? `<p><strong>Branch:</strong> ${m.branch}</p>` : ''}
                <div class="bank-card-actions">
                  <button class="btn-small btn-edit-small" onclick='editPay(${JSON.stringify(m).replace(/'/g, "&#39;")})'>✏️ Edit</button>
                  <button class="btn-small btn-delete-small" onclick="deletePay('${m.id}')">🗑️ Delete</button>
                </div>
              </div>
            `).join('');
          }
        });
      } catch (e) {
        console.error(e);
        alert('❌ Error loading payment methods: ' + e.message);
      }
    }

    function editPay(m) {
      document.getElementById('payModalTitle').textContent = 'Edit ' + m.method_type;
      document.getElementById('editPayId').value = m.id;
      document.getElementById('payType').value = m.method_type;
      document.getElementById('payName').value = m.method_name || '';
      document.getElementById('payTitle').value = m.account_title || '';
      document.getElementById('payNumber').value = m.account_number || '';
      document.getElementById('payBranch').value = m.branch || '';
      document.getElementById('payModal').classList.add('active');
    }

    document.getElementById('payForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('editPayId').value;
      const isEdit = !!editId;

      const data = {
        method_type: document.getElementById('payType').value,
        method_name: document.getElementById('payName').value.trim(),
        account_title: document.getElementById('payTitle').value.trim(),
        account_number: document.getElementById('payNumber').value.trim(),
        branch: document.getElementById('payBranch').value.trim() || null,
        is_active: true
      };

      try {
        const url = isEdit ? `${SUPABASE_URL}/rest/v1/payment_methods?id=eq.${editId}` : `${SUPABASE_URL}/rest/v1/payment_methods`;
        const method = isEdit ? 'PATCH' : 'POST';

        const res = await fetch(url, {
          method,
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!res.ok) throw new Error(await res.text());

        alert('✅ Payment method ' + (isEdit ? 'updated' : 'added'));
        closePayModal();
        loadPaymentMethods();
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    });

    async function deletePay(id) {
      if (!confirm('Delete this payment method?')) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/payment_methods?id=eq.${id}`, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (!res.ok) throw new Error('Delete failed');
        alert('✅ Deleted');
        loadPaymentMethods();
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    }

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('admin-modal')) {
        e.target.classList.remove('active');
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.admin-modal').forEach(m => m.classList.remove('active'));
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (!checkAuth()) return;
      loadPaymentMethods();
    });
  </script>
</body>
</html>
