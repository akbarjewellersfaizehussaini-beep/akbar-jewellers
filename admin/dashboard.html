<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – SHAH REHAN JEWELLERS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: #0A0A0A; color: #FFF8DC; font-family: 'Poppins', sans-serif; }
    .admin-header { background: #1C1C1C; border-bottom: 2px solid #FFD700; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .admin-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: #FFD700; font-weight: 700; }
    .admin-nav { display: flex; gap: 20px; align-items: center; }
    .admin-nav a { color: #FFF8DC; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
    .admin-nav a:hover, .admin-nav a.active { color: #FFD700; }
    .logout-btn { background: rgba(220,38,38,0.2); color: #FCA5A5; padding: 8px 18px; border-radius: 50px; border: 1px solid #DC2626; cursor: pointer; font-size: 0.85rem; transition: all 0.3s; }
    .logout-btn:hover { background: #DC2626; color: white; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
    .stat-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 16px; padding: 25px; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #FFD700, #FFF8DC, #FFD700); }
    .stat-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .stat-value { font-size: 2rem; font-weight: 700; color: #FFD700; font-family: 'Playfair Display', serif; }
    .stat-label { color: #B8B8B8; font-size: 0.85rem; margin-top: 5px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin: 40px 0 20px; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #FFD700; }
    .btn-add { background: linear-gradient(135deg, #FFD700, #C9A227); color: #0A0A0A; padding: 12px 28px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,215,0,0.4); }
    .products-admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .admin-product-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; overflow: hidden; transition: all 0.3s; }
    .admin-product-card:hover { border-color: #FFD700; box-shadow: 0 10px 30px rgba(255,215,0,0.2); }
    .admin-product-card img { width: 100%; height: 180px; object-fit: cover; }
    .admin-product-info { padding: 15px; }
    .admin-product-info h4 { color: #FFD700; font-family: 'Playfair Display', serif; font-size: 1rem; margin-bottom: 8px; }
    .admin-product-info .price { color: #FFF8DC; font-weight: 600; margin-bottom: 12px; }
    .admin-product-actions { display: flex; gap: 8px; }
    .btn-edit { flex: 1; background: rgba(59,130,246,0.2); color: #93C5FD; border: 1px solid #3B82F6; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.3s; }
    .btn-edit:hover { background: #3B82F6; color: white; }
    .btn-delete { flex: 1; background: rgba(220,38,38,0.2); color: #FCA5A5; border: 1px solid #DC2626; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.3s; }
    .btn-delete:hover { background: #DC2626; color: white; }
    .loading { text-align: center; padding: 40px; color: #FFD700; }
    .admin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .admin-modal.active { display: flex; }
    .admin-modal-content { background: #1C1C1C; border: 2px solid #FFD700; border-radius: 20px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .admin-modal-content h2 { color: #FFD700; font-family: 'Playfair Display', serif; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-label { color: #FFD700; font-size: 0.85rem; display: block; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 10px 14px; background: #0A0A0A; border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; color: #FFF8DC; }
    .form-input:focus { outline: none; border-color: #FFD700; }
    @media (max-width: 768px) {
      .admin-nav a:not(.logout-btn) { display: none; }
      .admin-nav a.mobile-show { display: block; }
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="../images/favicon-admin.svg">
</head>
<body>

  <div class="admin-header">
    <div class="admin-logo">SHAH REHAN JEWELLERS – Admin</div>
    <nav class="admin-nav">
      <a href="dashboard.html" class="active mobile-show">Dashboard</a>
      <a href="products.html" class="mobile-show">Products</a>
      <a href="orders.html" class="mobile-show">Orders</a>
      <a href="vlogs.html" class="mobile-show">Vlogs</a>
      <a href="settings.html" class="mobile-show">Settings</a>
      <a href="software.html" class="mobile-show">Software</a>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>
  </div>

  <div style="max-width: 1400px; margin: 0 auto; padding: 25px;">
    <h1 class="section-title">Dashboard Overview</h1>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-value" id="statProducts">0</div>
        <div class="stat-label">Total Products</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🛒</div>
        <div class="stat-value" id="statOrders">0</div>
        <div class="stat-label">Total Orders</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-value" id="statRevenue">Rs 0</div>
        <div class="stat-label">Revenue</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏳</div>
        <div class="stat-value" id="statPending">0</div>
        <div class="stat-label">Pending Orders</div>
      </div>
    </div>
    
    <div class="section-header">
      <h2 class="section-title">Products</h2>
      <button class="btn-add" onclick="openAddProductModal()">+ Add Product</button>
    </div>
    
    <div id="adminProductsGrid" class="products-admin-grid">
      <div class="loading">Loading products...</div>
    </div>
  </div>

  <div id="productModal" class="admin-modal">
    <div class="admin-modal-content">
      <h2 id="modalTitle">Add New Product</h2>
      <form id="productForm">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input type="text" id="pName" class="form-input" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label class="form-label">Category *</label>
            <select id="pCategory" class="form-input" required>
              <option value="">Select</option>
              <option value="gold">Gold</option>
              <option value="silver">Silver</option>
              <option value="diamond">Diamond</option>
              <option value="artificial">Artificial</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Subcategory</label>
            <input type="text" id="pSubcategory" class="form-input" placeholder="e.g. Rings">
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label class="form-label">Karat</label>
            <select id="pKarat" class="form-input">
              <option value="">N/A</option>
              <option value="24K">24K</option>
              <option value="22K">22K</option>
              <option value="21K">21K</option>
              <option value="18K">18K</option>
              <option value="16K">16K</option>
              <option value="14K">14K</option>
              <option value="12K">12K</option>
              <option value="10K">10K</option>
              <option value="8K">8K</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Weight (grams)</label>
            <input type="number" id="pWeight" class="form-input" step="0.1">
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label class="form-label">Size</label>
            <input type="text" id="pSize" class="form-input" placeholder="e.g. 16">
          </div>
          <div class="form-group">
            <label class="form-label">Price (Rs) *</label>
            <input type="number" id="pPrice" class="form-input" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Image URL</label>
          <input type="url" id="pImage" class="form-input" placeholder="https://...">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="pDescription" class="form-input" rows="3"></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label class="form-label">Stock</label>
            <input type="number" id="pStock" class="form-input" value="0">
          </div>
          <div class="form-group">
            <label class="form-label">Featured</label>
            <select id="pFeatured" class="form-input">
              <option value="false">No</option>
              <option value="true">Yes</option>
            </select>
          </div>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="button" onclick="closeModal()" style="flex: 1; padding: 12px; background: transparent; border: 2px solid #FFD700; color: #FFD700; border-radius: 50px; cursor: pointer;">Cancel</button>
          <button type="submit" class="btn-add" style="flex: 1;">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script src="../js/admin.js"></script>

</body>
</html>
