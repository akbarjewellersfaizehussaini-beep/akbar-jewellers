<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogs Management – SHAH REHAN JEWELLERS Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: #0A0A0A; color: #FFF8DC; font-family: 'Poppins', sans-serif; }
    .admin-header { background: #1C1C1C; border-bottom: 2px solid #FFD700; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .admin-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: #FFD700; font-weight: 700; }
    .admin-nav { display: flex; gap: 20px; align-items: center; }
    .admin-nav a { color: #FFF8DC; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
    .admin-nav a:hover, .admin-nav a.active { color: #FFD700; }
    .logout-btn { background: rgba(220,38,38,0.2); color: #FCA5A5; padding: 8px 18px; border-radius: 50px; border: 1px solid #DC2626; cursor: pointer; font-size: 0.85rem; font-family: 'Poppins', sans-serif; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #FFD700; }
    .btn-add { background: linear-gradient(135deg, #FFD700, #C9A227); color: #0A0A0A; padding: 12px 28px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-family: 'Poppins', sans-serif; }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,215,0,0.4); }
    .blogs-admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 25px; }
    .blog-admin-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; overflow: hidden; transition: all 0.3s; }
    .blog-admin-card:hover { border-color: #FFD700; box-shadow: 0 10px 30px rgba(255,215,0,0.2); }
    .blog-admin-card img { width: 100%; height: 180px; object-fit: cover; }
    .blog-admin-info { padding: 15px; }
    .blog-admin-info h4 { color: #FFD700; font-family: 'Playfair Display', serif; font-size: 1rem; margin-bottom: 6px; }
    .blog-admin-info p { color: #B8B8B8; font-size: 0.85rem; margin-bottom: 10px; }
    .blog-status { display: inline-block; padding: 3px 10px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; margin-bottom: 10px; }
    .status-active { background: rgba(37,211,102,0.2); color: #86EFAC; }
    .status-inactive { background: rgba(220,38,38,0.2); color: #FCA5A5; }
    .blog-admin-actions { display: flex; gap: 8px; }
    .btn-action { flex: 1; padding: 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: all 0.3s; border: 1px solid; font-family: 'Poppins', sans-serif; }
    .btn-edit { background: rgba(59,130,246,0.2); color: #93C5FD; border-color: #3B82F6; }
    .btn-edit:hover { background: #3B82F6; color: white; }
    .btn-delete { background: rgba(220,38,38,0.2); color: #FCA5A5; border-color: #DC2626; }
    .btn-delete:hover { background: #DC2626; color: white; }
    .admin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .admin-modal.active { display: flex; }
    .admin-modal-content { background: #1C1C1C; border: 2px solid #FFD700; border-radius: 20px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; }
    .admin-modal-content h2 { color: #FFD700; font-family: 'Playfair Display', serif; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-label { color: #FFD700; font-size: 0.85rem; display: block; margin-bottom: 6px; font-weight: 600; }
    .form-input { width: 100%; padding: 10px 14px; background: #0A0A0A; border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; color: #FFF8DC; font-family: 'Poppins', sans-serif; font-size: 0.9rem; }
    .form-input:focus { outline: none; border-color: #FFD700; }
    .image-upload-box { border: 2px dashed rgba(255,215,0,0.4); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .image-upload-box:hover { border-color: #FFD700; background: rgba(255,215,0,0.05); }
    .image-preview { max-width: 200px; margin: 10px auto; border-radius: 8px; border: 2px solid #FFD700; display: none; }
    @media (max-width: 768px) {
      .admin-nav a:not(.logout-btn) { display: none; }
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="../images/favicon-admin.svg">
</head>
<body>

  <div class="admin-header">
    <div class="admin-logo">SHAH REHAN JEWELLERS – Admin</div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html">Orders</a>
      <a href="vlogs.html">Vlogs</a>
      <a href="blogs.html" class="active">Blogs</a>
      <a href="settings.html">Settings</a>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>
  </div>

  <div style="max-width: 1400px; margin: 0 auto; padding: 25px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 class="section-title">Blogs Management</h1>
      <button class="btn-add" onclick="openBlogModal()">+ Write New Blog</button>
    </div>

    <div style="background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(59,130,246,0.02)); border: 1px solid #3B82F6; border-radius: 12px; padding: 15px; margin-bottom: 25px;">
      <strong style="color: #93C5FD;">💡 How to write a blog:</strong>
      <p style="color: #B8B8B8; font-size: 0.85rem; margin-top: 4px;">
        Title, excerpt, content likhein. Featured image upload karein. Save karein — website pe automatic show hoga.
      </p>
    </div>

    <div id="blogsGrid" class="blogs-admin-grid">
      <div style="text-align: center; padding: 40px; color: #FFD700; grid-column: 1/-1;">Loading blogs...</div>
    </div>
  </div>

  <!-- Blog Modal -->
  <div id="blogModal" class="admin-modal">
    <div class="admin-modal-content">
      <h2 id="blogModalTitle">Write New Blog</h2>

      <form id="blogForm">
        <input type="hidden" id="editBlogId">

        <div class="form-group">
          <label class="form-label">Blog Title *</label>
          <input type="text" id="blogTitle" class="form-input" placeholder="e.g., Gold Rate Today in Lahore" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="blogCategory" class="form-input">
              <option value="Gold Rate">Gold Rate</option>
              <option value="Bridal">Bridal</option>
              <option value="Investment">Investment</option>
              <option value="Diamond">Diamond</option>
              <option value="Silver">Silver</option>
              <option value="Artificial">Artificial</option>
              <option value="Custom">Custom</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Author</label>
            <input type="text" id="blogAuthor" class="form-input" value="Shah Rehan Jewellers">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Excerpt (Short Summary) *</label>
          <textarea id="blogExcerpt" class="form-input" rows="2" placeholder="Short summary of your blog..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Full Content (HTML allowed) *</label>
          <textarea id="blogContent" class="form-input" rows="8" placeholder="<h2>Heading</h2><p>Your content here...</p>" required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Featured Image *</label>
          <div class="image-upload-box" onclick="document.getElementById('blogImage').click()">
            <p style="color: #FFD700;">📷 Click to Upload Image</p>
            <img id="imagePreview" class="image-preview">
          </div>
          <input type="file" id="blogImage" accept="image/*" style="display: none;" onchange="previewImage(this)">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="button" onclick="closeBlogModal()" style="flex:1; padding:12px; background:transparent; border:2px solid #FFD700; color:#FFD700; border-radius:50px; cursor:pointer; font-family: 'Poppins', sans-serif;">Cancel</button>
          <button type="submit" class="btn-add" style="flex:1;">Save Blog</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    let uploadedImageData = '';

    // ===== AUTH CHECK =====
    function checkAuth() {
      const session = localStorage.getItem('srj_admin_session');
      if (!session) {
        window.location.href = 'login.html';
        return false;
      }
      try {
        const data = JSON.parse(session);
        if (Date.now() > data.expires_at) {
          localStorage.removeItem('srj_admin_session');
          window.location.href = 'login.html';
          return false;
        }
        return true;
      } catch {
        window.location.href = 'login.html';
        return false;
      }
    }

    function logout() {
      localStorage.removeItem('srj_admin_session');
      window.location.href = 'login.html';
    }

    // ===== IMAGE PREVIEW =====
    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const preview = document.getElementById('imagePreview');
          preview.src = e.target.result;
          preview.style.display = 'block';
          uploadedImageData = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // ===== MODAL =====
    function openBlogModal() {
      document.getElementById('blogModalTitle').textContent = 'Write New Blog';
      document.getElementById('blogForm').reset();
      document.getElementById('editBlogId').value = '';
      document.getElementById('imagePreview').style.display = 'none';
      uploadedImageData = '';
      document.getElementById('blogModal').classList.add('active');
    }

    function closeBlogModal() {
      document.getElementById('blogModal').classList.remove('active');
    }

    // ===== LOAD BLOGS =====
    async function loadBlogs() {
      const grid = document.getElementById('blogsGrid');
      if (!grid) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/blogs?select=*&order=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }

        const blogs = await res.json();
        console.log('📚 Blogs loaded:', blogs.length);

        if (!blogs || blogs.length === 0) {
          grid.innerHTML = '<p style="color:#B8B8B8; grid-column:1/-1; text-align:center; padding:40px;">No blogs yet. Click "+ Write New Blog" to start.</p>';
          return;
        }

        grid.innerHTML = blogs.map(b => `
          <div class="blog-admin-card">
            <img src="${b.featured_image || '../images/placeholder.svg'}" onerror="this.src='../images/placeholder.svg'">
            <div class="blog-admin-info">
              <span class="blog-status ${b.is_published ? 'status-active' : 'status-inactive'}">
                ${b.is_published ? '✓ Published' : '✗ Draft'}
              </span>
              <h4>${b.title}</h4>
              <p>${b.category || 'Blog'} • ${b.author || 'Admin'}</p>
              <div class="blog-admin-actions">
                <button class="btn-action btn-edit" onclick='editBlog(${JSON.stringify(b).replace(/'/g, "&#39;")})'>✏️ Edit</button>
                <button class="btn-action btn-delete" onclick="deleteBlog('${b.id}')">🗑️ Delete</button>
              </div>
            </div>
          </div>
        `).join('');

      } catch (e) {
        console.error('❌ Error loading blogs:', e);
        grid.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:40px;">
            <p style="color:#FCA5A5; margin-bottom:10px;">⚠️ Error loading blogs</p>
            <p style="color:#B8B8B8; font-size:0.85rem;">${e.message}</p>
            <p style="color:#B8B8B8; font-size:0.85rem; margin-top:10px;">Check: RLS policy, login session, or Supabase connection.</p>
          </div>
        `;
      }
    }

    // ===== EDIT BLOG =====
    function editBlog(blog) {
      document.getElementById('blogModalTitle').textContent = 'Edit Blog';
      document.getElementById('editBlogId').value = blog.id;
      document.getElementById('blogTitle').value = blog.title || '';
      document.getElementById('blogCategory').value = blog.category || 'Gold Rate';
      document.getElementById('blogAuthor').value = blog.author || 'Shah Rehan Jewellers';
      document.getElementById('blogExcerpt').value = blog.excerpt || '';
      document.getElementById('blogContent').value = blog.content || '';
      uploadedImageData = blog.featured_image || '';

      if (uploadedImageData) {
        document.getElementById('imagePreview').src = uploadedImageData;
        document.getElementById('imagePreview').style.display = 'block';
      }

      document.getElementById('blogModal').classList.add('active');
    }

    // ===== SUBMIT BLOG =====
    document.getElementById('blogForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const editId = document.getElementById('editBlogId').value;
      const isEdit = !!editId;

      if (!uploadedImageData) {
        alert('❌ Please upload a featured image');
        return;
      }

      const title = document.getElementById('blogTitle').value.trim();
      const slug = title.toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-') + (isEdit ? '' : '-' + Date.now());

      const blogData = {
        title: title,
        slug: slug,
        category: document.getElementById('blogCategory').value,
        author: document.getElementById('blogAuthor').value.trim() || 'Shah Rehan Jewellers',
        excerpt: document.getElementById('blogExcerpt').value.trim(),
        content: document.getElementById('blogContent').value.trim(),
        featured_image: uploadedImageData,
        is_published: true
      };

      try {
        const url = isEdit
          ? `${SUPABASE_URL}/rest/v1/blogs?id=eq.${editId}`
          : `${SUPABASE_URL}/rest/v1/blogs`;
        const method = isEdit ? 'PATCH' : 'POST';

        const res = await fetch(url, {
          method,
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(blogData)
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(err);
        }

        alert('✅ Blog ' + (isEdit ? 'updated' : 'published') + ' successfully!');
        closeBlogModal();
        loadBlogs();

      } catch (error) {
        console.error('❌ Save error:', error);
        alert('❌ Error saving blog:\n\n' + error.message);
      }
    });

    // ===== DELETE BLOG =====
    async function deleteBlog(id) {
      if (!confirm('Delete this blog?\n\nThis action cannot be undone.')) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/blogs?id=eq.${id}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!res.ok) throw new Error('Delete failed');

        alert('✅ Blog deleted');
        loadBlogs();

      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    }

    // ===== CLOSE ON OUTSIDE CLICK / ESC =====
    document.addEventListener('click', (e) => {
      const modal = document.getElementById('blogModal');
      if (e.target === modal) closeBlogModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeBlogModal();
    });

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
      if (!checkAuth()) return;
      loadBlogs();
      console.log('✅ Admin Blogs loaded');
    });
  </script>
</body>
</html>
